<blockquote>
<p>เส้นบน = <strong>control flow</strong> ของโปรแกรม Python (บรรทัดไหนทำก่อน-หลัง) · เส้นล่าง = <strong>signal chain</strong> ที่ engine ทำให้เบื้องหลังทุกครั้งที่เราสั่งหนึ่งโน้ต — นี่คือเหตุผลที่เราเขียนเสียงได้โดยไม่ต้องแตะ DAC เอง</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="23" style="--paginate:true;--theme:default;" data-marpit-pagination-total="31">
<h1 id="%E0%B9%80%E0%B8%8A%E0%B8%B7%E0%B9%88%E0%B8%AD%E0%B8%A1%E0%B9%82%E0%B8%A2%E0%B8%87%E0%B8%A3%E0%B8%B2%E0%B8%81%E0%B8%90%E0%B8%B2%E0%B8%99--%E0%B9%80%E0%B8%AA%E0%B8%B5%E0%B8%A2%E0%B8%87%E0%B9%80%E0%B8%81%E0%B8%A1%E0%B9%80%E0%B8%8A%E0%B8%B7%E0%B9%88%E0%B8%AD%E0%B8%A1%E0%B8%81%E0%B8%B1%E0%B8%9A%E0%B8%A7%E0%B8%B4%E0%B8%A8%E0%B8%A7%E0%B8%81%E0%B8%A3%E0%B8%A3%E0%B8%A1%E0%B8%AD%E0%B8%B0%E0%B9%84%E0%B8%A3%E0%B8%9A%E0%B9%89%E0%B8%B2%E0%B8%87">เชื่อมโยงรากฐาน — เสียงเกมเชื่อมกับวิศวกรรมอะไรบ้าง</h1>
<p>แล็บเล็ก ๆ วันนี้แตะ &quot;รากฐาน&quot; ของวิศวกรรมสมองกลฝังตัวครบทั้ง 4 ด้าน — เสียง 1 โน้ตคือจุดที่ทุกอย่างมาเจอกัน:</p>
<div style="font-size:0.9em">
<table>
<thead>
<tr>
<th>ด้าน</th>
<th>วันนี้เราใช้มันตรงไหน</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Embedded / MCU</strong></td>
<td><strong>PWM / Timer</strong> สร้างความถี่ · <strong>audio DAC</strong> แปลงดิจิทัลเป็นแรงดัน · การ <strong>partition</strong> งานเสียงออกจาก core เกม</td>
</tr>
<tr>
<td><strong>Python</strong></td>
<td>เก็บทำนองเป็น <strong>list</strong> ของเลข MIDI · วน <strong>for</strong> เล่นทีละโน้ต · เขียน <strong>function</strong> <code>play()</code> รับพารามิเตอร์</td>
</tr>
<tr>
<td><strong>Algorithms / DSP</strong></td>
<td>แปลงเลข MIDI → ความถี่ด้วยสูตร <strong>เลขชี้กำลัง</strong> · <strong>wavetable synthesis</strong> หยิบรูปคลื่นมาวาดเป็นสัญญาณ</td>
</tr>
<tr>
<td><strong>Graphics / สัญญาณ</strong></td>
<td>มองรูปคลื่นเป็น &quot;กราฟตามเวลา&quot; — แกนเดียวกับที่เราใช้วาดภาพ แค่เปลี่ยนจากพิกเซลเป็นแรงดัน</td>
</tr>
</tbody>
</table>
</div>
<div style="display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin-top:6px">
<div style="text-align:center">
<iframe width="416" height="234" src="https://www.youtube.com/embed/v4XG_NHLWcs" title="Can you hear the difference between a sine wave and a square wave?" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>
<p><em>Can you hear the difference between a sine wave and a square wave? — Audio Masterclass</em></p>
</div>
<div style="text-align:center">
<iframe width="416" height="234" src="https://www.youtube.com/embed/q_3d1x2VPxk" title="How Oldschool Sound/Music worked" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>
<p><em>How Oldschool Sound/Music worked — The 8-Bit Guy</em></p>
</div>
</div>
<blockquote>
<p>เสียงทำให้เกมรู้สึกมีชีวิต แต่เบื้องหลังคือ PWM, DAC, list, for, และคณิตของความถี่ — ทักษะเดียวกันนี้ไปต่อยอดเป็นสินค้าจริงได้ (เครื่องดนตรีดิจิทัล, อุปกรณ์แจ้งเตือน, ของเล่นอัจฉริยะ)</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="24" style="--paginate:true;--theme:default;" data-marpit-pagination-total="31">
<h1 id="%E0%B8%AA%E0%B8%A3%E0%B8%B8%E0%B8%9B--%E0%B8%97%E0%B8%B3%E0%B9%80%E0%B8%AD%E0%B8%87-30">สรุป + ทำเอง 30%</h1>
<div style="display:flex;gap:24px">
<div style="flex:1;font-size:0.9em">
<p><strong>วันนี้เราได้</strong></p>
<ul>
<li>เข้าใจว่าบอร์ดสร้างเสียงด้วย <strong>PWM + waveform</strong></li>
<li><code>ui.sfx(id)</code> — เสียงสำเร็จรูป</li>
<li><code>ui.tone(note, wave, velocity, ms)</code> — แต่งทำนองเอง</li>
<li>รู้ว่า SQUARE ฟัง &quot;เป็นเกม&quot; SINE ฟังนุ่ม</li>
<li>เอาเสียงไปวางตามเหตุการณ์ใน Pong</li>
</ul>
</div>
<div style="flex:1;font-size:0.9em">
<p><strong>ทำเอง 30% (เติมใน practise)</strong></p>
<ul>
<li>เติมทำนองให้ครบ &quot;โด เร มี ฟา ซอล ลา ที โด&quot; (8 โน้ต)</li>
<li><strong>ออกแบบเสียง <code>coin</code> + <code>hurt</code> ของกลุ่มเอง</strong> ด้วย <code>play()</code> แล้วเอาไปใส่ Pong</li>
<li>ลองเล่นทำนองสูงขึ้น 1 ออกเทฟ (<code>+12</code> ทุกโน้ต)</li>
<li>ใส่เสียงครบทุกเหตุการณ์ใน Pong ของกลุ่มเรา</li>
</ul>
</div>
</div>
<blockquote>
<p>คาบหน้าเราจะเอาทักษะทั้งหมด (วาด · จอย · เสียง) มาประกอบเป็นเกมเต็มในโฟลเดอร์ <code>full_games/</code></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="25" style="--paginate:true;--theme:default;" data-marpit-pagination-total="31">
<h1 id="%E0%B9%80%E0%B8%89%E0%B8%A5%E0%B8%A2-s08_soundpy--%E0%B8%AD%E0%B9%88%E0%B8%B2%E0%B8%99%E0%B9%83%E0%B8%AB%E0%B9%89%E0%B9%80%E0%B8%82%E0%B9%89%E0%B8%B2%E0%B9%83%E0%B8%88%E0%B9%81%E0%B8%A5%E0%B9%89%E0%B8%A7%E0%B8%9E%E0%B8%B4%E0%B8%A1%E0%B8%9E%E0%B9%8C%E0%B9%80%E0%B8%AD%E0%B8%87">เฉลย <code>s08_sound.py</code> — อ่านให้เข้าใจแล้วพิมพ์เอง</h1>
<p>เฉลยนี้มีไว้ให้ &quot;เทียบ&quot; ไม่ใช่ให้ลอกวางส่ง คะแนนของคาบนี้อยู่ที่ใบงานและการอธิบายด้วยคำพูดของน้องเอง วิธีใช้ให้ได้ผลจริงคือ <strong>อ่านให้เข้าใจ ปิดไฟล์ แล้วพิมพ์ใหม่ด้วยมือตัวเอง</strong> ตอนพิมพ์เองนี่แหละที่สมองจำ pattern ได้ ต่อจากนี้เราจะแกะทีละส่วน เพราะทุกบรรทัดมีเหตุผลของมัน</p>
<p><strong>ส่วนแรก — เล่นเสียงสำเร็จรูปด้วย id เดียว:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># --- ส่วนที่ 1: เสียงสำเร็จรูป (sfx) เรียกด้วย id ที่บอร์ดเตรียมไว้ให้ ---</span>
<span class="hljs-comment"># id พวกนี้นิยามไว้ในโมดูล ui แล้ว เราแค่หยิบมาใช้ (ไม่ต้องจำความถี่เอง)</span>
<span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;เล่น sfx: เริ่มเกม&quot;</span>)
ui.sfx(ui.SFX_UI_START)
time.sleep_ms(<span class="hljs-number">600</span>)

<span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;เล่น sfx: กินอาหาร (snake)&quot;</span>)
ui.sfx(ui.SFX_SNAKE_EAT)
time.sleep_ms(<span class="hljs-number">400</span>)

<span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;เล่น sfx: เกมจบ&quot;</span>)
ui.sfx(ui.SFX_GAME_OVER)
time.sleep_ms(<span class="hljs-number">900</span>)
</code></pre>
<ul>
<li>ทำไมเรียก <code>ui.sfx(ui.SFX_UI_START)</code> แทนที่จะแต่งเสียงเริ่มเกมเอง? เพราะเสียงพวกนี้ <strong>C engine บนบอร์ดสังเคราะห์ไว้ให้แล้ว</strong> ตรงกับสไลด์ &quot;ส่วนที่ 1 — เสียงสำเร็จรูป ui.sfx&quot; — เราหยิบ id มาใช้ ไม่ต้องจำความถี่ ไม่ต้องแตะ DAC เอง</li>
<li>สังเกต <code>sleep_ms</code> สามค่าไม่เท่ากัน: <code>600</code> (<code>:19</code>), <code>400</code> (<code>:23</code>), <code>900</code> (<code>:27</code>) — แต่ละเสียงยาวไม่เท่ากัน เราหน่วงให้เสียงก่อนหน้า &quot;เล่นจบ&quot; ก่อนค่อยสั่งเสียงถัดไป นี่คือกับดัก &quot;เสียงตัดทับกัน&quot; ที่เราเตือนไว้ในสไลด์กับดัก ถ้าลืมหน่วง sfx จะเกยกันจนฟังไม่รู้เรื่อง</li>
<li>ใช้ชื่อ id ที่บอร์ดตั้งไว้ (<code>SFX_UI_START</code> / <code>SFX_SNAKE_EAT</code> / <code>SFX_GAME_OVER</code>) แทนตัวเลข ทำให้โค้ด <strong>อ่านแล้วรู้เลยว่าเสียงอะไร</strong> — นิสัยตั้งชื่อให้สื่อความหมาย ไม่ฝังเลขดิบ</li>
</ul>
<blockquote>
<p><code>print</code> ทุกบรรทัดไม่ได้มีไว้สวยงาม มันคือ &quot;คำบรรยาย&quot; ที่คอนโซลพิมพ์คู่กับเสียง เวลาเสียงเงียบผิดคาด เราจะรู้ทันทีว่าค้างอยู่ตรง sfx ตัวไหน</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="26" style="--paginate:true;--theme:default;" data-marpit-pagination-total="31">
<h1 id="%E0%B9%80%E0%B8%89%E0%B8%A5%E0%B8%A2--%E0%B8%AA%E0%B9%88%E0%B8%A7%E0%B8%99%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B8%AA%E0%B8%AD%E0%B8%87--%E0%B9%81%E0%B8%95%E0%B9%88%E0%B8%87%E0%B8%97%E0%B8%B3%E0%B8%99%E0%B8%AD%E0%B8%87%E0%B9%80%E0%B8%AD%E0%B8%87%E0%B8%94%E0%B9%89%E0%B8%A7%E0%B8%A2-uitone">เฉลย · ส่วนที่สอง — แต่งทำนองเองด้วย ui.tone</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># --- ส่วนที่ 2: แต่งทำนองเองด้วย tone ---</span>
<span class="hljs-comment"># ui.tone(note, wave, velocity, ms) — เล่นทีละโน้ต เราหน่วงเวลาเองให้โน้ตไม่ทับกัน</span>
<span class="hljs-comment"># ทำนองนี้คือ &quot;โด เร มี ฟา ซอล&quot; (C major scale ครึ่งแรก)</span>
melody = [<span class="hljs-number">60</span>, <span class="hljs-number">62</span>, <span class="hljs-number">64</span>, <span class="hljs-number">65</span>, <span class="hljs-number">67</span>]      <span class="hljs-comment"># เลข MIDI ของแต่ละโน้ต</span>
NOTE_MS = <span class="hljs-number">200</span>                      <span class="hljs-comment"># โน้ตละ 200 ms</span>

<span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;เล่นทำนองด้วย WAVE_SQUARE (เสียงเกมคลาสสิก)&quot;</span>)
<span class="hljs-keyword">for</span> note <span class="hljs-keyword">in</span> melody:
    ui.tone(note, ui.WAVE_SQUARE, <span class="hljs-number">100</span>, NOTE_MS)
    time.sleep_ms(NOTE_MS + <span class="hljs-number">20</span>)    <span class="hljs-comment"># +20 ms กันโน้ตเกยกัน ฟังเป็นจังหวะ</span>
</code></pre>
<ul>
<li>ทำไมเก็บทำนองเป็น <code>list</code> (<code>:32</code>) แล้ววน <code>for</code> (<code>:36</code>) แทนที่จะเขียน <code>ui.tone</code> ห้าบรรทัดเรียงกัน? เพราะพอทำนองอยู่ใน <strong>ข้อมูล</strong> เราเพิ่ม/ลด/สลับโน้ตได้โดยไม่แตะลูปเลย — แนวคิดเดียวกับ &quot;ขับ pattern ด้วยข้อมูล&quot; ตรงกับตาราง <code>melody = [60,62,64,65,67]</code> ในสไลด์ &quot;แต่งทำนองด้วย ui.tone&quot;</li>
<li>เลข <code>60, 62, 64, 65, 67</code> คือ <strong>เลข MIDI</strong> จากสไลด์ &quot;โน้ตเป็นตัวเลข&quot; — จำได้ไหมว่า <code>+2</code> = เต็มเสียง <code>+1</code> = ครึ่งเสียง? นั่นคือเหตุผลที่ช่วง 64→65 (มี→ฟา) ไต่ขึ้นน้อยกว่าช่วงอื่น</li>
<li>ตั้ง <code>NOTE_MS = 200</code> ไว้ <strong>ที่เดียว</strong> (<code>:33</code>) แล้วอ้างซ้ำทั้งความยาวโน้ตและช่วงหน่วง — อยากให้ทำนองเร็ว/ช้า แก้เลขเดียวจบ ไม่ต้องไล่แก้ทุกบรรทัด นี่คือการแยก &quot;ค่า&quot; ออกจาก &quot;โครง&quot;</li>
<li><code>time.sleep_ms(NOTE_MS + 20)</code> (<code>:38</code>) คือหัวใจของจังหวะ: <code>ui.tone</code> เล่นทีละโน้ตแล้วคืนคุมกลับมาทันที ถ้าไม่หน่วง โน้ตถัดไปจะทับโน้ตเดิม <code>+20</code> คือช่องว่างเล็ก ๆ ให้ได้ยินเป็น &quot;โน้ตแยกกัน&quot;</li>
</ul>
<blockquote>
<p><code>velocity = 100</code> ในสเกล MIDI 0–127 คือความดังราว 79% ที่เราคุยกันในสไลด์พารามิเตอร์ — ลองลดเหลือ <code>40</code> แล้วฟังว่าเบาลงจริงไหม เปลี่ยนทีละค่าแล้วเชื่อหูตัวเอง</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="27" style="--paginate:true;--theme:default;" data-marpit-pagination-total="31">
<h1 id="%E0%B9%80%E0%B8%89%E0%B8%A5%E0%B8%A2--%E0%B8%AA%E0%B9%88%E0%B8%A7%E0%B8%99%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B8%AA%E0%B8%B2%E0%B8%A1--%E0%B9%80%E0%B8%9B%E0%B8%A5%E0%B8%B5%E0%B9%88%E0%B8%A2%E0%B8%99%E0%B9%81%E0%B8%84%E0%B9%88-wave-%E0%B8%9C%E0%B8%A5%E0%B9%80%E0%B8%9B%E0%B8%A5%E0%B8%B5%E0%B9%88%E0%B8%A2%E0%B8%99%E0%B8%97%E0%B8%B1%E0%B9%89%E0%B8%87%E0%B8%84%E0%B8%A7%E0%B8%B2%E0%B8%A1%E0%B8%A3%E0%B8%B9%E0%B9%89%E0%B8%AA%E0%B8%B6%E0%B8%81">เฉลย · ส่วนที่สาม — เปลี่ยนแค่ wave ผลเปลี่ยนทั้งความรู้สึก</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">time.sleep_ms(<span class="hljs-number">300</span>)

<span class="hljs-comment"># ลองเปลี่ยน &quot;รูปคลื่น&quot; แล้วฟังว่าน้ำเสียงต่างกันอย่างไร (โน้ตเดิมทั้งหมด)</span>
<span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;เล่นทำนองเดิมด้วย WAVE_SINE (เสียงนุ่มขึ้น)&quot;</span>)
<span class="hljs-keyword">for</span> note <span class="hljs-keyword">in</span> melody:
    ui.tone(note, ui.WAVE_SINE, <span class="hljs-number">100</span>, NOTE_MS)
    time.sleep_ms(NOTE_MS + <span class="hljs-number">20</span>)

<span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;จบแล็บเสียง — ลองแก้ melody / wave / NOTE_MS ดูว่าผลลัพธ์เปลี่ยนยังไง&quot;</span>)
</code></pre>
<ul>
<li>ลูปนี้กับลูปในส่วนที่สอง <strong>โครงเหมือนกันเป๊ะ</strong> ต่างกันตัวเดียว: <code>ui.WAVE_SQUARE</code> → <code>ui.WAVE_SINE</code> (<code>:45</code>) โน้ตเดิม จังหวะเดิม แต่คนละน้ำเสียง — นี่คือบทเรียนหลักของแล็บที่เราพูดในสไลด์ &quot;ลองเปลี่ยนรูปคลื่น&quot;: เปลี่ยนตัวแปรเดียว ผลลัพธ์เปลี่ยนทั้งความรู้สึก</li>
<li>ใช้ <code>melody</code> ตัวเดิมซ้ำ (<code>:44</code>) ไม่ต้องประกาศทำนองใหม่ — นี่คือผลพลอยได้ของการเก็บทำนองเป็น <code>list</code> ตั้งแต่แรก อยากเทียบ SQUARE กับ SINE บนทำนองเดียวกัน ก็แค่วนลิสต์เดิมอีกรอบ</li>
<li><code>time.sleep_ms(300)</code> คั่นระหว่างสองรอบ (<code>:40</code>) เว้นช่องให้หูตั้งหลักก่อนฟังน้ำเสียงใหม่ ไม่ให้ SQUARE กับ SINE ต่อกันจนแยกไม่ออก</li>
<li>บรรทัด <code>print</code> ปิดท้าย (<code>:48</code>) ชวนให้ไปแก้ <code>melody / wave / NOTE_MS</code> ต่อ — เฉลยไม่ได้ให้จบแค่รันผ่าน แต่ชี้ว่า &quot;สามลูกบิด&quot; ไหนที่น้องหมุนเล่นได้</li>
</ul>
<blockquote>
<p>ทำไมเราถึงยืนยันให้เปลี่ยน &quot;ทีละตัวแปร&quot;? เพราะถ้าเปลี่ยนโน้ต จังหวะ และรูปคลื่นพร้อมกัน พอเสียงเพี้ยนจะไม่รู้ว่าตัวไหนทำให้เพี้ยน การแยกตัวแปรคือวิธีคิดแบบวิศวกร ไม่ใช่แค่เรื่องเสียง</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="28" style="--paginate:true;--theme:default;" data-marpit-pagination-total="31">
<h1 id="%E0%B9%80%E0%B8%89%E0%B8%A5%E0%B8%A2--%E0%B8%97%E0%B8%B1%E0%B9%89%E0%B8%87%E0%B8%8A%E0%B8%B8%E0%B8%94%E0%B9%84%E0%B8%95%E0%B9%88%E0%B8%A3%E0%B8%B0%E0%B8%94%E0%B8%B1%E0%B8%9A%E0%B8%81%E0%B8%B1%E0%B8%99%E0%B8%A2%E0%B8%B1%E0%B8%87%E0%B9%84%E0%B8%87-%E0%B9%84%E0%B8%A1%E0%B9%88%E0%B9%83%E0%B8%8A%E0%B9%88%E0%B8%A7%E0%B8%B2%E0%B8%87%E0%B8%A1%E0%B8%B1%E0%B9%88%E0%B8%A7">เฉลย · ทั้งชุดไต่ระดับกันยังไง (ไม่ใช่วางมั่ว)</h1>
<p>สี่ชั้นของแล็บนี้ถูกจัดให้ <strong>เพิ่มการควบคุมทีละขั้น</strong> จาก &quot;เสียงสำเร็จรูปที่บอร์ดทำให้&quot; ไปจนถึง &quot;เสียงที่เราคุมเองทุกพารามิเตอร์&quot; แล้ววนกลับมาที่ชื่อเรียกที่อ่านง่าย:</p>
<div style="font-size:0.9em">
<table>
<thead>
<tr>
<th>ชั้น</th>
<th>โค้ด (บรรทัด)</th>
<th>สิ่งใหม่ที่คุมได้</th>
<th>ของเดิมที่เอากลับมาใช้</th>
</tr>
</thead>
<tbody>
<tr>
<td>1 sfx สำเร็จรูป</td>
<td><code>ui.sfx(id)</code> <code>:18,22,26</code></td>
<td>เรียกเสียงทั้งก้อนด้วย id เดียว</td>
<td><code>sleep_ms</code> คั่นกันเสียงทับ</td>
</tr>
<tr>
<td>2 แต่งทำนอง</td>
<td><code>ui.tone</code> + <code>melody</code> + <code>for</code> <code>:32,36-38</code></td>
<td>คุม <code>note</code> เอง · <code>list</code> ขับ pattern</td>
<td><code>for</code> + <code>sleep</code> (คาบ 1)</td>
</tr>
<tr>
<td>3 เปลี่ยนน้ำเสียง</td>
<td><code>wave=ui.WAVE_SINE</code> <code>:45</code></td>
<td>เปลี่ยนตัวแปรเดียว น้ำเสียงเปลี่ยนหมด</td>
<td><code>melody</code> เดิม · ลูปเดิม</td>
</tr>
<tr>
<td>4 เรียกด้วยชื่อ</td>
<td><code>game.sfx(&quot;eat&quot;)</code> <code>:51</code></td>
<td>ห่อ id ด้วยชื่ออ่านง่าย ครบ 21 เสียง</td>
<td><code>ui.sfx</code> เดิม (แค่ห่อชื่อ)</td>
</tr>
</tbody>
</table>
</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># --- เมนูเสียงสำเร็จรูปทั้งหมด 21 เสียง (หยิบไปใส่เกมได้เลย) ---</span>
<span class="hljs-comment"># วิธีง่ายสุด: import bentogame as game  แล้ว  game.sfx(&quot;ชื่อ&quot;)</span>
<span class="hljs-comment">#   Snake : &quot;eat&quot;  &quot;turn&quot;  &quot;die&quot;</span>
<span class="hljs-comment">#   Flappy: &quot;flap&quot;  &quot;point&quot;  &quot;fall&quot;</span>
<span class="hljs-comment">#   Pong  : &quot;wall&quot;  &quot;paddle&quot;  &quot;pong_score&quot;  &quot;win&quot;  &quot;lose&quot;</span>
<span class="hljs-comment">#   Shoot : &quot;fire&quot;  &quot;hit&quot;  &quot;explode&quot;  &quot;lose_life&quot;</span>
<span class="hljs-comment">#   UI    : &quot;start&quot;  &quot;select&quot;  &quot;back&quot;  &quot;deny&quot;  &quot;move&quot;  &quot;gameover&quot;</span>
</code></pre>
<ul>
<li>ชั้น 1→2 คือการ &quot;เปิดฝา&quot;: จากเสียงที่บอร์ดทำให้ ไปเป็นเสียงที่เราประกอบเองจากโน้ต ชั้น 2→3 สอนว่าเปลี่ยน <strong>ตัวแปรเดียว</strong> ก็ได้ผลใหม่ ส่วนชั้น 4 (<code>game.sfx(&quot;eat&quot;)</code> <code>:51</code>) วนกลับมาหา id เดิม แค่ห่อด้วยชื่อที่จำง่ายกว่าเลข — เหมาะเวลาไปใส่เกมจริง</li>
<li>จับหลักนี้ไว้: เราเริ่มจากของสำเร็จรูปที่รันได้ทันที แล้วค่อยเปิดฝาคุมรายละเอียดทีละชั้น ไม่กระโดดไปคุมทุกอย่างพร้อมกัน — เกมทั้งเกมก็ประกอบขึ้นแบบนี้</li>
</ul>
<blockquote>
<p>ถ้ามองสี่ชั้นนี้ออกว่า &quot;มันคือระดับการควบคุมที่ค่อย ๆ เพิ่ม&quot; น้องจะเลือกได้เองว่างานไหนหยิบ <code>ui.sfx</code> พอ งานไหนต้อง <code>ui.tone</code> คุมเอง — นั่นคือดุลยพินิจของวิศวกร ไม่ใช่ท่องจำ API</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="29" style="--paginate:true;--theme:default;" data-marpit-pagination-total="31">
<h1 id="%E0%B9%80%E0%B8%8A%E0%B8%B7%E0%B9%88%E0%B8%AD%E0%B8%A1%E0%B8%88%E0%B8%B8%E0%B8%94%E0%B9%83%E0%B8%AB%E0%B9%89%E0%B9%80%E0%B8%AB%E0%B9%87%E0%B8%99%E0%B8%A0%E0%B8%B2%E0%B8%9E--%E0%B9%80%E0%B8%AA%E0%B8%B5%E0%B8%A2%E0%B8%87%E0%B9%82%E0%B8%99%E0%B9%89%E0%B8%95%E0%B8%99%E0%B8%B5%E0%B9%89%E0%B8%A1%E0%B8%B2%E0%B8%88%E0%B8%B2%E0%B8%81%E0%B9%84%E0%B8%AB%E0%B8%99-%E0%B9%81%E0%B8%A5%E0%B9%89%E0%B8%A7%E0%B8%88%E0%B8%B0%E0%B8%9E%E0%B8%B2%E0%B9%80%E0%B8%A3%E0%B8%B2%E0%B9%84%E0%B8%9B%E0%B8%96%E0%B8%B6%E0%B8%87%E0%B9%84%E0%B8%AB%E0%B8%99">เชื่อมจุดให้เห็นภาพ — เสียงโน้ตนี้มาจากไหน แล้วจะพาเราไปถึงไหน</h1>
<p>หยุดคิดสักครู่ก่อนปิดคาบ ไม่ใช่เรื่องไวยากรณ์ แต่เรื่อง &quot;มองให้ทะลุ&quot; ว่าเสียงหนึ่งโน้ตที่เราเพิ่งทำ จริง ๆ แล้วมันคือชิ้นส่วนของอะไร</p>
<p><strong>ที่มา — เสียงนี้ยืนอยู่บนอะไร</strong> ย้อนกลับไปสไลด์ &quot;บอร์ดสร้างเสียงได้อย่างไร — PWM&quot; กับ &quot;PWM ไม่ได้มีแค่เสียง — หรี่ไฟ LED ด้วย&quot; เราเห็นว่าเสียงเกิดจากการ <strong>เปิด-ปิดขาเร็ว ๆ</strong> แล้วเลือกรูปคลื่น และ duty cycle ตัวเดียวกันนั้นเอาไปหรี่ไฟ LED ได้ ทีนี้ลองถามตัวเอง: ไฟกะพริบช้า ๆ ที่เราทำในคาบแรก กับเสียง square wave วันนี้ ต่างกันแค่ไหน? คำตอบคือ <strong>แนวคิดเดียวกัน ต่างแค่ความถี่</strong> — กะพริบช้าพอตาเห็นเป็นไฟ, สลับเร็วพอหูได้ยินเป็นโน้ต นี่คือรากที่ทำให้เสียงกับไฟเป็นเรื่องเดียวกัน</p>
<p><strong>ที่ไป — เสียงนี้จะโตเป็นอะไร</strong> ที่สไลด์ &quot;เอาเสียงไปใส่ Pong&quot; เราวางเสียงตาม &quot;เหตุการณ์&quot; ในเกม (บอลชนไม้ → ป๊อก, จบเกม → game over) สังเกตให้ดี: การเก็บทำนองเป็น <code>list</code> แล้ววน <code>for</code> เล่นทีละตัว คือโครงเดียวกับการ <strong>ไล่เหตุการณ์ในเกมทีละอัน</strong> เสียงจึงไม่ใช่ของแต่งเติมท้ายสุด แต่คือ feedback ที่ผูกกับ game loop คาบหน้าที่เรารวม วาด+จอย+เสียง เป็นเกมเต็มใน <code>full_games/</code> เสียงจะไปนั่งอยู่ในลูปนั้นพอดี</p>
<p>ลองตอบคำถามพวกนี้ในใจ นี่แหละคือการเชื่อมจุดด้วยตัวเอง:</p>
<ul>
<li>จำ <strong>duty cycle</strong> กับ <strong>PWM หรี่ไฟ LED</strong> ได้ไหม ถ้าเสียง square กับไฟกะพริบคือ PWM เหมือนกัน แล้วอะไรกันแน่ที่ทำให้อันหนึ่ง &quot;เห็น&quot; อีกอันหนึ่ง &quot;ได้ยิน&quot;? (ใบ้: อยู่ที่ความถี่ล้วน ๆ)</li>
<li>ถ้าวันนี้เราเล่นทำนองจาก <code>list</code> ของเลขได้ พรุ่งนี้เราจะไล่ <strong>เหตุการณ์ในเกม</strong> จาก list แล้วยิงเสียงทีละอันได้ไหม? (ใบ้: <code>for note in melody</code> <img class="emoji" draggable="false" alt="↔" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2194.svg" data-marp-twemoji=""/> <code>for event in game</code>)</li>
<li>สังเกตไหมว่า <code>ui.tone</code> / <code>ui.sfx</code> มันคือเรื่องเดียวกับ <strong>C engine handoff</strong> ในสไลด์ signal chain — เราสั่งหนึ่งบรรทัด งานหนัก (แปลงความถี่ · wavetable · DAC) ข้ามเส้นไปทำในบอร์ด?</li>
</ul>
<div style="text-align:center">
<svg width="900" height="118" viewBox="0 0 900 118" font-family="DejaVu Sans, sans-serif">
  <defs>
    <marker id="arS08TL" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#9e9e9e" /></marker>
  </defs>
  <line x1="60" y1="58" x2="850" y2="58" stroke="#cfd8dc" stroke-width="3" />
  <g text-anchor="middle">
    <circle cx="150" cy="58" r="8" fill="#607d8b" />
    <text x="150" y="36" font-size="13" font-weight="700" fill="#455a64">ที่มา</text>
    <text x="150" y="84" font-size="12" fill="#777">PWM + duty cycle</text>
    <text x="150" y="100" font-size="11" fill="#999">(ไฟกะพริบ คาบ 1)</text>
    <circle cx="450" cy="58" r="10" fill="#2e7d32" />
    <text x="450" y="36" font-size="13" font-weight="700" fill="#2e7d32">วันนี้</text>
    <text x="450" y="84" font-size="12" fill="#777">โน้ต = PWM เร็ว + รูปคลื่น</text>
    <text x="450" y="100" font-size="11" fill="#999">(sfx + tone)</text>
    <circle cx="770" cy="58" r="8" fill="#6a1b9a" />
    <text x="770" y="36" font-size="13" font-weight="700" fill="#6a1b9a">ที่ไป</text>
    <text x="770" y="84" font-size="12" fill="#777">เสียงผูกกับ game loop</text>
    <text x="770" y="100" font-size="11" fill="#999">(เกมเต็ม full_games/)</text>
  </g>
  <line x1="165" y1="58" x2="435" y2="58" stroke="#9e9e9e" stroke-width="2" marker-end="url(#arS08TL)" />
  <line x1="465" y1="58" x2="755" y2="58" stroke="#9e9e9e" stroke-width="2" marker-end="url(#arS08TL)" />
</svg>
</div>
<blockquote>
<p>ถ้าตอบสามคำถามข้างบนได้ว่า &quot;อ๋อ เสียงกับไฟกับพิกเซล มันคือเรื่องเดียวกัน — แค่เปิด-ปิดกับเลือกจังหวะ&quot; นั่นคือการหยั่งรู้ที่อาจารย์อยากให้เกิด เสียงหนึ่งโน้ตวันนี้ไม่ใช่ของเล็ก มันคือชิ้นส่วนของเครื่องเกมทั้งเครื่อง</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="30" style="--paginate:true;--theme:default;" data-marpit-pagination-total="31">
<h1 id="%E0%B9%83%E0%B8%8A%E0%B9%89%E0%B8%88%E0%B8%A3%E0%B8%B4%E0%B8%87%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B9%84%E0%B8%AB%E0%B8%99--pwm-tone--wavetable--sfx-event">ใช้จริงที่ไหน — PWM tone · wavetable · sfx event</h1>
<p>เทคนิควันนี้ไม่ได้อยู่แค่ในแล็บ มันคือสิ่งที่อุปกรณ์จริงรอบตัวเราใช้กันทุกวัน:</p>
<div style="text-align:center">
<svg width="880" height="240" viewBox="0 0 880 240" font-family="DejaVu Sans, sans-serif">
  <defs>
    <marker id="arUJ08" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#607d8b" /></marker>
  </defs>
  
  <rect x="12" y="8" width="420" height="106" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" />
  <text x="28" y="28" font-size="13" font-weight="700" fill="#1565c0">เกม 8-bit / chiptune · square wave</text>
  <path d="M40,80 V52 H80 V80 H120 V52 H160 V80 H200 V52 H240 V80 H280 V52 H320 V80 H360 V52 H400 V80" fill="none" stroke="#1565c0" stroke-width="2.5" />
  <text x="28" y="104" font-size="11" fill="#777">ทำนองใน list + รูปคลื่นสี่เหลี่ยม = น้ำเสียง SN76489</text>
  
  <rect x="448" y="8" width="420" height="106" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" />
  <text x="464" y="28" font-size="13" font-weight="700" fill="#2e7d32">เสียงเตือน · PWM ขับ buzzer</text>
  <path d="M478,70 V48 H486 V70 H494 V48 H502 V70 H510 V48 H518 V70 H526 V48 H534 V70 H542" fill="none" stroke="#2e7d32" stroke-width="2" />
  <path d="M600,70 V48 H608 V70 H616 V48 H624 V70 H632 V48 H640 V70 H648 V48 H656 V70 H664" fill="none" stroke="#2e7d32" stroke-width="2" />
  <text x="510" y="86" font-size="11" fill="#607d8b" text-anchor="middle">ตี๊ด</text>
  <text x="632" y="86" font-size="11" fill="#607d8b" text-anchor="middle">ตี๊ด</text>
  <text x="464" y="106" font-size="11" fill="#777">PWM เลือกความถี่ = เลือกระดับเสียงเตือน</text>
  
  <rect x="12" y="126" width="420" height="106" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-width="2" />
  <text x="28" y="146" font-size="13" font-weight="700" fill="#ef6c00">เสียงตอบรับ UI · sfx ต่อเหตุการณ์</text>
  <rect x="30" y="170" width="90" height="34" rx="6" fill="#ffffff" stroke="#ef6c00" />
  <text x="75" y="191" font-size="12" fill="#ef6c00" text-anchor="middle">กดปุ่ม</text>
  <line x1="122" y1="187" x2="160" y2="187" stroke="#607d8b" stroke-width="2" marker-end="url(#arUJ08)" />
  <rect x="168" y="170" width="112" height="34" rx="6" fill="#ffffff" stroke="#ef6c00" />
  <text x="224" y="191" font-size="12" fill="#ef6c00" text-anchor="middle">ui.sfx(id)</text>
  <line x1="282" y1="187" x2="302" y2="187" stroke="#607d8b" stroke-width="2" marker-end="url(#arUJ08)" />
  <text x="360" y="166" font-size="10" fill="#607d8b" text-anchor="middle">เสียงสั้น</text>
  <path d="M308,200 V176 H322 V200 H336 V176 H350 V200 H364 V176 H378 V200 H392 V176 H406 V200" fill="none" stroke="#ef6c00" stroke-width="2" />
  <text x="28" y="222" font-size="11" fill="#777">ATM · POS · เครื่องมือแพทย์ — เสียงยืนยัน "รับคำสั่งแล้ว"</text>
  
  <rect x="448" y="126" width="420" height="106" rx="10" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2" />
  <text x="464" y="146" font-size="13" font-weight="700" fill="#6a1b9a">เครื่องดนตรีดิจิทัล · MIDI + wavetable</text>
  <rect x="466" y="170" width="82" height="34" rx="6" fill="#ffffff" stroke="#6a1b9a" />
  <text x="507" y="191" font-size="12" fill="#6a1b9a" text-anchor="middle">MIDI 60</text>
  <line x1="550" y1="187" x2="578" y2="187" stroke="#607d8b" stroke-width="2" marker-end="url(#arUJ08)" />
  <rect x="586" y="170" width="106" height="34" rx="6" fill="#ffffff" stroke="#6a1b9a" />
  <text x="639" y="191" font-size="12" fill="#6a1b9a" text-anchor="middle">wavetable</text>
  <line x1="694" y1="187" x2="722" y2="187" stroke="#607d8b" stroke-width="2" marker-end="url(#arUJ08)" />
  <path d="M728,187 Q744,167 760,187 T792,187 T824,187 T856,187" fill="none" stroke="#6a1b9a" stroke-width="2" />
  <text x="464" y="222" font-size="11" fill="#777">f(n)=440·2^((n−69)/12) → หยิบรูปคลื่นมาวาดสัญญาณ</text>
</svg>
</div>
<ul>
<li><strong>เครื่องเกม 8-bit / เพลง chiptune</strong> — ชิปอย่าง SN76489 สร้าง <strong>square wave</strong> ตรง ๆ คือที่มาของน้ำเสียง &quot;เป็นเกม&quot; ที่เราได้ยินจาก <code>ui.WAVE_SQUARE</code>: ทำนองใน list + รูปคลื่นสี่เหลี่ยม</li>
<li><strong>เสียงเตือนเครื่องใช้ไฟฟ้า</strong> — ไมโครเวฟ &quot;ตี๊ด&quot;, เครื่องตรวจควัน, นาฬิกาปลุก ใช้ <strong>PWM ขับ buzzer</strong> ให้ได้ความถี่ที่ต้องการ — เปิด-ปิดขาเร็ว ๆ เลือกความถี่ = เลือกระดับเสียง</li>
<li><strong>เสียงตอบสนอง UI</strong> — ปุ่ม ATM, เครื่องคิดเงิน POS, เครื่องมือแพทย์ ยิงเสียงสั้น ๆ ตอนกดปุ่ม/ทำรายการสำเร็จ/เตือน error คือ <code>ui.sfx(id)</code> แบบเดียวกับที่เราวางเสียงตาม &quot;เหตุการณ์&quot; ใน Pong — feedback ยืนยัน &quot;รับคำสั่งแล้ว&quot;</li>
<li><strong>เครื่องดนตรีดิจิทัล / synthesizer</strong> — คีย์บอร์ดไฟฟ้าและ sound module ใช้ <strong>เลข MIDI</strong> (60 = โดกลาง) กับ <strong>wavetable</strong> หยิบรูปคลื่นมาวาดสัญญาณ ตามสูตร <code>f(n)=440·2^((n−69)/12)</code> — รากฐานเดียวกับที่เราแตะวันนี้</li>
</ul>
<blockquote>
<p>เห็นไหมว่าทุกเทคนิคในแล็บวันนี้ ไม่มีอันไหนเป็นของสมมติเลย ตั้งแต่ของเล่นในตู้ ไปจนเครื่องมือแพทย์ ล้วนเปิด-ปิดขาแล้วเลือกรูปคลื่นแบบเดียวกับที่กลุ่มเราเพิ่งทำ</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="31" style="--paginate:true;--theme:default;" data-marpit-pagination-total="31">
<h1 id="%E0%B8%95%E0%B9%88%E0%B8%AD%E0%B8%A2%E0%B8%AD%E0%B8%94--%E0%B8%84%E0%B8%B4%E0%B8%94%E0%B8%95%E0%B9%88%E0%B8%AD%E0%B9%80%E0%B8%AD%E0%B8%87">ต่อยอด — คิดต่อเอง</h1>
<p>ลองเอาโจทย์พวกนี้ไปคิดต่อ ไม่มีคำตอบเดียวตายตัว ทุกข้อโยงกลับไปหาโปรเจกต์จริงได้:</p>
<div style="text-align:center">
<svg width="840" height="228" viewBox="0 0 840 228" font-family="DejaVu Sans, sans-serif">
  <defs>
    <marker id="arDn08" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#607d8b" /></marker>
  </defs>
  
  <text x="14" y="24" font-size="13" font-weight="700" fill="#607d8b">แบบบล็อก — ui.tone() แล้ว time.sleep_ms()</text>
  <rect x="120" y="36" width="80" height="34" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" />
  <text x="160" y="57" font-size="11" fill="#1565c0" text-anchor="middle">ui.tone</text>
  <rect x="206" y="36" width="404" height="34" rx="6" fill="#cfd8dc" stroke="#607d8b" stroke-width="2" />
  <text x="408" y="57" font-size="12" fill="#455a64" text-anchor="middle">time.sleep_ms(200) — CPU หยุดนิ่ง</text>
  <rect x="616" y="36" width="80" height="34" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" />
  <text x="656" y="57" font-size="11" fill="#1565c0" text-anchor="middle">ui.tone</text>
  <text x="408" y="92" font-size="11" fill="#ef6c00" text-anchor="middle">กดปุ่ม/วาดเฟรมช่วงนี้ → เกมค้าง ทำอะไรไม่ได้เลย</text>
  
  <line x1="420" y1="102" x2="420" y2="126" stroke="#607d8b" stroke-width="2" marker-end="url(#arDn08)" />
  <text x="436" y="119" font-size="11" fill="#777">เปลี่ยนวิธีคิด</text>
  
  <text x="14" y="150" font-size="13" font-weight="700" fill="#2e7d32">แบบไม่บล็อก — จำเวลาที่ผ่านไป (BGM ไม่หยุดเกม)</text>
  <rect x="120" y="162" width="616" height="34" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" />
  <text x="132" y="183" font-size="12" fill="#2e7d32">ทุกวนรอบ: อ่านปุ่ม + วาดเกม + เช็คเวลา — ไม่หยุดเลย</text>
  <rect x="300" y="162" width="8" height="34" fill="#2e7d32" />
  <rect x="480" y="162" width="8" height="34" fill="#2e7d32" />
  <rect x="660" y="162" width="8" height="34" fill="#2e7d32" />
  <text x="484" y="156" font-size="11" fill="#2e7d32" text-anchor="middle">เล่นโน้ตถัดไปเมื่อครบ 200 ms</text>
  <text x="428" y="214" font-size="11" fill="#2e7d32" text-anchor="middle">ปุ่มกดตอนไหนก็รับได้ — เพลงกับเกมเดินพร้อมกัน</text>
</svg>
</div>
<ul>
<li><strong>เพลงพื้นหลังที่ไม่หยุดเกม</strong> — ตอนนี้ <code>time.sleep_ms</code> หยุด <strong>ทุกอย่าง</strong> ระหว่างโน้ต ถ้าอยากมี BGM เล่นวนพร้อมเกมที่ยังต้องรับปุ่ม จะออกแบบยังไงไม่ให้บล็อกเกม (ใบ้: &quot;จำเวลาที่ผ่านไป&quot; แทนการ <code>sleep</code> — เล่นโน้ตถัดไปเมื่อถึงเวลา)</li>
<li><strong>เสียงที่เล่าสถานะเกม</strong> — ถ้าผูก <code>note</code> หรือ <code>velocity</code> กับสถานะ เช่น ยิ่งใกล้แพ้เสียงยิ่งสูง/ถี่ขึ้น จะ map สถานะเป็นพารามิเตอร์เสียงยังไงให้ผู้เล่น &quot;รู้สึก&quot; ตึงเครียดเองโดยไม่ต้องมองคะแนน</li>
<li><strong>ธีมเสียงของทีมเอง</strong> — ถ้าออกแบบเสียงครบทุกเหตุการณ์ (เก็บของ / ชน / ชนะ / แพ้) ให้เป็นชุดเดียวกัน จะเลือก <code>wave</code> กับชุดโน้ต (scale) ยังไงให้ทุกเสียงเข้าพวกกัน ไม่ใช่ต่างคนต่างมา</li>
<li><strong>บริดจ์ไปคาบหน้า</strong> — คาบหน้าเรารวม วาด + จอย + เสียง เป็นเกมเต็มใน <code>full_games/</code> ลองคิดล่วงหน้า: จะวาง <code>ui.sfx</code> / <code>ui.tone</code> ตรงไหนของ <strong>game loop</strong> ให้เสียงตรงกับภาพและปุ่ม โดยเสียงยาว ๆ ไม่หน่วงจนเฟรมสะดุด — โจทย์แรกที่เกมเต็มต้องแก้</li>
</ul>
<blockquote>
<p>เลือกมาสักข้อ แล้วเขียนลงใบงานว่า &quot;ถ้าเป็นเรา จะออกแบบยังไง&quot; ไม่ต้องมีคำตอบถูก ขอแค่คิดต่อจากเสียงที่พิมพ์เองวันนี้ — ตรงนั้นแหละคือจุดที่น้องเริ่มเป็นคนออกแบบเกม ไม่ใช่แค่คนพิมพ์ตามเฉลย</p>
</blockquote>
