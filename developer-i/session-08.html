<h1 id="%E0%B8%84%E0%B8%B2%E0%B8%9A-8--%E0%B9%80%E0%B8%AA%E0%B8%B5%E0%B8%A2%E0%B8%87%E0%B9%80%E0%B8%81%E0%B8%A1-sfx--tone">คาบ 8 — เสียงเกม: sfx + tone</h1>
<h2 id="%E0%B9%83%E0%B8%AB%E0%B9%89%E0%B9%80%E0%B8%81%E0%B8%A1%E0%B8%82%E0%B8%AD%E0%B8%87%E0%B9%80%E0%B8%A3%E0%B8%B2-%E0%B8%AA%E0%B9%88%E0%B8%87%E0%B9%80%E0%B8%AA%E0%B8%B5%E0%B8%A2%E0%B8%87-%E0%B9%84%E0%B8%94%E0%B9%89%E0%B8%88%E0%B8%A3%E0%B8%B4%E0%B8%87%E0%B8%9A%E0%B8%99%E0%B8%9A%E0%B8%AD%E0%B8%A3%E0%B9%8C%E0%B8%94">ให้เกมของเรา &quot;ส่งเสียง&quot; ได้จริงบนบอร์ด</h2>
<p><strong>Peripheral Lab · 3 คน / 1 บอร์ด</strong></p>
<blockquote>
<p>คาถาประจำคาบ: <strong>&quot;เสียงคือการเปิด-ปิดขาเร็ว ๆ แล้วเลือกรูปคลื่น&quot;</strong></p>
</blockquote>
<p>คาบนี้เราเปิดฝาเข้าไปแตะฮาร์ดแวร์ตรง ๆ — ทำเสียงให้เกม Pong มีชีวิต</p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-class="cover" data-theme="default" lang="en-US" class="cover" data-marpit-pagination="1" style="" data-marpit-pagination-total="31" data-marpit-advanced-background="pseudo"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="2" style="--paginate:true;--theme:default;" data-marpit-pagination-total="31">
<h1 id="%E0%B9%80%E0%B8%9B%E0%B9%89%E0%B8%B2%E0%B8%AB%E0%B8%A1%E0%B8%B2%E0%B8%A2%E0%B8%82%E0%B8%AD%E0%B8%87%E0%B8%84%E0%B8%B2%E0%B8%9A%E0%B8%99%E0%B8%B5%E0%B9%89">เป้าหมายของคาบนี้</h1>
<p>วันนี้เราจะทำให้เกมของเรา &quot;พูด&quot; ได้ ผ่าน 2 เครื่องมือในโมดูล <code>ui</code>:</p>
<ol>
<li><strong><code>ui.sfx(id)</code></strong> — เสียงสำเร็จรูปที่บอร์ดเตรียมไว้ให้ (เริ่มเกม, กินอาหาร, เกมจบ) เราแค่หยิบ id มาเรียก</li>
<li><strong><code>ui.tone(note, wave, velocity, ms)</code></strong> — แต่งทำนองสั้น ๆ เอง ทีละโน้ต เลือกได้ว่าจะให้น้ำเสียงแบบไหน</li>
</ol>
<p>ระหว่างทางเราจะเข้าใจว่า <strong>บอร์ดสร้างเสียงอย่างไร</strong> (PWM + waveform) แล้วเอาความรู้นี้ไปใส่เสียงให้ <strong>Pong</strong></p>
<blockquote>
<p>ปลายทาง: กดรันแล้วได้ยินเสียงเริ่มเกม ทำนองสั้น ๆ และเข้าใจว่าทำไมเสียง square ถึงฟัง &quot;เป็นเกม&quot;</p>
</blockquote>
<p><img src="img/two_sound_tools.png" alt="" style="width:620px;" /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="3" style="--paginate:true;--theme:default;" data-marpit-pagination-total="31">
<h1 id="%E0%B8%9A%E0%B8%AD%E0%B8%A3%E0%B9%8C%E0%B8%94%E0%B8%AA%E0%B8%A3%E0%B9%89%E0%B8%B2%E0%B8%87%E0%B9%80%E0%B8%AA%E0%B8%B5%E0%B8%A2%E0%B8%87%E0%B9%84%E0%B8%94%E0%B9%89%E0%B8%AD%E0%B8%A2%E0%B9%88%E0%B8%B2%E0%B8%87%E0%B9%84%E0%B8%A3--pwm">บอร์ดสร้างเสียงได้อย่างไร — PWM</h1>
<p>ลำโพงเล็ก ๆ บนบอร์ดไม่ได้ &quot;เล่นไฟล์เพลง&quot; แต่มันแกว่งไปมาตามที่ขาสัญญาณสั่ง</p>
<p>บอร์ดใช้ <strong>PWM</strong> (Pulse Width Modulation) = เปิด-ปิดขาเร็ว ๆ เป็นจังหวะ<br />
ยิ่งสลับเปิด-ปิดถี่ (ความถี่สูง) → เสียงยิ่งสูง</p>
<svg viewBox="0 0 640 120" width="680">
<line x1="20" y1="100" x2="620" y2="100" stroke="#888" />
<path d="M20 100 V40 H70 V100 H120 V40 H170 V100 H220 V40 H270 V100" stroke="#79c0ff" fill="none" stroke-width="3" />
<text x="20" y="30" font-size="13" fill="#555">ความถี่ต่ำ → เสียงต่ำ</text>
<path d="M340 100 V40 H365 V100 H390 V40 H415 V100 H440 V40 H465 V100 H490 V40 H515 V100 H540 V40 H565 V100" stroke="#ff7b72" fill="none" stroke-width="3" />
<text x="340" y="30" font-size="13" fill="#555">ความถี่สูง → เสียงสูง</text>
</svg>
<p><strong>ลองรู้สึก: สลับเร็วขึ้น → เสียงสูงขึ้น</strong> (อนิเมชันเล่นเอง — เข็ม pitch ไต่ขึ้นตามความถี่)</p>
<p><img src="img/pwm_pitch_anim.gif" alt="" style="width:680px;" /></p>
<blockquote>
<p>ขาเปิด = แรงดันดันลำโพงออก, ขาปิด = ปล่อยกลับ — สลับเร็วพอหู เราได้ยินเป็น &quot;โน้ต&quot;</p>
</blockquote>
<blockquote>
<p>บนบอร์ดจริง เสียงสังเคราะห์ผ่าน <strong>audio DAC</strong> (จึงเล่น SINE / TRIANGLE ได้เนียน ไม่ใช่ square ล้วน) — PWM ข้างบนคือภาพง่าย ๆ ที่ช่วยให้เห็นหลักการ &quot;ดิจิทัล → เสียง&quot;</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="4" style="--paginate:true;--theme:default;" data-marpit-pagination-total="31">
<h1 id="%E0%B9%82%E0%B8%99%E0%B9%89%E0%B8%95-1-%E0%B8%95%E0%B8%B1%E0%B8%A7-%E0%B9%80%E0%B8%94%E0%B8%B4%E0%B8%99%E0%B8%97%E0%B8%B2%E0%B8%87%E0%B8%88%E0%B8%B2%E0%B8%81%E0%B9%82%E0%B8%84%E0%B9%89%E0%B8%94%E0%B9%84%E0%B8%9B%E0%B8%96%E0%B8%B6%E0%B8%87%E0%B8%A5%E0%B8%B3%E0%B9%82%E0%B8%9E%E0%B8%87%E0%B8%AD%E0%B8%A2%E0%B9%88%E0%B8%B2%E0%B8%87%E0%B9%84%E0%B8%A3">โน้ต 1 ตัว เดินทางจากโค้ดไปถึงลำโพงอย่างไร</h1>
<p>เวลาเราเขียน <code>ui.tone(60, ui.WAVE_SQUARE, ...)</code> หนึ่งบรรทัด เบื้องหลังบอร์ดทำงานเป็นทอด ๆ แบบนี้:</p>
<p><img src="img/sound_chain.png" alt="" style="width:760px;" /></p>
<p>เราคุมแค่ <strong>2 อย่าง</strong> คือ <em>โน้ตไหน</em> (<code>note</code>) กับ <em>รูปคลื่นไหน</em> (<code>wave</code>) ที่เหลือ — แปลงเป็นความถี่, หยิบรูปคลื่น, ส่งเข้า DAC — บอร์ดจัดการให้หมด นี่คือเหตุผลที่เล่นเสียงได้โดยไม่ต้องรู้ฮาร์ดแวร์ลึก</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="5" style="--paginate:true;--theme:default;" data-marpit-pagination-total="31">
<h1 id="%E0%B9%80%E0%B8%81%E0%B8%A3%E0%B9%87%E0%B8%94-%E0%B8%97%E0%B8%B3%E0%B9%84%E0%B8%A1-embedded-%E0%B8%AA%E0%B8%B3%E0%B8%84%E0%B8%B1%E0%B8%8D--sega-genesis-1988">เกร็ด: ทำไม embedded สำคัญ — Sega Genesis (1988)</h1>
<div style="display:flex;gap:18px;align-items:center">
<div style="flex:1.3">
<p>Genesis มี <strong>CPU ตัวที่สอง (Z80)</strong> ไว้ทำเสียงโดยเฉพาะ ปลด CPU หลัก (68000) ให้ทุ่มกับ gameplay — แบ่งงานให้ชิปที่ถนัด</p>
<p>เครื่องยุค 8-bit หลายรุ่น (Master System, ColecoVision, BBC Micro) ใช้ชิปเสียงตัวเดียวกันคือ <strong>SN76489</strong> ในรูป มันสร้างเสียง <strong>square wave</strong> ได้โดยตรง — นี่แหละต้นกำเนิดน้ำเสียง &quot;เป็นเกม&quot; ที่เราจะลองทำวันนี้</p>
</div>
<div style="flex:1;text-align:center">
<p><img src="img/sn76489_chip.jpg" alt="" style="width:300px;" /></p>
<p><sub>ที่มา: &quot;SN76489&quot; — Evan-Amos, Public domain, Wikimedia Commons</sub></p>
</div>
</div>
<p><strong>เชื่อมกับวันนี้:</strong> บอร์ดเราก็มี <strong>audio codec</strong> แยกทำเสียงจริง (ไม่ใช่ buzzer) ปล่อยให้ core เกมไม่สะดุด — partitioning แนวคิดเดียวกันกับ Genesis เมื่อ 30 กว่าปีก่อน</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--theme:default;" data-marpit-pagination-total="31">
<h1 id="pwm-%E0%B9%84%E0%B8%A1%E0%B9%88%E0%B9%84%E0%B8%94%E0%B9%89%E0%B8%A1%E0%B8%B5%E0%B9%81%E0%B8%84%E0%B9%88%E0%B9%80%E0%B8%AA%E0%B8%B5%E0%B8%A2%E0%B8%87--%E0%B8%AB%E0%B8%A3%E0%B8%B5%E0%B9%88%E0%B9%84%E0%B8%9F-led-%E0%B8%94%E0%B9%89%E0%B8%A7%E0%B8%A2">PWM ไม่ได้มีแค่เสียง — หรี่ไฟ LED ด้วย</h1>
<p>duty cycle ตัวเดียวกับที่ทำเสียง เอามาคุม <strong>ความสว่าง LED</strong> ได้เลย: <code>gpio.led(n).brightness(0–100)</code></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">import</span> gpio, time
led = gpio.led(<span class="hljs-number">0</span>)
<span class="hljs-comment"># ไฟหายใจ (breathing) — สว่างขึ้น/หรี่ลง นุ่ม ๆ</span>
<span class="hljs-keyword">while</span> <span class="hljs-literal">True</span>:
    <span class="hljs-keyword">for</span> b <span class="hljs-keyword">in</span> <span class="hljs-built_in">range</span>(<span class="hljs-number">0</span>, <span class="hljs-number">101</span>, <span class="hljs-number">2</span>):
        led.brightness(b); time.sleep_ms(<span class="hljs-number">15</span>)
    <span class="hljs-keyword">for</span> b <span class="hljs-keyword">in</span> <span class="hljs-built_in">range</span>(<span class="hljs-number">100</span>, -<span class="hljs-number">1</span>, -<span class="hljs-number">2</span>):
        led.brightness(b); time.sleep_ms(<span class="hljs-number">15</span>)
</code></pre>
<blockquote>
<p><code>brightness(0)</code> ดับ · <code>100</code> สว่างเต็ม · ระหว่างนั้นหรี่ — เบื้องหลังคือ <strong>PWM ~10 kHz</strong> ที่ตามองเป็นความสว่างต่อเนื่อง (ต้องใช้เฟิร์มแวร์ Game รุ่นล่าสุดที่เปิด LED PWM)</p>
</blockquote>
<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">
<div style="flex:1.4;min-width:300px">
<p><img src="img/pwm_brightness.png" alt="" style="width:520px;" /></p>
</div>
<div style="flex:1;min-width:200px;text-align:center">

  <circle />

</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--theme:default;" data-marpit-pagination-total="31">
<h1 id="%E0%B8%A3%E0%B8%B9%E0%B8%9B%E0%B8%84%E0%B8%A5%E0%B8%B7%E0%B9%88%E0%B8%99-waveform-%E0%B8%84%E0%B8%B7%E0%B8%AD%E0%B8%AD%E0%B8%B0%E0%B9%84%E0%B8%A3">&quot;รูปคลื่น&quot; (waveform) คืออะไร</h1>
<p>โน้ตเดียวกัน (ความถี่เท่ากัน) แต่ <strong>รูปคลื่นต่างกัน → น้ำเสียงต่างกัน</strong><br />
นี่คือเหตุผลที่กีตาร์กับเปียโนเล่นโน้ตเดียวกันแล้วเสียงไม่เหมือนกัน</p>
<div style="display:flex;gap:16px;flex-wrap:wrap;font-size:0.9em;margin-top:10px">
<div style="flex:1;min-width:240px;border:2px solid #ff7b72;border-radius:10px;padding:10px">
<b>WAVE_SQUARE</b> — สี่เหลี่ยม<br />เสียงกระด้าง "เป็นเกม" แบบ 8-bit คลาสสิก
</div>
<div style="flex:1;min-width:240px;border:2px solid #79c0ff;border-radius:10px;padding:10px">
<b>WAVE_SINE</b> — โค้งนุ่ม<br />เสียงกลม นุ่มนวล ฟังสบายหู
</div>
</div>
<svg viewBox="0 0 640 110" width="680" style="margin-top:14px">
<text x="20" y="20" font-size="13" fill="#ff7b72">SQUARE</text>
<path d="M20 80 V40 H80 V80 H140 V40 H200 V80 H260 V40 H300 V80" stroke="#ff7b72" fill="none" stroke-width="3" />
<text x="360" y="20" font-size="13" fill="#79c0ff">SINE</text>
<path d="M360 60 Q390 20 420 60 T480 60 T540 60 T600 60" stroke="#79c0ff" fill="none" stroke-width="3" />
</svg>
<p><strong>โน้ตเดิม เปลี่ยนแค่รูปคลื่น</strong> — ดูทรงคลื่น &quot;morph&quot; ไปมา (square <img class="emoji" draggable="false" alt="↔" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2194.svg" data-marp-twemoji=""/> sine) ความถี่คงเดิม:</p>
<p><img src="img/wave_sq_sine_morph.gif" alt="" style="width:600px;" /></p>
<blockquote>
<p>มี TRIANGLE / SAW ด้วย น้ำเสียงก้ำกึ่งระหว่างสองแบบนี้ คาบนี้เราโฟกัส SQUARE กับ SINE ก่อน</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--theme:default;" data-marpit-pagination-total="31">
<h1 id="%E0%B8%94%E0%B8%B9%E0%B8%A3%E0%B8%B9%E0%B8%9B%E0%B8%84%E0%B8%A5%E0%B8%B7%E0%B9%88%E0%B8%99%E0%B8%97%E0%B8%B1%E0%B9%89%E0%B8%87-4-%E0%B9%81%E0%B8%9A%E0%B8%9A-%E0%B8%82%E0%B8%A2%E0%B8%B1%E0%B8%9A%E0%B8%88%E0%B8%A3%E0%B8%B4%E0%B8%87">ดูรูปคลื่นทั้ง 4 แบบ &quot;ขยับจริง&quot;</h1>
<p>โน้ตเดียวกัน (ความถี่เท่ากัน) เปลี่ยนแค่ <code>wave</code> รูปคลื่นที่ลำโพงวาดก็เปลี่ยนรูปทรง — นี่คือสิ่งที่หูเราตีความเป็น &quot;น้ำเสียง&quot; ที่ต่างกัน:</p>
<p><img src="img/waveform_morph.gif" alt="" style="width:560px;" /></p>
<div style="font-size:0.86em">
<table>
<thead>
<tr>
<th>รูปคลื่น</th>
<th>ทรง</th>
<th>ความรู้สึก</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>WAVE_SQUARE</code></td>
<td>สี่เหลี่ยม</td>
<td>กระด้าง เป็นเกม 8-bit</td>
</tr>
<tr>
<td><code>WAVE_SINE</code></td>
<td>โค้งนุ่ม</td>
<td>กลม นุ่มนวล</td>
</tr>
<tr>
<td><code>WAVE_TRIANGLE</code></td>
<td>สามเหลี่ยม</td>
<td>นุ่มแต่มีเหลี่ยม</td>
</tr>
<tr>
<td><code>WAVE_SAW</code></td>
<td>ฟันเลื่อย</td>
<td>คม สดใส แหลม</td>
</tr>
</tbody>
</table>
</div>
<blockquote>
<p>ทั้ง 4 ตัวนี้เรียกผ่าน <code>ui.WAVE_*</code> ได้จริงบนบอร์ด ลองสลับดูว่าเสียงของกลุ่มเราเข้ากับแบบไหน</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--theme:default;" data-marpit-pagination-total="31">
<h1 id="%E0%B9%82%E0%B8%99%E0%B9%89%E0%B8%95%E0%B9%80%E0%B8%9B%E0%B9%87%E0%B8%99%E0%B8%95%E0%B8%B1%E0%B8%A7%E0%B9%80%E0%B8%A5%E0%B8%82--%E0%B9%80%E0%B8%A5%E0%B8%82-midi">โน้ตเป็นตัวเลข — เลข MIDI</h1>
<p><code>ui.tone</code> ไม่ต้องจำความถี่เป็นเฮิรตซ์ ใช้ <strong>เลข MIDI</strong> ที่จำง่ายกว่า:</p>
<table>
<thead>
<tr>
<th>เลข MIDI</th>
<th>โน้ต</th>
<th>หมายเหตุ</th>
</tr>
</thead>
<tbody>
<tr>
<td>60</td>
<td>C4 (โดกลาง)</td>
<td>จุดอ้างอิงที่จำง่าย</td>
</tr>
<tr>
<td>62</td>
<td>D4 (เร)</td>
<td>+2 = เต็มเสียง</td>
</tr>
<tr>
<td>64</td>
<td>E4 (มี)</td>
<td></td>
</tr>
<tr>
<td>65</td>
<td>F4 (ฟา)</td>
<td>+1 = ครึ่งเสียง</td>
</tr>
<tr>
<td>67</td>
<td>G4 (ซอล)</td>
<td></td>
</tr>
</tbody>
</table>
<p>กติกาที่ต้องจำ:</p>
<p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mtext>+1</mtext><mo>=</mo><mtext>ครึ่งเสียง</mtext><mspace width="2em"/><mtext>+12</mtext><mo>=</mo><mtext>สูงขึ้น 1 ออกเทฟ</mtext></mrow><annotation encoding="application/x-tex">\text{+1} = \text{ครึ่งเสียง} \qquad \text{+12} = \text{สูงขึ้น 1 ออกเทฟ}
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord text"><span class="mord">+1</span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.7667em;vertical-align:-0.0833em;"></span><span class="mord text"><span class="mord brahmic_fallback">ครึ่งเสียง</span></span><span class="mspace" style="margin-right:2em;"></span><span class="mord text"><span class="mord">+12</span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord text"><span class="mord brahmic_fallback">สูงขึ้น</span><span class="mord"> 1 </span><span class="mord brahmic_fallback">ออกเทฟ</span></span></span></span></span></span></p><blockquote>
<p>อยากได้เสียงเดิมแต่สูงขึ้นทั้งชุด? บวก 12 เข้าไปทุกโน้ตได้เลย</p>
</blockquote>
<p><img src="img/midi_keyboard.png" alt="" style="width:640px;" /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--theme:default;" data-marpit-pagination-total="31">
<h1 id="%E0%B8%97%E0%B8%B3%E0%B9%84%E0%B8%A1-12--%E0%B8%AA%E0%B8%B9%E0%B8%87%E0%B8%82%E0%B8%B6%E0%B9%89%E0%B8%99-1-%E0%B8%AD%E0%B8%AD%E0%B8%81%E0%B9%80%E0%B8%97%E0%B8%9F">ทำไม &quot;+12 = สูงขึ้น 1 ออกเทฟ&quot;</h1>
<p>เลข MIDI เป็นแค่ดัชนี บอร์ดต้องแปลงเป็น <strong>ความถี่จริง (Hz)</strong> ก่อนถึงเล่นได้ สูตรที่เฟิร์มแวร์ใช้จริงคือ:</p>
<p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>f</mi><mo stretchy="false">(</mo><mi>n</mi><mo stretchy="false">)</mo><mo>=</mo><mn>440</mn><mo>×</mo><msup><mn>2</mn><mrow><mtext> </mtext><mo stretchy="false">(</mo><mi>n</mi><mo>−</mo><mn>69</mn><mo stretchy="false">)</mo><mi mathvariant="normal">/</mi><mn>12</mn></mrow></msup></mrow><annotation encoding="application/x-tex">f(n) = 440 \times 2^{\,(n - 69)/12}
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.1076em;">f</span><span class="mopen">(</span><span class="mord mathnormal">n</span><span class="mclose">)</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">440</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.938em;"></span><span class="mord"><span class="mord">2</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.938em;"><span style="top:-3.113em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mspace mtight" style="margin-right:0.1952em;"></span><span class="mopen mtight">(</span><span class="mord mathnormal mtight">n</span><span class="mbin mtight">−</span><span class="mord mtight">69</span><span class="mclose mtight">)</span><span class="mord mtight">/12</span></span></span></span></span></span></span></span></span></span></span></span></span></p><p>โน้ต <code>69</code> คือ A4 = เสียงอ้างอิงมาตรฐาน <strong>440 Hz</strong> ทุกครั้งที่บวกโน้ตขึ้น 12 ตัว เลขชี้กำลังเพิ่มขึ้น 1 พอดี:</p>
<p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msup><mn>2</mn><mrow><mtext> </mtext><mn>12</mn><mi mathvariant="normal">/</mi><mn>12</mn></mrow></msup><mo>=</mo><msup><mn>2</mn><mn>1</mn></msup><mo>=</mo><mn>2</mn><mspace width="1em"/><mo>⇒</mo><mspace width="1em"/><mtext>ความถี่ &quot;คูณสอง&quot;</mtext></mrow><annotation encoding="application/x-tex">2^{\,12/12} = 2^{1} = 2 \quad\Rightarrow\quad \text{ความถี่ &quot;คูณสอง&quot;}
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.938em;"></span><span class="mord"><span class="mord">2</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.938em;"><span style="top:-3.113em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mspace mtight" style="margin-right:0.1952em;"></span><span class="mord mtight">12/12</span></span></span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.8641em;"></span><span class="mord"><span class="mord">2</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8641em;"><span style="top:-3.113em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">1</span></span></span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">2</span><span class="mspace" style="margin-right:1em;"></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">⇒</span><span class="mspace" style="margin-right:1em;"></span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6944em;"></span><span class="mord text"><span class="mord brahmic_fallback">ความถี่</span><span class="mord"> &quot;</span><span class="mord brahmic_fallback">คูณสอง</span><span class="mord">&quot;</span></span></span></span></span></span></p><p>และ +1 โน้ตคือคูณด้วย <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msup><mn>2</mn><mrow><mn>1</mn><mi mathvariant="normal">/</mi><mn>12</mn></mrow></msup><mo>≈</mo><mn>1.0595</mn></mrow><annotation encoding="application/x-tex">2^{1/12} \approx 1.0595</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.888em;"></span><span class="mord"><span class="mord">2</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.888em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">1/12</span></span></span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">≈</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">1.0595</span></span></span></span> — นี่คือที่มาของคำว่า &quot;ครึ่งเสียง&quot;</p>
<p><img src="img/midi_freq_graph.png" alt="" style="width:680px;" /></p>
<blockquote>
<p>เส้นโค้งไม่ใช่เส้นตรง เพราะหูเรารับ &quot;ระดับเสียง&quot; เป็นอัตราส่วน (เท่าตัว) ไม่ใช่ผลบวก — คณิตของเสียงจึงเป็น <strong>เลขชี้กำลัง</strong> ไม่ใช่เส้นตรง</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--theme:default;" data-marpit-pagination-total="31">
<h1 id="%E0%B8%9E%E0%B8%B2%E0%B8%A3%E0%B8%B2%E0%B8%A1%E0%B8%B4%E0%B9%80%E0%B8%95%E0%B8%AD%E0%B8%A3%E0%B9%8C%E0%B8%82%E0%B8%AD%E0%B8%87-uitone">พารามิเตอร์ของ ui.tone</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">ui.tone(note, wave, velocity, ms)
</code></pre>
<div style="font-size:0.92em">
<table>
<thead>
<tr>
<th>พารามิเตอร์</th>
<th>ความหมาย</th>
<th>ช่วงค่า</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>note</code></td>
<td>เลข MIDI ของโน้ต</td>
<td>60 = โดกลาง</td>
</tr>
<tr>
<td><code>wave</code></td>
<td>รูปคลื่น</td>
<td><code>ui.WAVE_SQUARE</code> / <code>ui.WAVE_SINE</code></td>
</tr>
<tr>
<td><code>velocity</code></td>
<td>ความดัง</td>
<td>0–127</td>
</tr>
<tr>
<td><code>ms</code></td>
<td>ความยาวเสียง (มิลลิวินาที)</td>
<td>เช่น 200</td>
</tr>
</tbody>
</table>
</div>
<blockquote>
<p>เคล็ดลับ: <code>ui.tone</code> เล่นทีละโน้ต เราต้อง <strong>หน่วงเวลาเอง</strong> ระหว่างโน้ต ไม่งั้นมันจะเกยกันจนฟังไม่เป็นจังหวะ</p>
</blockquote>
<p><img src="img/tone_params.png" alt="" style="width:640px;" /></p>
<blockquote>
<p><strong>ทฤษฎี → โค้ด (bridge):</strong></p>
<ul>
<li><strong><code>velocity = 100</code></strong> ที่เห็นใน <code>ui.tone(note, ui.WAVE_SQUARE, 100, NOTE_MS)</code> (<code>s08_sound.py:37,45</code>) คือค่าความดังในสเกล <strong>MIDI 0–127</strong> (ตารางข้างบน) — <code>100</code> ≈ ดังราว 79% ลองลดเหลือ <code>40</code> แล้วฟังว่าเบาลง</li>
<li>สูตรแปลงเลข MIDI → ความถี่ <code>f(n)=440·2^((n−69)/12)</code> และการหยิบ <strong>wavetable</strong> มาวาดเป็นสัญญาณ <strong>ไม่มีบรรทัด Python บรรทัดไหนทำ</strong> — มันรันใน <strong>C engine</strong> ของบอร์ด บรรทัด Python ที่ใกล้ที่สุดคือ <code>ui.tone(...)</code> (<code>s08_sound.py:37,45</code>) ที่ &quot;สั่ง&quot; ให้ engine ไปคำนวณให้ นี่คือ abstraction ที่เรายอมรับ: เราคุมแค่ <code>note</code> + <code>wave</code> + <code>velocity</code> + <code>ms</code> ที่เหลือ engine จัดการหมด</li>
</ul>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--theme:default;" data-marpit-pagination-total="31">
<h1 id="%E0%B8%AA%E0%B9%88%E0%B8%A7%E0%B8%99%E0%B8%97%E0%B8%B5%E0%B9%88-1--%E0%B9%80%E0%B8%AA%E0%B8%B5%E0%B8%A2%E0%B8%87%E0%B8%AA%E0%B8%B3%E0%B9%80%E0%B8%A3%E0%B9%87%E0%B8%88%E0%B8%A3%E0%B8%B9%E0%B8%9B-uisfx">ส่วนที่ 1 — เสียงสำเร็จรูป ui.sfx</h1>
<p><code>ui.sfx(id)</code> คือเสียงที่ C engine บนบอร์ดเตรียมไว้ให้แล้ว เราแค่หยิบ id มาเรียก<br />
ไม่ต้องจำความถี่ ไม่ต้องแต่งเอง</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">import</span> ui
<span class="hljs-keyword">import</span> time

<span class="hljs-comment"># id พวกนี้นิยามไว้ในโมดูล ui แล้ว เราแค่หยิบมาใช้</span>
<span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;เล่น sfx: เริ่มเกม&quot;</span>)
ui.sfx(ui.SFX_UI_START)
time.sleep_ms(<span class="hljs-number">600</span>)

<span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;เล่น sfx: กินอาหาร (snake)&quot;</span>)
ui.sfx(ui.SFX_SNAKE_EAT)
time.sleep_ms(<span class="hljs-number">400</span>)

<span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;เล่น sfx: เกมจบ&quot;</span>)
ui.sfx(ui.SFX_GAME_OVER)
time.sleep_ms(<span class="hljs-number">900</span>)
</code></pre>
<p><img src="img/bento_ide_sfx_demo.png" alt="" style="width:560px;" /><br />
<sub>รันโค้ดข้างบนใน BENTO IDE → คอนโซลพิมพ์ <code>เล่น sfx: ...</code> ทีละบรรทัด พร้อมกับเสียงดังจากลำโพงบนบอร์ด</sub></p>
<blockquote>
<p>ใส่ <code>sleep_ms</code> คั่น เพื่อให้แต่ละเสียงเล่นจบก่อนเริ่มเสียงถัดไป — ไม่งั้นมันจะตัดทับกัน</p>
</blockquote>
<blockquote>
<p><strong>เชื่อมกับเกมของเรา:</strong> ในเกมที่เขียนด้วยโมดูล <code>bentogame</code> เราเรียกเสียงด้วย <strong>ชื่อ</strong> เช่น <code>game.sfx(&quot;eat&quot;)</code> / <code>game.sfx(&quot;die&quot;)</code> — เบื้องหลังมันเรียก <code>ui.sfx(...)</code> ที่เรียนในคาบนี้ให้เอง (เสียงเดียวกัน แค่ห่อด้วยชื่อที่จำง่ายกว่าเลข id) ความเข้าใจคาบนี้จึงใช้ได้กับทุกเกม</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--theme:default;" data-marpit-pagination-total="31">
<h1 id="sfx-id-%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B8%A1%E0%B8%B5%E0%B9%83%E0%B8%AB%E0%B9%89%E0%B9%83%E0%B8%8A%E0%B9%89">SFX id ที่มีให้ใช้</h1>
<p>ตัวอย่าง id เสียงสำเร็จรูป (หยิบมาจากโมดูล <code>ui</code> ตรง ๆ):</p>
<div style="font-size:0.92em">
<table>
<thead>
<tr>
<th>id</th>
<th>ใช้ตอนไหน</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>ui.SFX_UI_START</code></td>
<td>เริ่มเกม / กดเข้าเมนู</td>
</tr>
<tr>
<td><code>ui.SFX_SNAKE_EAT</code></td>
<td>กินอาหาร / เก็บไอเทม / ทำแต้ม</td>
</tr>
<tr>
<td><code>ui.SFX_GAME_OVER</code></td>
<td>เกมจบ / แพ้</td>
</tr>
</tbody>
</table>
</div>
<blockquote>
<p>เราใช้ชื่อ id ที่บอร์ดตั้งไว้ ไม่ต้องจำตัวเลข — โค้ดอ่านง่ายและสื่อความหมายชัด<br />
ใน Pong เราจะยืมเสียงเหล่านี้มาใช้ (เช่น <code>SFX_SNAKE_EAT</code> ตอนบอลกระทบไม้)</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--theme:default;" data-marpit-pagination-total="31">
<h1 id="%E0%B8%AA%E0%B9%88%E0%B8%A7%E0%B8%99%E0%B8%97%E0%B8%B5%E0%B9%88-2--%E0%B9%81%E0%B8%95%E0%B9%88%E0%B8%87%E0%B8%97%E0%B8%B3%E0%B8%99%E0%B8%AD%E0%B8%87%E0%B8%94%E0%B9%89%E0%B8%A7%E0%B8%A2-uitone">ส่วนที่ 2 — แต่งทำนองด้วย ui.tone</h1>
<p>ทีนี้มาแต่งทำนองเอง ทำนองนี้คือ &quot;โด เร มี ฟา ซอล&quot; (C major ครึ่งแรก)</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># ทำนองนี้คือ &quot;โด เร มี ฟา ซอล&quot; (C major scale ครึ่งแรก)</span>
melody = [<span class="hljs-number">60</span>, <span class="hljs-number">62</span>, <span class="hljs-number">64</span>, <span class="hljs-number">65</span>, <span class="hljs-number">67</span>]      <span class="hljs-comment"># เลข MIDI ของแต่ละโน้ต</span>
NOTE_MS = <span class="hljs-number">200</span>                      <span class="hljs-comment"># โน้ตละ 200 ms</span>

<span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;เล่นทำนองด้วย WAVE_SQUARE (เสียงเกมคลาสสิก)&quot;</span>)
<span class="hljs-keyword">for</span> note <span class="hljs-keyword">in</span> melody:
    ui.tone(note, ui.WAVE_SQUARE, <span class="hljs-number">100</span>, NOTE_MS)
    time.sleep_ms(NOTE_MS + <span class="hljs-number">20</span>)    <span class="hljs-comment"># +20 ms กันโน้ตเกยกัน ฟังเป็นจังหวะ</span>
</code></pre>
<blockquote>
<p>เก็บทำนองเป็น <code>list</code> ของเลข MIDI แล้ววน <code>for</code> เล่นทีละโน้ต — เพิ่ม/ลด/สลับโน้ตได้ง่ายมาก</p>
</blockquote>
<p>แต่ละค่าใน <code>melody</code> คือ &quot;ระดับเสียง&quot; — เรียงในลิสต์อย่างไร เสียงก็ไต่ขึ้นตามนั้น:</p>
<svg viewBox="0 0 620 200" width="640" style="background:#0d1117;border:1px solid #30363d;border-radius:10px">

    <ellipse cx="210" cy="132" rx="13" ry="9" fill="#ffa657" transform="rotate(-18 210 132)" />

  </g>
  
  <g>
    <ellipse cx="320" cy="108" rx="13" ry="9" fill="#e3b341" transform="rotate(-18 320 108)" />
    <text x="320" y="184" font-size="13" fill="#e6edf3" text-anchor="middle" font-family="monospace">64</text>

  </g>
  
  <g>
    <ellipse cx="410" cy="96" rx="13" ry="9" fill="#7ee787" transform="rotate(-18 410 96)" />
    <text x="410" y="184" font-size="13" fill="#e6edf3" text-anchor="middle" font-family="monospace">65</text>
    <text x="410" y="86" font-size="11" fill="#8b949e" text-anchor="middle">F4 ฟา</text>
    <text x="365" y="96" font-size="11" fill="#19c8ff" text-anchor="middle">+1</text>

  <g>

<blockquote>
<p>โน้ต <code>+1</code> (65→F4) คือก้าว <strong>ครึ่งเสียง</strong> จึงไต่ขึ้นน้อยกว่า <code>+2</code> ที่เป็นเต็มเสียง — ลำดับในลิสต์ = เส้นทางขึ้นของทำนองพอดี</p>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--theme:default;" data-marpit-pagination-total="31">
<h1 id="%E0%B8%9F%E0%B8%B1%E0%B8%87-sfx-%E0%B8%88%E0%B8%A3%E0%B8%B4%E0%B8%87%E0%B9%83%E0%B8%99%E0%B9%80%E0%B8%81%E0%B8%A1--interactive-viewer-%E0%B9%80%E0%B8%A5%E0%B8%B7%E0%B8%AD%E0%B8%81%E0%B9%80%E0%B8%AA%E0%B8%B5%E0%B8%A2%E0%B8%87--%E0%B8%A5%E0%B8%B2%E0%B8%81%E0%B8%8B%E0%B8%B9%E0%B8%A1%E0%B8%A3%E0%B8%B9%E0%B8%9B%E0%B8%84%E0%B8%A5%E0%B8%B7%E0%B9%88%E0%B8%99--spectrogram">ฟัง SFX จริงในเกม — interactive viewer (เลือกเสียง · ลากซูมรูปคลื่น · spectrogram)</h1>
<p>เสียงทั้ง <strong>21 ตัว</strong> สังเคราะห์ตรงจากตารางจริงใน firmware (<code>bento_sfx.c</code>) — กดเลือกเสียง → <strong>กดเล่น</strong> → ลากแถบ <strong>ซูม</strong> ดูรูปคลื่นราย cycle (เห็นทรง square / triangle / saw ชัด) → เทียบ <strong>spectrogram</strong> (ความถี่ตามเวลา = ทำนอง/การกวาด + harmonics)</p>
<div id="sfxv" style="font-size:0.6em;background:#0d1117;border:1px solid #30363d;border-radius:10px;padding:12px;margin-top:6px">
<div id="sfxbtns" style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px;align-items:center">
<span style="color:#7ee787;font-weight:600">Snake</span><button data-s="snake_eat">กิน</button><button data-s="snake_turn">เลี้ยว</button><button data-s="snake_die">ตาย</button>
<span style="color:#7ee787;font-weight:600;margin-left:8px">Flappy</span><button data-s="flappy_flap">กระพือ</button><button data-s="flappy_score">แต้ม</button><button data-s="flappy_die">ตาย</button>
<span style="color:#7ee787;font-weight:600;margin-left:8px">Pong</span><button data-s="pong_paddle">ไม้</button><button data-s="pong_wall">ขอบ</button><button data-s="pong_score">แต้ม</button><button data-s="pong_win">ชนะ</button><button data-s="pong_lose">แพ้</button>
<span style="color:#7ee787;font-weight:600;margin-left:8px">Shooter</span><button data-s="shoot_fire">ยิง</button><button data-s="shoot_hit">โดน</button><button data-s="shoot_explode">ระเบิด</button><button data-s="shoot_lose_life">เสียชีวิต</button>
<span style="color:#7ee787;font-weight:600;margin-left:8px">UI</span><button data-s="ui_start">เริ่ม</button><button data-s="ui_select">เลือก</button><button data-s="ui_move">เลื่อน</button><button data-s="ui_back">ย้อน</button><button data-s="ui_deny">ห้าม</button><button data-s="game_over">Game Over</button>
</div>
<div style="display:flex;gap:12px;align-items:center;margin-bottom:7px">
<button id="sfxpp" style="background:#4a90d9;color:#fff;border:0;border-radius:8px;padding:6px 16px;cursor:pointer">▶ เล่น</button>
<span>ซูม</span><input id="sfxz" type="range" min="1" max="100" value="60" style="flex:1" />
<b id="sfxlb" style="color:#19c8ff">snake_eat · square 659Hz</b>
</div>
<canvas id="sfxcv" style="width:100%;height:150px;background:#0d1117;border:1px solid #21262d;border-radius:6px;display:block"></canvas>
<div style="color:#8b949e;margin:6px 0 2px">spectrogram (ความถี่ ↕ · เวลา →):</div>
<img id="sfxsp" src="img/sfx_snake_eat_spec.png" style="width:100%;max-height:130px;object-fit:contain;background:#0d1117;border-radius:6px" />
</div>
<script src="img/sfx_samples.js"></script>
<script>
(function(){
var META={snake_eat:'square 659Hz',snake_turn:'triangle 330Hz',snake_die:'saw 523Hz',flappy_flap:'triangle 262Hz',flappy_score:'square 1319Hz',flappy_die:'saw 330Hz',pong_paddle:'square 659Hz',pong_wall:'square 392Hz',pong_score:'square 523Hz',pong_win:'square 523Hz · arp ↑',pong_lose:'saw 330Hz',shoot_fire:'saw 2637Hz กวาดลง',shoot_hit:'square 1047Hz',shoot_explode:'saw 131Hz',shoot_lose_life:'saw 196Hz',ui_start:'square 523Hz',ui_select:'square 1047Hz',ui_move:'square 1047Hz',ui_back:'square 784Hz',ui_deny:'saw 165Hz',game_over:'triangle 392Hz ลง'};
var box=document.getElementById('sfxv'); if(!box||box.dataset.i)return; box.dataset.i=1;
var cur='snake_eat', au=new Audio();
function draw(id,val){var s=(window.SFXSAMP||{})[id],per=(window.SFXPER||{})[id]||100,c=document.getElementById('sfxcv'); if(!s||!c)return;
 var dpr=window.devicePixelRatio||1,W=c.clientWidth||700,H=150; c.width=W*dpr; c.height=H*dpr;
 var ctx=c.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.fillStyle='#0d1117'; ctx.fillRect(0,0,W,H);
 var cycles=Math.round(2+(100-val)/100*30),win=Math.max(40,Math.min(s.length,Math.round(cycles*per))),st=Math.floor((s.length-win)/2),A=H*0.36;
 ctx.strokeStyle='#21262d'; ctx.lineWidth=1; [H/2-A,H/2,H/2+A].forEach(function(y){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();});
 ctx.strokeStyle='#79c0ff'; ctx.lineWidth=1.8; ctx.beginPath();
 for(var i=0;i<win;i++){var x=i/(win-1)*W,y=H/2-(s[st+i]/120)*A; i?ctx.lineTo(x,y):ctx.moveTo(x,y);} ctx.stroke();
 ctx.fillStyle='#8b949e'; ctx.font='12px sans-serif'; ctx.fillText('~'+cycles+' รอบคลื่น ('+(win/48).toFixed(1)+' ms)',10,18);}
function sel(id,play){cur=id; document.getElementById('sfxlb').textContent=id+' · '+(META[id]||''); document.getElementById('sfxsp').src='img/sfx_'+id+'_spec.png'; draw(id,+document.getElementById('sfxz').value); if(play){au.pause();au.src='img/sfx_'+id+'.mp3';au.currentTime=0;au.play();}}
box.querySelectorAll('button[data-s]').forEach(function(b){b.style.cssText='background:#161b22;color:#e6edf3;border:1px solid #30363d;border-radius:6px;padding:4px 9px;cursor:pointer';b.addEventListener('click',function(){sel(b.getAttribute('data-s'),true);});});
document.getElementById('sfxpp').addEventListener('click',function(){if(au.paused){if(!au.src)au.src='img/sfx_'+cur+'.mp3'; au.play();}else{au.pause();}});
au.addEventListener('play',function(){document.getElementById('sfxpp').textContent='⏸ หยุด';});
au.addEventListener('pause',function(){document.getElementById('sfxpp').textContent='▶ เล่น';});
au.addEventListener('ended',function(){document.getElementById('sfxpp').textContent='▶ เล่น';});
document.getElementById('sfxz').addEventListener('input',function(e){draw(cur,+e.target.value);});
function init(){draw('snake_eat',60);}
if(window.SFXSAMP){init();}else{window.addEventListener('load',function(){setTimeout(init,150);});}
window.addEventListener('resize',function(){setTimeout(function(){draw(cur,+document.getElementById('sfxz').value);},120);});
})();
</script>
<blockquote>
<p>ลากแถบ <strong>ซูม</strong>: ขวา = น้อย cycle (เห็นทรงคลื่นชัด เช่น square ของ snake_eat) · ซ้าย = หลาย cycle (เห็น envelope / การไล่โน้ต) · spectrogram โชว์การกวาดความถี่จริง (<code>ยิงเลเซอร์</code> saw กวาดลง, <code>Pong ชนะ</code> 4 โน้ตขึ้น) · เครื่องมือเต็มแยกหน้า: <a href="img/sound_video_demo.html">sound_video_demo</a></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--theme:default;" data-marpit-pagination-total="31">
<h1 id="%E0%B8%A5%E0%B8%AD%E0%B8%87%E0%B9%80%E0%B8%9B%E0%B8%A5%E0%B8%B5%E0%B9%88%E0%B8%A2%E0%B8%99%E0%B8%A3%E0%B8%B9%E0%B8%9B%E0%B8%84%E0%B8%A5%E0%B8%B7%E0%B9%88%E0%B8%99--%E0%B8%9F%E0%B8%B1%E0%B8%87%E0%B8%84%E0%B8%A7%E0%B8%B2%E0%B8%A1%E0%B8%95%E0%B9%88%E0%B8%B2%E0%B8%87">ลองเปลี่ยนรูปคลื่น — ฟังความต่าง</h1>
<p>โน้ตเดิมทั้งหมด เปลี่ยนแค่ <code>wave</code> จาก SQUARE เป็น SINE แล้วฟังว่าน้ำเสียงต่างกันแค่ไหน</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">time.sleep_ms(<span class="hljs-number">300</span>)

<span class="hljs-comment"># ลองเปลี่ยน &quot;รูปคลื่น&quot; แล้วฟังว่าน้ำเสียงต่างกันอย่างไร (โน้ตเดิมทั้งหมด)</span>
<span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;เล่นทำนองเดิมด้วย WAVE_SINE (เสียงนุ่มขึ้น)&quot;</span>)
<span class="hljs-keyword">for</span> note <span class="hljs-keyword">in</span> melody:
    ui.tone(note, ui.WAVE_SINE, <span class="hljs-number">100</span>, NOTE_MS)
    time.sleep_ms(NOTE_MS + <span class="hljs-number">20</span>)

<span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;จบแล็บเสียง — ลองแก้ melody / wave / NOTE_MS ดูว่าผลลัพธ์เปลี่ยนยังไง&quot;</span>)
</code></pre>
<div style="display:flex;gap:14px;align-items:center;justify-content:center;margin-top:4px;flex-wrap:wrap">
<code style="font-size:0.82em;background:#0d1117;color:#ff7b72;border:1px solid #30363d;border-radius:8px;padding:6px 10px">ui.WAVE_SQUARE</code>
<p><img src="img/wave_sq_sine_morph.gif" alt="" style="width:320px;" /></p>
<p><code style="font-size:0.82em;background:#0d1117;color:#79c0ff;border:1px solid #30363d;border-radius:8px;padding:6px 10px">ui.WAVE_SINE</code></p>
</div>
<blockquote>
<p>นี่คือหัวใจของแล็บ: <strong>เปลี่ยนตัวแปรเดียว (wave) ผลลัพธ์เปลี่ยนทั้งความรู้สึก</strong> — นี่แหละ waveform (รูปคลื่นข้างบน morph ตามที่เราสลับ <code>wave</code>)</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--theme:default;" data-marpit-pagination-total="31">
<h1 id="%E0%B8%AD%E0%B8%AD%E0%B8%81%E0%B9%81%E0%B8%9A%E0%B8%9A%E0%B9%80%E0%B8%AA%E0%B8%B5%E0%B8%A2%E0%B8%87%E0%B8%82%E0%B8%AD%E0%B8%87%E0%B8%81%E0%B8%A5%E0%B8%B8%E0%B9%88%E0%B8%A1%E0%B9%80%E0%B8%A3%E0%B8%B2%E0%B9%80%E0%B8%AD%E0%B8%87">ออกแบบเสียงของกลุ่มเราเอง</h1>
<p>เสียงที่ดี &quot;เล่าเรื่อง&quot; ได้ — โน้ต<strong>พุ่งขึ้น</strong> = &quot;ได้ของ!&quot; · โน้ต<strong>ตก</strong> = &quot;พลาด / เจ็บ&quot;<br />
ลองทำ helper เล็ก ๆ ที่เล่นทำนองจาก list ของโน้ต แล้วออกแบบเสียงของกลุ่มเอง:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">import</span> ui, time

<span class="hljs-comment"># helper: เล่นโน้ตทีละตัวจาก list (หน่วงเวลาให้เอง)</span>
<span class="hljs-keyword">def</span> <span class="hljs-title function_">play</span>(<span class="hljs-params">notes, wave=ui.WAVE_SQUARE, ms=<span class="hljs-number">110</span>, gap=<span class="hljs-number">20</span></span>):
    <span class="hljs-keyword">for</span> n <span class="hljs-keyword">in</span> notes:
        ui.tone(n, wave, <span class="hljs-number">110</span>, ms)
        time.sleep_ms(ms + gap)        <span class="hljs-comment"># ถ้าไม่หน่วง โน้ตจะเกยกัน</span>

coin = [<span class="hljs-number">72</span>, <span class="hljs-number">76</span>, <span class="hljs-number">79</span>]      <span class="hljs-comment"># โน้ตพุ่งขึ้น = เสียง &quot;ได้เหรียญ&quot;</span>
hurt = [<span class="hljs-number">60</span>, <span class="hljs-number">55</span>]          <span class="hljs-comment"># โน้ตตก = เสียง &quot;เจ็บ&quot;</span>
play(coin)               <span class="hljs-comment"># ฟังเสียงที่กลุ่มเราออกแบบเอง</span>
</code></pre>
<blockquote>
<p>ลองสลับเลขใน <code>coin</code> / <code>hurt</code> ฟังว่าชอบแบบไหน — นี่คือเสียง &quot;ของกลุ่มเรา&quot; ไม่ใช่เสียงสำเร็จรูป</p>
</blockquote>
<p><img src="img/pitch_contour.png" alt="" style="width:620px;" /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--theme:default;" data-marpit-pagination-total="31">
<h1 id="%E0%B9%80%E0%B8%AA%E0%B8%B5%E0%B8%A2%E0%B8%87%E0%B8%AA%E0%B8%B3%E0%B9%80%E0%B8%A3%E0%B9%87%E0%B8%88%E0%B8%A3%E0%B8%B9%E0%B8%9B%E0%B8%84%E0%B8%A3%E0%B8%9A%E0%B8%97%E0%B8%B8%E0%B8%81%E0%B9%80%E0%B8%81%E0%B8%A1-%E0%B8%AD%E0%B8%A2%E0%B8%B2%E0%B8%81%E0%B9%84%E0%B8%94%E0%B9%89%E0%B9%81%E0%B8%9A%E0%B8%9A%E0%B9%84%E0%B8%AB%E0%B8%99%E0%B8%AB%E0%B8%A2%E0%B8%B4%E0%B8%9A%E0%B9%80%E0%B8%A5%E0%B8%A2">เสียงสำเร็จรูปครบทุกเกม (อยากได้แบบไหนหยิบเลย)</h1>
<p>มีเสียงสำเร็จรูป <strong>ครบ 21 เสียง</strong> เรียกได้ด้วยชื่อง่าย ๆ <code>game.sfx(&quot;ชื่อ&quot;)</code> — เป็นชุดเดียวกับที่เกม C บนบอร์ดใช้จริง:</p>
<div style="font-size:0.86em">
<table>
<thead>
<tr>
<th>เกม</th>
<th>ชื่อเสียง</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Snake</strong></td>
<td><code>eat</code> · <code>turn</code> · <code>die</code></td>
</tr>
<tr>
<td><strong>Flappy</strong></td>
<td><code>flap</code> · <code>point</code> · <code>fall</code></td>
</tr>
<tr>
<td><strong>Pong</strong></td>
<td><code>wall</code> · <code>paddle</code> · <code>pong_score</code> · <code>win</code> · <code>lose</code></td>
</tr>
<tr>
<td><strong>Shooter</strong></td>
<td><code>fire</code> · <code>hit</code> · <code>explode</code> · <code>lose_life</code></td>
</tr>
<tr>
<td><strong>UI / ทั่วไป</strong></td>
<td><code>start</code> · <code>select</code> · <code>back</code> · <code>deny</code> · <code>move</code> · <code>gameover</code></td>
</tr>
</tbody>
</table>
</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">import</span> bentogame <span class="hljs-keyword">as</span> game
game.sfx(<span class="hljs-string">&quot;explode&quot;</span>)      <span class="hljs-comment"># เสียงระเบิดเดียวกับเกม Shooter ตัวจริง</span>
game.sfx(<span class="hljs-string">&quot;fall&quot;</span>)         <span class="hljs-comment"># นกตก (Flappy) — เรียกด้วยชื่อได้ทุกตัวแล้ว</span>
</code></pre>
<blockquote>
<p>ครบทั้ง 21 เสียง เรียกด้วยชื่อได้หมด — ลองหยิบไปใส่เกมของกลุ่มให้เข้ากับจังหวะ (เก็บแต้ม / ชน / แพ้)</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--theme:default;" data-marpit-pagination-total="31">
<h1 id="%E0%B8%A7%E0%B8%B4%E0%B8%98%E0%B8%B5%E0%B8%A3%E0%B8%B1%E0%B8%99%E0%B8%9A%E0%B8%99%E0%B8%9A%E0%B8%AD%E0%B8%A3%E0%B9%8C%E0%B8%94">วิธีรันบนบอร์ด</h1>
<p>โค้ดเต็มอยู่ที่ <a class="pc-gh-link" href="https://github.com/Advance-Innovation-Centre-AIC/embedded-systems-for-developer/blob/main/developer-i/practise_codes/s08_sound.py" target="_blank" rel="noopener" title="เปิดไฟล์บน GitHub (แท็บใหม่)" style="text-decoration:none"><code>practise_codes/s08_sound.py</code><sup style="color:#22d3ee;font-weight:800">&#8599;</sup></a> (เว้นช่องให้เราเติม)<br />
ลองเติมเองให้สุดก่อน เดี๋ยวเฉลยพร้อมกันในห้องเรียน</p>
<p><strong>ขั้นตอนรัน:</strong></p>
<ol>
<li>เปิดไฟล์ใน <strong>BENTO IDE</strong></li>
<li>กดปุ่ม <strong>Program to Device</strong></li>
<li>ฟังเสียงจากลำโพงบนบอร์ด — sfx 3 เสียง แล้วตามด้วยทำนอง 2 รอบ (square / sine)</li>
</ol>
<p><img src="img/Bento_IDE_Program_to_Device.png" alt="" style="width:520px;" /><br />
<sub>ปุ่ม Program to Device ใน BENTO IDE — flash โค้ดลงบอร์ดเพื่อให้เสียงดังจริง</sub></p>
<div style="border:2px solid #ff9800;border-radius:10px;padding:12px;background:#fff3e0;margin-top:12px;font-size:0.9em">
<b>สำคัญ:</b> เสียงดังจริง <b>เฉพาะบนบอร์ด</b> เท่านั้น — ถ้ารันบน desktop simulator จะเงียบ (no-op)
</div>
<blockquote>
<p>เราใช้ Program to Device เสมอ ไม่ใช้ <code>exec(open(...))</code> — ให้บอร์ดรันไฟล์โดยตรง</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--theme:default;" data-marpit-pagination-total="31">
<h1 id="%E0%B9%80%E0%B8%AD%E0%B8%B2%E0%B9%80%E0%B8%AA%E0%B8%B5%E0%B8%A2%E0%B8%87%E0%B9%84%E0%B8%9B%E0%B9%83%E0%B8%AA%E0%B9%88-pong">เอาเสียงไปใส่ Pong</h1>
<p>แนวคิดเดียวกันนี้เอาไปต่อใน Pong ได้ทันที วางเสียงตาม &quot;เหตุการณ์&quot; ในเกม:</p>
<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">
<div style="flex:1;min-width:280px;font-size:0.92em">
<table>
<thead>
<tr>
<th>เหตุการณ์ใน Pong</th>
<th>เสียงที่ใส่</th>
</tr>
</thead>
<tbody>
<tr>
<td>เริ่มเกม / เริ่มรอบใหม่</td>
<td><code>ui.sfx(ui.SFX_UI_START)</code></td>
</tr>
<tr>
<td>บอลกระทบไม้ตี</td>
<td><code>ui.sfx(ui.SFX_SNAKE_EAT)</code> (เสียง &quot;ป๊อก&quot;)</td>
</tr>
<tr>
<td>ทำแต้ม / ฝ่ายตรงข้ามพลาด</td>
<td>ทำนองสั้นด้วย <code>ui.tone</code></td>
</tr>
<tr>
<td>จบเกม</td>
<td><code>ui.sfx(ui.SFX_GAME_OVER)</code></td>
</tr>
</tbody>
</table>
</div>
<div style="flex:1.1;min-width:300px;text-align:center">
<p><img src="img/pong_sfx_events.png" alt="" style="width:430px;" /></p>
<p><sub>Pong จริงบนบอร์ด — แต่ละจุดสีคือ &quot;เหตุการณ์ → เสียง&quot; ที่เราวาง</sub></p>
</div>
</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># ตัวอย่างวางในลูปเกม Pong: บอลชนไม้ตี</span>
<span class="hljs-keyword">if</span> ball_hits_paddle:
    ui.sfx(ui.SFX_SNAKE_EAT)       <span class="hljs-comment"># เสียงตอบรับว่าตีโดน</span>
</code></pre>
<blockquote>
<p>วางเสียงตรง &quot;จุดที่เกิดเหตุการณ์&quot; ในลูป — เสียงคือ feedback ที่ทำให้เกมรู้สึกมีชีวิต</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--theme:default;" data-marpit-pagination-total="31">
<h1 id="%E0%B8%81%E0%B8%B1%E0%B8%9A%E0%B8%94%E0%B8%B1%E0%B8%81%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B9%80%E0%B8%88%E0%B8%AD%E0%B8%9A%E0%B9%88%E0%B8%AD%E0%B8%A2">กับดักที่เจอบ่อย</h1>
<div style="font-size:0.9em">
<table>
<thead>
<tr>
<th>อาการ</th>
<th>สาเหตุ</th>
<th>แก้</th>
</tr>
</thead>
<tbody>
<tr>
<td>ไม่ได้ยินเสียงเลย</td>
<td>รันบน simulator</td>
<td>ต้อง Program to Device ลงบอร์ดจริง</td>
</tr>
<tr>
<td>เสียงตัดทับกัน</td>
<td>ลืม <code>sleep_ms</code> คั่น</td>
<td>หน่วง <code>NOTE_MS + 20</code> ระหว่างโน้ต</td>
</tr>
<tr>
<td><code>AttributeError: WAVE_SQUARE</code></td>
<td>สะกดผิด / ลืม <code>ui.</code></td>
<td>ใช้ <code>ui.WAVE_SQUARE</code></td>
</tr>
<tr>
<td>ทำนองเร็ว/ช้าผิด</td>
<td>ปรับ <code>NOTE_MS</code> ผิดที่</td>
<td>แก้ค่าเดียวที่ <code>NOTE_MS</code></td>
</tr>
<tr>
<td>โน้ตเพี้ยน</td>
<td>ใส่ค่า note ผิด</td>
<td>60 = โดกลาง, +1 = ครึ่งเสียง</td>
</tr>
</tbody>
</table>
</div>
<blockquote>
<p>ถ้าโปรแกรมค้างให้กด <code>Ctrl-C</code> แล้ว Program to Device ใหม่อีกครั้ง</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--theme:default;" data-marpit-pagination-total="31">
<h1 id="%E0%B8%97%E0%B8%B1%E0%B9%89%E0%B8%87%E0%B9%82%E0%B8%9B%E0%B8%A3%E0%B9%81%E0%B8%81%E0%B8%A3%E0%B8%A1-s08_soundpy--%E0%B9%84%E0%B8%AB%E0%B8%A5%E0%B8%A2%E0%B8%B1%E0%B8%87%E0%B9%84%E0%B8%87-signal-%E2%86%92-trigger-%E2%86%92-engine">ทั้งโปรแกรม s08_sound.py · ไหลยังไง (signal → trigger → engine)</h1>
<p>โปรแกรมเดินเป็นเส้นตรง: เล่น sfx 3 เสียง → วนทำนอง SQUARE → วนทำนอง SINE → จบ ทุกครั้งที่เรียก <code>ui.tone</code> / <code>ui.sfx</code> หนึ่งบรรทัด งานหนัก (แปลงเลข → รูปคลื่น → DAC) จะ <strong>ข้ามเส้นไปทำใน C engine</strong> ของบอร์ด แล้วออกลำโพง:</p>
<div style="text-align:center">

    <rect x="150" y="40" width="150" height="46" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" /><text x="225" y="60" font-weight="700" fill="#2e7d32">ui.sfx × 3</text><text x="225" y="78" font-size="11" fill="#999">เริ่ม/กิน/จบ :18,22,26</text>
    <rect x="330" y="40" width="150" height="46" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" /><text x="405" y="60" font-weight="700" fill="#1565c0">for melody</text><text x="405" y="78" font-size="11" fill="#999">SQUARE :36-38</text>
    <rect x="510" y="40" width="150" height="46" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" /><text x="585" y="60" font-weight="700" fill="#1565c0">for melody</text><text x="585" y="78" font-size="11" fill="#999">SINE :44-46</text>
    <rect x="700" y="40" width="112" height="46" rx="22" fill="#cfd8dc" stroke="#607d8b" stroke-width="2" /><text x="756" y="62" font-weight="700" fill="#455a64">END</text><text x="756" y="79" font-size="11" fill="#999">จบแล็บ</text>

  <line x1="660" y1="63" x2="696" y2="63" stroke="#607d8b" stroke-width="2.4" marker-end="url(#ar)" />
  
  <path d="M340,50 C312,22 433,22 405,38" fill="none" stroke="#9e9e9e" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#ar)" />

  <text x="405" y="20" text-anchor="middle" font-size="10" fill="#9e9e9e">โน้ตถัดไป</text>
