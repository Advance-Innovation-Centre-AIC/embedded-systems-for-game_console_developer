<h2 id="%E0%B8%A8%E0%B8%B1%E0%B8%95%E0%B8%A3%E0%B8%B9--%E0%B8%8A%E0%B8%99%E0%B9%81%E0%B8%9A%E0%B8%9A%E0%B8%81%E0%B8%A5%E0%B9%88%E0%B8%AD%E0%B8%87--%E0%B8%84%E0%B8%B0%E0%B9%81%E0%B8%99%E0%B8%99-%E0%B8%8A%E0%B8%B5%E0%B8%A7%E0%B8%B4%E0%B8%95--game-over">ศัตรู · ชนแบบกล่อง · คะแนน-ชีวิต · GAME OVER</h2>

<h1 id="%E0%B8%97%E0%B8%A7%E0%B8%99%E0%B8%84%E0%B8%B2%E0%B8%9A-11--%E0%B8%8A%E0%B8%B8%E0%B8%94%E0%B8%81%E0%B8%A3%E0%B8%B0%E0%B8%AA%E0%B8%B8%E0%B8%99%E0%B8%AB%E0%B8%A1%E0%B8%B8%E0%B8%99%E0%B9%80%E0%B8%A7%E0%B8%B5%E0%B8%A2%E0%B8%99-5-%E0%B8%82%E0%B8%B1%E0%B9%89%E0%B8%99">ทวนคาบ 11 — ชุดกระสุนหมุนเวียน 5 ขั้น</h1>
<p>สร้างกระสุน 6 นัด <strong>ครั้งเดียว</strong> แล้ววนใช้ซ้ำ (เหมือนตู้ล็อกเกอร์ 6 ใบ) ภาษาอังกฤษเรียก <strong>Object Pool</strong> เอกสารไทยเขียน &quot;พูล&quot; — เราเรียก <strong>ชุดหมุนเวียน</strong></p>
<table>
<thead>
<tr>
<th>ขั้น</th>
<th>ความหมาย</th>
<th>โค้ด (ให้มาแล้วในไฟล์ practise)</th>
</tr>
</thead>
<tbody>
<tr>
<td>① สร้างชุดครั้งเดียว</td>
<td>กระสุน 6 นัด ก่อนเกมเริ่ม</td>
<td><code>bullets = [game.Box(0, -50, 6, 14, game.CYAN) for _ in range(MAX_BULLETS)]</code> <code>:23</code></td>
</tr>
<tr>
<td>② หาตัวว่าง</td>
<td><strong>ว่าง ⇔ <code>bullet.y &lt; -20</code></strong> (จอดรอเหนือจอ)</td>
<td><code>find_free_bullet()</code> <code>:37-41</code></td>
</tr>
<tr>
<td>③ ยืม</td>
<td>กด A → โผล่ที่หัวยาน</td>
<td><code>bullet.show(); bullet.move_to(ship_x + ship.w // 2 - 3, 340)</code> <code>:69</code></td>
</tr>
<tr>
<td>④ อัปเดตทุกเฟรม</td>
<td>บินขึ้นเฟรมละ 9 px</td>
<td><code>bullet.move_to(bullet.x, bullet.y - 9)</code> <code>:73</code></td>
</tr>
<tr>
<td>⑤ คืน</td>
<td>พ้นจอบน → กลับเป็นว่างเอง</td>
<td><code>if bullet.y &lt; -20: bullet.hide()</code> <code>:74</code></td>
</tr>
</tbody>
</table>
<p>เลขบรรทัดในสไลด์: <code>:23</code> = ไฟล์ <a class="pc-gh-link" href="https://github.com/Advance-Innovation-Centre-AIC/embedded-systems-for-developer/blob/main/developer-i/practise_codes/shooter_step4.py" target="_blank" rel="noopener" title="เปิดไฟล์บน GitHub (แท็บใหม่)" style="text-decoration:none"><code>practise_codes/shooter_step4.py</code><sup style="color:#22d3ee;font-weight:800">&#8599;</sup></a> ที่เปิดอยู่ · <code>sol4:30</code> = ไฟล์เฉลย <code>solution_codes/shooter_step4.py</code></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="4" style="--paginate:true;--theme:default;" data-marpit-pagination-total="36">
<h1 id="%E0%B8%A8%E0%B8%B1%E0%B8%95%E0%B8%A3%E0%B8%B9%E0%B9%83%E0%B8%99-step4--%E0%B8%A7%E0%B8%99%E0%B8%81%E0%B8%A5%E0%B8%B1%E0%B8%9A%E0%B8%82%E0%B8%B6%E0%B9%89%E0%B8%99%E0%B8%9A%E0%B8%99-%E0%B8%95%E0%B8%AD%E0%B8%9A%E0%B8%84%E0%B8%B3%E0%B8%96%E0%B8%B2%E0%B8%A1%E0%B8%97%E0%B9%89%E0%B8%B2%E0%B8%A2%E0%B8%84%E0%B8%B2%E0%B8%9A-11">ศัตรูใน step4 — &quot;วนกลับขึ้นบน&quot; (ตอบคำถามท้ายคาบ 11)</h1>
<p><img src="img/s12_respawn_loop.png" alt="" style="width:540px;" /></p>
<p><strong>คาบ 11 ถาม:</strong> ศัตรูที่ตกพ้นจอล่าง ควร &quot;คืนแล้วรอให้ยืม&quot; แบบกระสุน หรือ &quot;วนกลับขึ้นไปข้างบน&quot; เลย? → <strong>step4 วนกลับขึ้นบนเลย</strong> เพราะศัตรูต้องตกลงมาตลอด ไม่มีปุ่มไหนมาขอยืม</p>
<table>
<thead>
<tr>
<th></th>
<th>กระสุน (คาบ 11)</th>
<th>ศัตรู (step4)</th>
</tr>
</thead>
<tbody>
<tr>
<td>มีสถานะ &quot;ว่าง&quot; ไหม</td>
<td>มี: <code>bullet.y &lt; -20</code></td>
<td><strong>ไม่มี</strong> — ใช้อยู่ตลอดเกม</td>
</tr>
<tr>
<td>จบรอบเมื่อ → แล้วไง</td>
<td>พ้นจอบน → คืน รอให้ยืมตอนกด A</td>
<td>หลุดพื้น <strong>หรือ</strong> โดนยิง → <code>respawn_enemy(index)</code> ตกต่อทันที</td>
</tr>
<tr>
<td>จำนวนกล่อง</td>
<td>6 ตลอดเกม</td>
<td>6 ตลอดเกม</td>
</tr>
</tbody>
</table>
<blockquote>
<p>Catch ย้ายของไปที่ y = 0 (ขอบบนจอ) · step4 ย้ายไปเหนือจอ y −200 … −20 แล้วค่อย ๆ โผล่ลงมา · แบบ &quot;คืนแล้วรอให้ยืม&quot; ของศัตรูอยู่ใน step5 ท้ายคาบ</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="5" style="--paginate:true;--theme:default;" data-marpit-pagination-total="36">
<h1 id="%E0%B8%97%E0%B8%B2%E0%B8%A2%E0%B8%81%E0%B9%88%E0%B8%AD%E0%B8%99--%E0%B8%96%E0%B9%89%E0%B8%B2%E0%B8%A8%E0%B8%B1%E0%B8%95%E0%B8%A3%E0%B8%B9%E0%B9%84%E0%B8%A1%E0%B9%88%E0%B8%AA%E0%B8%B8%E0%B9%88%E0%B8%A1%E0%B9%80%E0%B8%A5%E0%B8%A2-%E0%B8%88%E0%B8%B0%E0%B9%80%E0%B8%81%E0%B8%B4%E0%B8%94%E0%B8%AD%E0%B8%B0%E0%B9%84%E0%B8%A3%E0%B8%82%E0%B8%B6%E0%B9%89%E0%B8%99">ทายก่อน — ถ้าศัตรูไม่สุ่มเลย จะเกิดอะไรขึ้น?</h1>
<p><img src="img/s12_spawn_row.png" alt="" style="width:760px;" /></p>
<ul>
<li>สมมติทุกตัวเริ่มที่ <code>y = -50</code> และตกเฟรมละ 3 px เท่ากันหมด</li>
<li><strong>ทาย:</strong> ถึงพื้นเฟรมที่เท่าไร? แล้วชีวิต 3 ดวงจะเป็นอย่างไร? (จดคำตอบไว้ก่อน)</li>
</ul>
<blockquote>
<p>ใบ้: ต้องเดินจาก −50 ไปให้เลย 398 (พื้น) ทีละ 3 px</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--theme:default;" data-marpit-pagination-total="36">
<h1 id="%E0%B9%80%E0%B8%89%E0%B8%A5%E0%B8%A2--%E0%B8%96%E0%B8%B6%E0%B8%87%E0%B8%9E%E0%B8%B7%E0%B9%89%E0%B8%99%E0%B8%9E%E0%B8%A3%E0%B9%89%E0%B8%AD%E0%B8%A1%E0%B8%81%E0%B8%B1%E0%B8%99-%E0%B9%80%E0%B8%AA%E0%B8%B5%E0%B8%A2-3-%E0%B8%8A%E0%B8%B5%E0%B8%A7%E0%B8%B4%E0%B8%95%E0%B9%83%E0%B8%99%E0%B9%80%E0%B8%9F%E0%B8%A3%E0%B8%A1%E0%B9%80%E0%B8%94%E0%B8%B5%E0%B8%A2%E0%B8%A7">เฉลย — ถึงพื้นพร้อมกัน เสีย 3 ชีวิตในเฟรมเดียว</h1>
<ul>
<li>ระยะทาง 398 − (−50) = 448 px · เฟรมละ 3 → 448 ÷ 3 = 149.3 → <strong>ทุกตัวถึงพื้นเฟรมที่ 150 พร้อมกัน</strong></li>
<li>เฟรมนั้นลูปเจอตัวที่ 1 → lives 2 · ตัวที่ 2 → lives 1 · ตัวที่ 3 → lives 0 → <strong>GAME OVER ทันที</strong></li>
</ul>
<p>step4 จึงสุ่ม 2 อย่าง: <strong>ความสูงเริ่ม</strong> และ <strong>ความเร็ว</strong> (ภาพวาดตามสเกลจริงแกน y)</p>
<div style="display:flex;gap:18px;align-items:flex-start">
<div style="flex:0 0 500px">
<p><img src="img/s12_spawn_spread.png" alt="" style="width:500px;" /></p>
</div>
<div style="flex:1">
<table>
<thead>
<tr>
<th>ตัว</th>
<th>เริ่ม y</th>
<th>v</th>
<th>ถึงพื้นเฟรมที่</th>
<th>≈ วินาที*</th>
</tr>
</thead>
<tbody>
<tr>
<td>A</td>
<td>−40</td>
<td>4.5</td>
<td>98</td>
<td>3.3</td>
</tr>
<tr>
<td>B</td>
<td>−200</td>
<td>3.5</td>
<td>171</td>
<td>5.7</td>
</tr>
<tr>
<td>C</td>
<td>−400</td>
<td>2.5</td>
<td>320</td>
<td>10.7</td>
</tr>
</tbody>
</table>
<p><strong>คำพูด:</strong> ตำแหน่งใหม่ = ตำแหน่งเดิม + ความเร็ว ทุกเฟรม (เหมือน Catch) → เฟรมจนถึงพื้น ≈ (398 − y เริ่ม) ÷ v · ตัว B: 598 ÷ 3.5 = 170.9 → <strong>171</strong></p>
<p><span style="font-size:.8em">*ถ้าบอร์ดวิ่ง 30 เฟรม/วินาที</span></p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--theme:default;" data-marpit-pagination-total="36">
<h1 id="%E0%B8%8A%E0%B8%99%E0%B9%81%E0%B8%9A%E0%B8%9A%E0%B8%81%E0%B8%A5%E0%B9%88%E0%B8%AD%E0%B8%87-aabb--%E0%B9%82%E0%B8%94%E0%B8%99--%E0%B8%95%E0%B9%89%E0%B8%AD%E0%B8%87%E0%B8%97%E0%B8%B1%E0%B8%9A%E0%B8%81%E0%B8%B1%E0%B8%99%E0%B8%88%E0%B8%A3%E0%B8%B4%E0%B8%87">ชนแบบกล่อง (AABB) — โดน = ต้องทับกันจริง</h1>
<p><img src="img/s12_aabb_cases.png" alt="" style="width:900px;" /></p>
<table>
<thead>
<tr>
<th>สมุดบนโต๊ะ</th>
<th>ในเกม</th>
<th>ในโค้ด</th>
</tr>
</thead>
<tbody>
<tr>
<td>สมุด 2 เล่มวางบนโต๊ะ</td>
<td>กระสุน 6×14 กับศัตรู 30×24</td>
<td><code>bullet</code>, <code>enemy</code> (กล่อง <code>game.Box</code>)</td>
</tr>
<tr>
<td>ยังสอดไม้บรรทัดผ่านช่องได้ ด้านใดด้านหนึ่ง</td>
<td>มีช่องว่าง = <strong>พลาด</strong></td>
<td>เงื่อนไขอย่างน้อย 1 ข้อเป็น <code>False</code></td>
</tr>
<tr>
<td>สอดไม่ได้เพราะซ้อนกันอยู่</td>
<td>ทับกัน = <strong>โดน</strong></td>
<td><code>game.hit(bullet, enemy)</code> คืน <code>True</code></td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>ขอบชนกันพอดี (ช่องว่าง 0 px) ยังไม่นับ</strong> — ต้องทับกันจริงนิดหนึ่ง · กล่องในเกม <strong>ตั้งตรงเสมอ</strong> ไม่เอียงแบบสมุด (AABB = Axis-Aligned Bounding Box)</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--theme:default;" data-marpit-pagination-total="36">
<h1 id="%E0%B8%95%E0%B8%B2%E0%B8%A1%E0%B8%95%E0%B8%B1%E0%B8%A7%E0%B9%80%E0%B8%A5%E0%B8%82%E0%B8%88%E0%B8%A3%E0%B8%B4%E0%B8%87%E0%B8%97%E0%B8%B5%E0%B8%A5%E0%B8%B0%E0%B9%80%E0%B8%9F%E0%B8%A3%E0%B8%A1--%E0%B8%8A%E0%B9%88%E0%B8%AD%E0%B8%87%E0%B8%A7%E0%B9%88%E0%B8%B2%E0%B8%87%E0%B8%AB%E0%B8%94%E0%B8%88%E0%B8%99%E0%B8%AB%E0%B8%B2%E0%B8%A2">ตามตัวเลขจริงทีละเฟรม — ช่องว่างหดจนหาย</h1>
<p><img src="img/s12_aabb_trace.png" alt="" style="width:760px;" /></p>
<p>กระสุนขึ้นเฟรมละ <strong>9</strong> ศัตรูลงเฟรมละ <strong>3.5</strong> → ช่องว่างหดเฟรมละ 9 + 3.5 = <strong>12.5 px</strong>: 47.5 → 35 → 22.5 → 10 → ทับกัน</p>
<table>
<thead>
<tr>
<th>ข้อ</th>
<th>ถามว่า</th>
<th>เลขเฟรม 5 (กระสุน x = 312 · ศัตรู x = 300)</th>
<th>ผล</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td>ขอบซ้ายกระสุน อยู่ก่อนขอบขวาศัตรู?</td>
<td>312 &lt; 300 + 30 = 330</td>
<td>✓</td>
</tr>
<tr>
<td>2</td>
<td>ขอบขวากระสุน เลยขอบซ้ายศัตรู?</td>
<td>312 + 6 = 318 &gt; 300</td>
<td>✓</td>
</tr>
<tr>
<td>3</td>
<td>ขอบบนกระสุน อยู่เหนือขอบล่างศัตรู?</td>
<td>139 &lt; 117.5 + 24 = 141.5</td>
<td>✓</td>
</tr>
<tr>
<td>4</td>
<td>ขอบล่างกระสุน เลยขอบบนศัตรู?</td>
<td>139 + 14 = 153 &gt; 117.5</td>
<td>✓</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>ทาย:</strong> ถ้ากระสุนอยู่ที่ x = 330 (ขอบชนขอบขวาศัตรูพอดี ช่องว่าง 0 px) ข้อ 1 ได้อะไร โดนไหม?</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--theme:default;" data-marpit-pagination-total="36">
<h1 id="%E0%B8%81%E0%B8%8E-%E2%86%92-%E0%B8%AA%E0%B8%B9%E0%B8%95%E0%B8%A3-%E2%86%92-gamehit-%E0%B8%97%E0%B8%B5%E0%B9%88-engine-%E0%B9%80%E0%B8%82%E0%B8%B5%E0%B8%A2%E0%B8%99%E0%B9%84%E0%B8%A7%E0%B9%89%E0%B9%83%E0%B8%AB%E0%B9%89">กฎ → สูตร → <code>game.hit</code> ที่ engine เขียนไว้ให้</h1>

n></span></span></span> = กว้าง · <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>h</mi></mrow><annotation encoding="application/x-tex">h</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6944em;"></span><span class="mord mathnormal">h</span></span></span></span> = สูง · <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>∧</mo></mrow><annotation encoding="application/x-tex">\wedge</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.5556em;"></span><span class="mord">∧</span></span></span></span> = &quot;และ&quot;</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">hit</span>(<span class="hljs-params">a, b</span>):                    <span class="hljs-comment"># a = กระสุน, b = ศัตรู  (bentogame.py:466-469)</span>
    <span class="hljs-string">&quot;&quot;&quot;True if Box a overlaps Box b (axis-aligned bounding-box test).&quot;&quot;&quot;</span>
    <span class="hljs-keyword">return</span> (a.x &lt; b.x + b.w <span class="hljs-keyword">and</span> a.x + a.w &gt; b.x <span class="hljs-keyword">and</span>
            a.y &lt; b.y + b.h <span class="hljs-keyword">and</span> a.y + a.h &gt; b.y)
</code></pre>
<ul>
<li><strong>เฉลยที่ทาย:</strong> x = 330 → ข้อ 1 <code>330 &lt; 330</code> เป็นเท็จ → <strong>ไม่นับ</strong> ขอบชนกันพอดียังไม่ใช่การทับ</li>
<li>ในแล็บเขียนว่า <code>if bullet.y &gt;= -20 and game.hit(bullet, enemy):</code> (<code>sol4:83</code>) — <code>bullet.y &gt;= -20</code> = นัดนี้ <strong>ใช้อยู่</strong> นัดว่างข้ามเลย</li>
</ul>

<h1 id="python-4-%E0%B8%97%E0%B9%88%E0%B8%B2%E0%B9%83%E0%B8%AB%E0%B8%A1%E0%B9%88%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B9%81%E0%B8%A5%E0%B9%87%E0%B8%9A%E0%B8%A7%E0%B8%B1%E0%B8%99%E0%B8%99%E0%B8%B5%E0%B9%89%E0%B9%83%E0%B8%8A%E0%B9%89">Python 4 ท่าใหม่ที่แล็บวันนี้ใช้</h1>
<p><span style="font-size:.85em;color:#57606a">ตัวอย่างทั่วไป (ไม่ใช่โค้ดแล็บ) ลองพิมพ์ทีละบรรทัดใน REPL ได้</span></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">import</span> random
random.choice([<span class="hljs-string">&quot;RED&quot;</span>, <span class="hljs-string">&quot;ORANGE&quot;</span>, <span class="hljs-string">&quot;PINK&quot;</span>])   <span class="hljs-comment"># สุ่มหยิบ 1 ชิ้นจาก list เช่น &quot;PINK&quot;</span>
random.uniform(<span class="hljs-number">2.5</span>, <span class="hljs-number">4.5</span>)                    <span class="hljs-comment"># สุ่มเลขทศนิยมในช่วง เช่น 3.48</span>
<span class="hljs-keyword">for</span> index, color <span class="hljs-keyword">in</span> <span class="hljs-built_in">enumerate</span>([<span class="hljs-string">&quot;RED&quot;</span>, <span class="hljs-string">&quot;ORANGE&quot;</span>]):
    <span class="hljs-built_in">print</span>(index, color)                     <span class="hljs-comment"># ได้ 0 RED แล้ว 1 ORANGE</span>
<span class="hljs-keyword">for</span> n <span class="hljs-keyword">in</span> [<span class="hljs-number">1</span>, <span class="hljs-number">2</span>, <span class="hljs-number">3</span>, <span class="hljs-number">4</span>]:
    <span class="hljs-keyword">if</span> n == <span class="hljs-number">2</span>:
        <span class="hljs-keyword">continue</span>                            <span class="hljs-comment"># ข้ามที่เหลือของรอบนี้ ไปรอบถัดไป</span>
    <span class="hljs-keyword">if</span> n == <span class="hljs-number">4</span>:
        <span class="hljs-keyword">break</span>                               <span class="hljs-comment"># ออกจากลูปทันที</span>
    <span class="hljs-built_in">print</span>(n)                                <span class="hljs-comment"># พิมพ์แค่ 1 กับ 3</span>
</code></pre>
<table>
<thead>
<tr>
<th>ท่า</th>
<th>ในแล็บใช้ทำอะไร</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>random.choice(list)</code> · <code>random.uniform(a, b)</code></td>
<td>สีสุ่ม <code>random.choice(ENEMY_COLORS)</code> · ความเร็วสุ่ม 2.5 … 4.5</td>
</tr>
<tr>
<td><code>enumerate(list)</code></td>
<td>ได้ทั้งลำดับ <code>index</code> และตัว <code>enemy</code> → ใช้ <code>enemy_speed[index]</code>, <code>respawn_enemy(index)</code></td>
</tr>
<tr>
<td><code>continue</code> · <code>break</code></td>
<td>ข้ามศัตรูที่หลุดพื้นแล้ว · เลิกเช็คกระสุนที่เหลือเมื่อโดนแล้ว</td>
</tr>
</tbody>
</table>
</section>

<h1 id="%E0%B8%AB%E0%B8%A5%E0%B8%B2%E0%B8%A2%E0%B8%95%E0%B9%88%E0%B8%AD%E0%B8%AB%E0%B8%A5%E0%B8%B2%E0%B8%A2--%E0%B8%A8%E0%B8%B1%E0%B8%95%E0%B8%A3%E0%B8%B9%E0%B8%97%E0%B8%B8%E0%B8%81%E0%B8%95%E0%B8%B1%E0%B8%A7-%C3%97-%E0%B8%81%E0%B8%A3%E0%B8%B0%E0%B8%AA%E0%B8%B8%E0%B8%99%E0%B8%97%E0%B8%B8%E0%B8%81%E0%B8%99%E0%B8%B1%E0%B8%94">หลายต่อหลาย — ศัตรูทุกตัว × กระสุนทุกนัด</h1>
<p><img src="img/s12_grid36.png" alt="" style="width:740px;" /></p>
<ul>
<li><strong>ลูปซ้อนลูป:</strong> ลูปนอก = ศัตรู <code>sol4:71</code> · ลูปใน = กระสุน <code>sol4:82</code> → ลูปวน <strong>6 × 6 = 36 คู่ต่อเฟรม</strong> แต่เรียก <code>game.hit</code> จริงเฉพาะนัดที่ใช้อยู่ มากสุด <strong>30 ครั้ง</strong></li>
<li><code>break</code> = นัดนี้จบศัตรูตัวนี้แล้ว (มันวนขึ้นบนไปแล้ว) · <code>continue</code> = ตัวนี้หลุดพื้นแล้ว ข้ามไปตัวถัดไป</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--theme:default;" data-marpit-pagination-total="36">
<h1 id="%E0%B8%84%E0%B8%B0%E0%B9%81%E0%B8%99%E0%B8%99--%E0%B8%8A%E0%B8%B5%E0%B8%A7%E0%B8%B4%E0%B8%95--%E0%B8%9B%E0%B9%89%E0%B8%B2%E0%B8%A2-hud--%E0%B9%80%E0%B8%A5%E0%B8%82%E0%B9%80%E0%B8%9B%E0%B8%A5%E0%B8%B5%E0%B9%88%E0%B8%A2%E0%B8%99%E0%B9%80%E0%B8%A1%E0%B8%B7%E0%B9%88%E0%B8%AD%E0%B9%84%E0%B8%A3-%E0%B8%9B%E0%B9%89%E0%B8%B2%E0%B8%A2%E0%B9%80%E0%B8%9B%E0%B8%A5%E0%B8%B5%E0%B9%88%E0%B8%A2%E0%B8%99%E0%B9%80%E0%B8%A1%E0%B8%B7%E0%B9%88%E0%B8%AD%E0%B8%99%E0%B8%B1%E0%B9%89%E0%B8%99">คะแนน · ชีวิต · ป้าย HUD — เลขเปลี่ยนเมื่อไร ป้ายเปลี่ยนเมื่อนั้น</h1>
<table>
<thead>
<tr>
<th>เหตุการณ์</th>
<th>ตัวเลข</th>
<th>ป้าย HUD</th>
<th>ศัตรู</th>
<th>อื่น ๆ</th>
</tr>
</thead>
<tbody>
<tr>
<td>ยิงโดน</td>
<td><code>score += 1</code> <code>sol4:84</code></td>
<td><code>hud.set(...)</code> <code>sol4:86</code></td>
<td>วนกลับขึ้นบน <code>sol4:88</code></td>
<td>คืนกระสุน <code>sol4:87</code> · เสียง <code>&quot;hit&quot;</code> <code>sol4:85</code></td>
</tr>
<tr>
<td>หลุดพื้น</td>
<td><code>lives -= 1</code> <code>sol4:74</code></td>
<td><code>hud.set(...)</code> <code>sol4:75</code></td>
<td>วนกลับขึ้นบน <code>sol4:76</code></td>
<td>ถ้า <code>lives &lt;= 0</code> → GAME OVER</td>

</table>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">            hud.<span class="hljs-built_in">set</span>(<span class="hljs-string">&quot;Score: %d   Lives: %d&quot;</span> % (score, lives))    <span class="hljs-comment"># sol4:75 (และ sol4:86)</span>
</code></pre>
<p><code>%d</code> = ช่องใส่ตัวเลขจำนวนเต็ม เติมตามลำดับในวงเล็บ: <code>score</code> ลงช่องแรก <code>lives</code> ลงช่องที่สอง</p>
<table>
<thead>
<tr>
<th>เหตุการณ์</th>
<th>score</th>
<th>lives</th>
<th>ป้ายบนจอ</th>
</tr>
</thead>
<tbody>
<tr>
<td>เริ่มเกม</td>
<td>0</td>
<td>3</td>
<td><code>Score: 0   Lives: 3</code></td>
</tr>
<tr>
<td>ยิงโดน</td>
<td>1</td>
<td>3</td>
<td><code>Score: 1   Lives: 3</code></td>
</tr>
<tr>
<td>หลุดพื้น</td>
<td>1</td>
<td>2</td>

<blockquote>
<p><code>on_frame</code> แก้ค่า <code>score</code> กับ <code>lives</code> จึงต้องมี <code>global ship_x, ship_speed, score, lives, fire_cooldown</code> — ให้มาแล้วที่ <code>:52</code> อย่าลบ</p>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--theme:default;" data-marpit-pagination-total="36">
<h1 id="game-over--return-false-%E0%B8%9A%E0%B8%AD%E0%B8%81-gamerun-%E0%B9%83%E0%B8%AB%E0%B9%89%E0%B8%AB%E0%B8%A2%E0%B8%B8%E0%B8%94">GAME OVER — <code>return False</code> บอก <code>game.run()</code> ให้หยุด</h1>
<p><img src="img/s12_states.png" alt="" style="width:700px;" /></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">            <span class="hljs-keyword">if</span> lives &lt;= <span class="hljs-number">0</span>:                   <span class="hljs-comment"># ค ชีวิตหมด = จบเกม</span>
                game.sfx(<span class="hljs-string">&quot;gameover&quot;</span>)
                game.Text(<span class="hljs-string">&quot;GAME OVER&quot;</span>, <span class="hljs-number">320</span>, <span class="hljs-number">180</span>, game.RED)
                <span class="hljs-keyword">return</span> <span class="hljs-literal">False</span>
</code></pre>
<ul>
<li>ภาพซ้าย = FSM ไฟจราจรคาบ 2 (วงกลม = สถานะ ลูกศร = เหตุที่ทำให้เปลี่ยน) · ภาพขวา = เกมเราก็เป็น FSM: กำลังเล่น กับ พัก สลับกันด้วยปุ่ม Start · ชีวิตหมด → GAME OVER</li>
<li>เหมือนตอนจบ Catch (<code>s04_catch.py:59-63</code>) แต่จบเพราะ <strong>ชีวิตหมด</strong> · engine เห็น <code>False</code> แล้วเลิกเรียก <code>on_frame</code> (<code>bentogame.py:996-997</code>) · สร้าง <code>game.Text</code> ตรงนี้ได้เพราะเกิด <strong>ครั้งเดียว</strong> · เสียง: <code>&quot;fire&quot;</code> ยิง · <code>&quot;hit&quot;</code> โดน · <code>&quot;gameover&quot;</code> จบ</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--theme:default;" data-marpit-pagination-total="36">
<h1 id="%E0%B8%A5%E0%B8%87%E0%B8%A1%E0%B8%B7%E0%B8%AD--%E0%B9%80%E0%B8%95%E0%B8%B4%E0%B8%A1-3-%E0%B8%8A%E0%B9%88%E0%B8%AD%E0%B8%87%E0%B9%83%E0%B8%99-practise_codesshooter_step4py">ลงมือ — เติม 3 ช่องใน <a class="pc-gh-link" href="https://github.com/Advance-Innovation-Centre-AIC/embedded-systems-for-developer/blob/main/developer-i/practise_codes/shooter_step4.py" target="_blank" rel="noopener" title="เปิดไฟล์บน GitHub (แท็บใหม่)" style="text-decoration:none"><code>practise_codes/shooter_step4.py</code><sup style="color:#22d3ee;font-weight:800">&#8599;</sup></a></h1>

<tr>

<h1 id="%E0%B8%8A%E0%B9%88%E0%B8%AD%E0%B8%87-34-%E0%B8%95%E0%B8%B2%E0%B8%A1%E0%B8%9C%E0%B8%B1%E0%B8%87--%E0%B8%82%E0%B8%B1%E0%B9%89%E0%B8%99-%E0%B8%81-%E0%B8%96%E0%B8%B6%E0%B8%87-%E0%B8%88">ช่อง (3+4) ตามผัง — ขั้น ก ถึง จ</h1>
<p><img src="img/s12_loop_flow.png" alt="" style="width:860px;" /></p>
<ol>
<li>เขียน <strong>ก + ข</strong> ก่อน แล้วกด <strong>Program to Device</strong> → ต้องเห็นศัตรูตก หลุดพื้น แล้ววนกลับขึ้นบนไม่รู้จบ (Lives ติดลบได้ — ถูกแล้ว ยังไม่มีขั้น ค)</li>
<li>เติม <strong>ค → ง → จ</strong> แล้วรันอีกครั้ง · ติดเกิน 15 นาที ยกมือ หรือเทียบเฉลยในภาคผนวก</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--theme:default;" data-marpit-pagination-total="36">
<h1 id="%E0%B8%A3%E0%B8%B1%E0%B8%99%E0%B9%81%E0%B8%A5%E0%B9%89%E0%B8%A7%E0%B8%95%E0%B9%89%E0%B8%AD%E0%B8%87%E0%B9%80%E0%B8%AB%E0%B9%87%E0%B8%99%E0%B9%81%E0%B8%9A%E0%B8%9A%E0%B8%99%E0%B8%B5%E0%B9%89--%E0%B9%80%E0%B8%8A%E0%B9%87%E0%B8%81%E0%B8%A5%E0%B8%B4%E0%B8%AA%E0%B8%95%E0%B9%8C">รันแล้วต้องเห็นแบบนี้ + เช็กลิสต์</h1>
<div style="display:flex;gap:22px;align-items:flex-start">
<div style="flex:0 0 440px">
<p><img src="img/s12_round.gif" alt="" style="width:440px;" /></p>
<p><span style="font-size:.7em;color:#57606a">คลิปจำลองตรรกะ <code>shooter_step4.py</code> หนึ่งรอบ (ไม่ใช่ภาพจากบอร์ด) · ผู้เล่นอัตโนมัติเลี้ยวยานไปใต้ศัตรูตัวที่ต่ำที่สุด และกด A ค้าง</span></p>
</div>
<div style="flex:1">
<div style="line-height:1.9">
☐ ศัตรู 6 ตัวตกลงมา สูงต่ำ เร็วช้าไม่เท่ากัน<br />
☐ ยิงโดน → Score +1 · เสียง <code>hit</code> · ศัตรูวนกลับขึ้นบน<br />
☐ หลุดพื้น → Lives −1 · ป้ายเปลี่ยน <b>ทั้งสองกรณี</b><br />
☐ Lives 0 → GAME OVER สีแดงกลางจอ เกมหยุด<br />
☐ Start = พักเกม · Back = ออก (engine ทำให้)<br />
☐ โชว์อาจารย์ 1 รอบ คะแนน ≥ 3 จนชีวิตหมด
</div>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--theme:default;" data-marpit-pagination-total="36">
<h1 id="%E0%B8%81%E0%B8%B1%E0%B8%9A%E0%B8%94%E0%B8%B1%E0%B8%81%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B9%80%E0%B8%88%E0%B8%AD%E0%B8%9A%E0%B9%88%E0%B8%AD%E0%B8%A2">กับดักที่เจอบ่อย</h1>
<table>
<thead>
<tr>
<th>อาการ</th>
<th>สาเหตุ</th>
<th>แก้</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>UnboundLocalError</code> ทันทีที่รัน</td>
<td>ลบบรรทัด <code>global</code> ที่ <code>:52</code> ทิ้ง</td>
<td>ใส่คืน: <code>global ship_x, ship_speed, score, lives, fire_cooldown</code></td>
</tr>
<tr>
<td>ยิงโดนแต่เลขบนจอไม่ขึ้น</td>
<td>ลืม <code>hud.set(...)</code> ตอนโดน</td>
<td>ตัวเลขเปลี่ยนที่ไหน <code>hud.set</code> ที่นั่น (มี 2 ที่)</td>
</tr>
<tr>
<td><code>NameError: name 'index' ...</code></td>
<td>เขียน <code>for enemy in enemies:</code> แต่ใช้ <code>index</code></td>
<td><code>for index, enemy in enumerate(enemies):</code></td>
</tr>
<tr>
<td>ยิงโดนแล้วศัตรูไม่หาย ตกต่อจนหลุดพื้น</td>
<td>ลืม <code>respawn_enemy(index)</code> ตอนโดน</td>
<td>โดนแล้วส่งกลับขึ้นบนทันที</td>
</tr>
<tr>
<td>ลืม <code>break</code></td>
<td>แทบไม่เห็นบนจอ (นาน ๆ ครั้งตัวเดียวได้ 2 แต้ม) แต่ผิดหลัก</td>
<td>ใส่ไว้เสมอ = &quot;ตัวนี้จบแล้ว&quot;</td>
</tr>
<tr>
<td>กระสุนเฉียดขอบแต่ไม่นับ</td>
<td><strong>ไม่ใช่บั๊ก</strong> — ขอบชนกันพอดีไม่นับ</td>
<td>ต้องทับกันจริง</td>
</tr>
</tbody>
</table>
<blockquote>
<p>ได้คะแนนตอนศัตรูเพิ่งโผล่ขอบบน (ยังเห็นไม่เต็มตัว) เป็นเรื่องปกติ: นัดที่ยังใช้อยู่แถว y −20 … 0 โดนมันได้ · แถว &quot;ลืม break&quot; จากการจำลองตรรกะบนคอมพิวเตอร์: 2 ใน 300 รอบ</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--theme:default;" data-marpit-pagination-total="36">
<h1 id="%E0%B8%AA%E0%B8%A3%E0%B8%B8%E0%B8%9B--%E0%B9%80%E0%B8%AD%E0%B8%B2%E0%B9%84%E0%B8%9B%E0%B9%83%E0%B8%8A%E0%B9%89%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B8%AD%E0%B8%B7%E0%B9%88%E0%B8%99">สรุป + เอาไปใช้ที่อื่น</h1>
<ol>
<li><strong>ศัตรู step4 วนกลับขึ้นบน</strong> — กล่องเดิม 6 กล่องตลอดเกม ไม่สร้างใหม่ (ชุดหมุนเวียนเต็มรูปอยู่ใน step5)</li>
<li><strong>ชนแบบกล่อง</strong> — โดน = ทับกันจริง (ขอบชนพอดีไม่นับ) → <code>game.hit(a, b)</code> · ลูปซ้อน ศัตรู × กระสุน แล้ว <code>break</code></li>
<li><strong>ตัวเลขเปลี่ยน → <code>hud.set(...)</code> ทุกครั้ง</strong> · ชีวิตหมด → <code>return False</code> หยุด <code>game.run()</code></li>
</ol>
<table>
<thead>
<tr>
<th>ท่าวันนี้</th>
<th>ในเกมของน้องเอง</th>
<th>นอกเกม</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>game.hit(a, b)</code></td>
<td>เก็บเหรียญ <code>if game.hit(player, coin): score += 1</code> · ชนกำแพง</td>
<td>แตะปุ่มบนจอสัมผัส: จุดนิ้วอยู่ในกรอบปุ่มไหม</td>
</tr>
<tr>
<td>วนกลับขึ้นบน + ชีวิต/HUD</td>
<td>อุกกาบาตที่ไหลมาไม่รู้จบ · หลอดเลือด <code>hp -= 10</code></td>
<td>แถบแบตเตอรี่ในแอป · ข่าววิ่งวนบนป้าย</td>
</tr>
</tbody>
</table>
<p><strong>ส่งงาน:</strong> โชว์อาจารย์ 1 รอบ (คะแนน ≥ 3 จนชีวิตหมด) + ส่ง <code>shooter_step4.py</code> + ใบงาน · ทีมที่เสร็จแล้ว → ขั้นต่อ step5</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--theme:default;" data-marpit-pagination-total="36">
<h1 id="%E0%B8%82%E0%B8%B1%E0%B9%89%E0%B8%99%E0%B8%95%E0%B9%88%E0%B8%AD--step5--%E0%B8%A8%E0%B8%B1%E0%B8%95%E0%B8%A3%E0%B8%B9%E0%B9%80%E0%B8%9B%E0%B9%87%E0%B8%99-%E0%B8%8A%E0%B8%B8%E0%B8%94%E0%B8%AB%E0%B8%A1%E0%B8%B8%E0%B8%99%E0%B9%80%E0%B8%A7%E0%B8%B5%E0%B8%A2%E0%B8%99-%E0%B8%95%E0%B8%B1%E0%B8%A7%E0%B8%88%E0%B8%A3%E0%B8%B4%E0%B8%87">ขั้นต่อ · step5 — ศัตรูเป็น &quot;ชุดหมุนเวียน&quot; ตัวจริง</h1>
<div style="border:2px solid #2e7d32;border-radius:8px;padding:4px 12px;background:#e8f5e9;font-size:.82em;margin-bottom:6px">สำหรับทีมที่ผ่านเช็กลิสต์ step4 แล้ว · ไฟล์ <a class="pc-gh-link" href="https://github.com/Advance-Innovation-Centre-AIC/embedded-systems-for-developer/blob/main/developer-i/practise_codes/shooter_step5.py" target="_blank" rel="noopener" title="เปิดไฟล์บน GitHub (แท็บใหม่)" style="text-decoration:none"><code>practise_codes/shooter_step5.py</code><sup style="color:#22d3ee;font-weight:800">&#8599;</sup></a> · 5 ขั้นเดิมของกระสุน ใช้กับศัตรูได้ทุกขั้น</div>
<table>
<thead>
<tr>
<th>ขั้น</th>
<th>กระสุน (คาบ 11)</th>
<th>ศัตรู step5 (<code>solution_codes/shooter_step5.py</code>)</th>
</tr>
</thead>
<tbody>
<tr>
<td>① สร้างชุดครั้งเดียว</td>
<td><code>bullets = [...]</code> 6 นัด</td>
<td><code>enemies = [...]</code> 8 ตัว + <code>enemy_active = [False] * MAX_ENEMIES</code> <code>sol5:65-68</code></td>
</tr>
<tr>
<td>② หาตัวว่าง</td>
<td><code>if bullet.y &lt; -20</code></td>
<td><code>if not enemy_active[index]</code> <code>sol5:80</code></td>
</tr>
<tr>
<td>③ ยืม</td>
<td><code>show()</code> + <code>move_to(หัวยาน)</code></td>
<td><code>enemy_active[index] = True</code> + <code>move_to(x สุ่ม, -20)</code> + <code>show()</code> <code>sol5:81-84</code></td>
</tr>
<tr>
<td>④ อัปเดตทุกเฟรม</td>
<td><code>bullet.y - 9</code></td>
<td>ข้ามตัวว่าง <code>sol5:129-130</code> แล้ว <code>enemy.y + enemy_speed[index]</code> <code>sol5:132</code></td>
</tr>
<tr>
<td>⑤ คืน</td>
<td>พ้นจอบน → <code>hide()</code></td>
<td><code>park_enemy(index)</code>: ธง <code>False</code> + <code>hide()</code> + <code>move_to(0, -50)</code> <code>sol5:88-91</code></td>
</tr>
</tbody>
</table>
<blockquote>
<p>ต่างกันที่ &quot;ป้ายบอกว่าว่าง&quot;: กระสุนดูจาก <strong>ตำแหน่ง</strong> (<code>y &lt; -20</code>) · ศัตรูใช้ <strong>list ธง</strong> <code>enemy_active</code> (True = ใช้อยู่) — อ่านง่ายกว่า ไม่ต้องจำเลข −20 (ตอบคำถามภาคผนวกคาบ 11: ศัตรูใช้ธง)</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--theme:default;" data-marpit-pagination-total="36">
<h1 id="%E0%B8%82%E0%B8%B1%E0%B9%89%E0%B8%99%E0%B8%95%E0%B9%88%E0%B8%AD--spawn_timer--%E0%B8%9B%E0%B8%A5%E0%B9%88%E0%B8%AD%E0%B8%A2%E0%B8%A8%E0%B8%B1%E0%B8%95%E0%B8%A3%E0%B8%B9%E0%B8%97%E0%B8%B5%E0%B8%A5%E0%B8%B0%E0%B8%95%E0%B8%B1%E0%B8%A7%E0%B8%95%E0%B8%B2%E0%B8%A1%E0%B8%88%E0%B8%B1%E0%B8%87%E0%B8%AB%E0%B8%A7%E0%B8%B0">ขั้นต่อ · <code>spawn_timer</code> — ปล่อยศัตรูทีละตัวตามจังหวะ</h1>
<p><img src="img/s12_spawn_timer.png" alt="" style="width:1000px;" /></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">    <span class="hljs-keyword">if</span> spawn_timer &gt; <span class="hljs-number">0</span>:
        spawn_timer -= <span class="hljs-number">1</span>
    <span class="hljs-keyword">else</span>:
        spawn_enemy()
        spawn_timer = SPAWN_DELAY
</code></pre>
<p>หลักเดียวกับคูลดาวน์กระสุนคาบ 11 (<code>sol5:102-106</code> · ในไฟล์ practise ให้มาแล้วที่ <code>:112-116</code>): นับถอยหลังทีละเฟรม ถึง 0 แล้วทำ 1 ครั้ง แล้วตั้งใหม่ · <strong>ทาย:</strong> ถ้าไม่ยิงเลย (และไม่ชนยาน) ชุด 8 ตัวจะหมดไหม?</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--theme:default;" data-marpit-pagination-total="36">
<h1 id="%E0%B8%82%E0%B8%B1%E0%B9%89%E0%B8%99%E0%B8%95%E0%B9%88%E0%B8%AD--%E0%B8%95%E0%B8%B2%E0%B8%A3%E0%B8%B2%E0%B8%87-modes--%E0%B8%84%E0%B8%A7%E0%B8%B2%E0%B8%A1%E0%B8%A2%E0%B8%B2%E0%B8%81%E0%B8%97%E0%B8%B1%E0%B9%89%E0%B8%87%E0%B8%AB%E0%B8%A1%E0%B8%94%E0%B8%AD%E0%B8%A2%E0%B8%B9%E0%B9%88%E0%B9%83%E0%B8%99%E0%B8%95%E0%B8%B2%E0%B8%A3%E0%B8%B2%E0%B8%87%E0%B9%80%E0%B8%94%E0%B8%B5%E0%B8%A2%E0%B8%A7">ขั้นต่อ · ตาราง <code>MODES</code> — ความยากทั้งหมดอยู่ในตารางเดียว</h1>
<table>
<thead>
<tr>
<th>โหมด</th>
<th>ปล่อยทุก (เฟรม)</th>
<th>ตัวคูณความเร็ว</th>
<th>ชีวิต</th>
<th>หลุดพื้นเสีย?</th>
<th>ชนยานเสีย?</th>
</tr>
</thead>
<tbody>
<tr>
<td>FREE SHOOTER</td>
<td>16 + 1 = 17</td>
<td>0.85</td>
<td>99</td>
<td>ไม่</td>
<td>ไม่</td>
</tr>
<tr>
<td>EASY</td>
<td>26 + 1 = 27</td>
<td>0.70</td>
<td>5</td>
<td>ไม่</td>
<td>เสีย</td>
</tr>
<tr>
<td>DIFFICULT</td>
<td>12 + 1 = 13</td>
<td>1.00</td>
<td>3</td>
<td>เสีย</td>
<td>เสีย</td>
</tr>
</tbody>
</table>
<ul>
<li>เลือกโหมดด้วย <code>MODE = 2</code> (<code>sol5:49</code> · ในไฟล์ practise <code>:57</code> เริ่มที่ 0) แล้วบรรทัดเดียวแกะทั้งแถวเป็นตัวแปร 6 ตัว (<code>sol5:50</code>)</li>
<li>ความเร็วตก = สุ่ม 1.8 … 3.4 × ตัวคูณโหมด: <code>random.uniform(1.8, 3.4) * SPEED_MUL</code> (<code>sol5:85</code>) — สุ่มได้ 3.0 → DIFFICULT 3.0 × 1.00 = <strong>3.0</strong> · EASY 3.0 × 0.70 = <strong>2.1</strong> px/เฟรม</li>
<li>อยากได้โหมดใหม่ → <strong>เพิ่มแถว</strong> ไม่ต้องแตะ <code>on_frame</code> (ข้อมูลขับพฤติกรรม เหมือนตาราง <code>LED_PATTERN</code> คาบ 2)</li>
</ul>
<hr />
<p><strong>เฉลยที่ทาย:</strong> DIFFICULT ศัตรู 1 ตัวอยู่บนจอ 123–233 เฟรม (418 ÷ 3.4 ถึง 418 ÷ 1.8) แต่ปล่อยใหม่ทุก 13 เฟรม → ต้องใช้ราว 10–18 ตัว มีแค่ 8 → ชุดเต็ม <code>spawn_enemy()</code> หาตัวว่างไม่เจอก็ไม่ปล่อย เหมือนกระสุนหมดชุดตอนคูลดาวน์ 4</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--theme:default;" data-marpit-pagination-total="36">
<h1 id="%E0%B8%82%E0%B8%B1%E0%B9%89%E0%B8%99%E0%B8%95%E0%B9%88%E0%B8%AD--%E0%B8%87%E0%B8%B2%E0%B8%99%E0%B9%83%E0%B8%99-practise_codesshooter_step5py">ขั้นต่อ · งานใน <a class="pc-gh-link" href="https://github.com/Advance-Innovation-Centre-AIC/embedded-systems-for-developer/blob/main/developer-i/practise_codes/shooter_step5.py" target="_blank" rel="noopener" title="เปิดไฟล์บน GitHub (แท็บใหม่)" style="text-decoration:none"><code>practise_codes/shooter_step5.py</code><sup style="color:#22d3ee;font-weight:800">&#8599;</sup></a></h1>
<table>
<thead>
<tr>
<th>ช่อง</th>
<th>บรรทัด</th>
<th>งาน</th>
</tr>
</thead>
<tbody>
<tr>
<td>(1) ตารางโหมด</td>
<td><code>:54-56</code></td>
<td>เพิ่มแถว EASY และ DIFFICULT (ตัวเลขเลือกเองให้ &quot;ยากขึ้นเป็นชั้น&quot;)</td>
</tr>
<tr>
<td>(2) <code>spawn_enemy()</code></td>
<td><code>:85-96</code></td>
<td>② หาตัวว่าง (<code>enemy_active[index]</code> เป็น <code>False</code>) → ③ ยืม: ตั้ง <code>True</code> · สีสุ่ม · <code>move_to</code> เหนือจอ · <code>show()</code> · ความเร็ว × <code>SPEED_MUL</code> · <code>return</code></td>
</tr>
<tr>
<td>(3) ยานชนศัตรู</td>
<td><code>:169-178</code></td>
<td><code>boxes_overlap(...)</code> ยาน × ศัตรู → ⑤ คืน <code>park_enemy(index)</code> → ถ้า <code>LOSE_WHEN_HIT</code> เสีย 1 ชีวิต + <code>hud.set</code> → หมด = GAME OVER</td>
</tr>
</tbody>
</table>
<ul>
<li>ทดสอบ: เปลี่ยน <code>MODE</code> เป็น 0 / 1 / 2 แล้วเล่นโหมดละ 1 รอบ — จดความต่างลงใบงาน</li>
<li>step5 ชนด้วย <code>boxes_overlap()</code> กล่องชน &quot;หด&quot; (กระสุน 4×10 · ศัตรู 26×16) ต้องยิงเข้าเนื้อจริงถึงนับ — เฉลยอยู่ภาคผนวก</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-class="lead" data-theme="default" lang="en-US" class="lead" data-marpit-pagination="23" style="--paginate:true;--class:lead;--theme:default;" data-marpit-pagination-total="36">
<h1 id="%E0%B8%A0%E0%B8%B2%E0%B8%84%E0%B8%9C%E0%B8%99%E0%B8%A7%E0%B8%81">ภาคผนวก</h1>
<p>เฉลย step4 / step5 · ลึกอีกนิด (สามวิธีเขียนการชน · ทำไมกระสุนไม่ทะลุ · งบ widget) · เปิดฝาเกมเต็ม · เกร็ด · เสียง · ใช้จริงที่ไหน · คิดต่อเอง</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="24" style="--paginate:true;--theme:default;" data-marpit-pagination-total="36">
<h1 id="%E0%B9%80%E0%B8%89%E0%B8%A5%E0%B8%A2-step4--%E0%B8%8A%E0%B9%88%E0%B8%AD%E0%B8%87-1--2">เฉลย step4 · ช่อง (1) + (2)</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">enemies = [game.Box(random.randint(<span class="hljs-number">0</span>, game.WIDTH - <span class="hljs-number">30</span>), -random.randint(<span class="hljs-number">40</span>, <span class="hljs-number">400</span>),
                    <span class="hljs-number">30</span>, <span class="hljs-number">24</span>, random.choice(ENEMY_COLORS)) <span class="hljs-keyword">for</span> _ <span class="hljs-keyword">in</span> <span class="hljs-built_in">range</span>(MAX_ENEMIES)]
enemy_speed = [random.uniform(<span class="hljs-number">2.5</span>, <span class="hljs-number">4.5</span>) <span class="hljs-keyword">for</span> _ <span class="hljs-keyword">in</span> <span class="hljs-built_in">range</span>(MAX_ENEMIES)]

<span class="hljs-keyword">def</span> <span class="hljs-title function_">respawn_enemy</span>(<span class="hljs-params">index</span>):
    enemies[index].move_to(random.randint(<span class="hljs-number">0</span>, game.WIDTH - <span class="hljs-number">30</span>), -random.randint(<span class="hljs-number">20</span>, <span class="hljs-number">200</span>))
    enemies[index].set_color(random.choice(ENEMY_COLORS))
</code></pre>
<p><code>solution_codes/shooter_step4.py:30-32</code> และ <code>:41-43</code></p>
<ul>
<li>list comprehension สร้าง 6 กล่องในบรรทัดเดียว — ทำ <strong>ครั้งเดียว</strong> นอก <code>on_frame</code></li>
<li><code>enemies[i]</code> กับ <code>enemy_speed[i]</code> คือ list คู่ขนาน: ตำแหน่ง i ของทั้งสอง list คือศัตรูตัวเดียวกัน</li>
<li>วนกลับขึ้นบนใช้ y −200 … −20 (ใกล้จอกว่าตอนเริ่ม −400 … −40) ศัตรูที่วนกลับมาจึงโผล่ไวกว่ารอบแรก</li>
<li>ความเร็วไม่ได้สุ่มใหม่ตอนวนกลับ — แต่ละตัวเร็วเท่าเดิมทั้งเกม (<code>respawn_enemy</code> ไม่แตะ <code>enemy_speed</code>)</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="25" style="--paginate:true;--theme:default;" data-marpit-pagination-total="36">
<h1 id="%E0%B9%80%E0%B8%89%E0%B8%A5%E0%B8%A2-step4--%E0%B8%8A%E0%B9%88%E0%B8%AD%E0%B8%87-34-%E0%B8%84%E0%B8%A3%E0%B8%B6%E0%B9%88%E0%B8%87%E0%B9%81%E0%B8%A3%E0%B8%81--%E0%B8%81-%E0%B8%82-%E0%B8%84">เฉลย step4 · ช่อง (3+4) ครึ่งแรก — ก ข ค</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">    <span class="hljs-keyword">for</span> index, enemy <span class="hljs-keyword">in</span> <span class="hljs-built_in">enumerate</span>(enemies):
        enemy.move_to(enemy.x, enemy.y + enemy_speed[index])   <span class="hljs-comment"># ก ตกลงหนึ่งก้าว</span>
        <span class="hljs-keyword">if</span> enemy.y &gt; game.HEIGHT:              <span class="hljs-comment"># ข หลุดพื้น = เสีย 1 ชีวิต</span>
            lives -= <span class="hljs-number">1</span>
            hud.<span class="hljs-built_in">set</span>(<span class="hljs-string">&quot;Score: %d   Lives: %d&quot;</span> % (score, lives))
            respawn_enemy(index)
            <span class="hljs-keyword">if</span> lives &lt;= <span class="hljs-number">0</span>:                   <span class="hljs-comment"># ค ชีวิตหมด = จบเกม</span>
                game.sfx(<span class="hljs-string">&quot;gameover&quot;</span>)
                game.Text(<span class="hljs-string">&quot;GAME OVER&quot;</span>, <span class="hljs-number">320</span>, <span class="hljs-number">180</span>, game.RED)
                <span class="hljs-keyword">return</span> <span class="hljs-literal">False</span>
            <span class="hljs-keyword">continue</span>
</code></pre>
<p><code>solution_codes/shooter_step4.py:71-81</code></p>
<ul>
<li>ลำดับในสาขา ข: ลดชีวิต → อัปเดตป้าย → วนขึ้นบน → ค่อยเช็คว่าหมดหรือยัง ป้ายจึงโชว์ <code>Lives: 0</code> ก่อนจบ</li>
<li><code>continue</code> = ศัตรูตัวนี้จบเฟรมนี้แล้ว ข้ามไปตัวถัดไป ไม่ต้องเอาไปเช็คกับกระสุน</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="26" style="--paginate:true;--theme:default;" data-marpit-pagination-total="36">
<h1 id="%E0%B9%80%E0%B8%89%E0%B8%A5%E0%B8%A2-step4--%E0%B8%8A%E0%B9%88%E0%B8%AD%E0%B8%87-34-%E0%B8%84%E0%B8%A3%E0%B8%B6%E0%B9%88%E0%B8%87%E0%B8%AB%E0%B8%A5%E0%B8%B1%E0%B8%87--%E0%B8%87-%E0%B8%88">เฉลย step4 · ช่อง (3+4) ครึ่งหลัง — ง จ</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">        <span class="hljs-keyword">for</span> bullet <span class="hljs-keyword">in</span> bullets:                 <span class="hljs-comment"># ง วนกระสุนทุกนัด</span>
            <span class="hljs-keyword">if</span> bullet.y &gt;= -<span class="hljs-number">20</span> <span class="hljs-keyword">and</span> game.hit(bullet, enemy):   <span class="hljs-comment"># จ ใช้อยู่ และโดน?</span>
                score += <span class="hljs-number">1</span>
                game.sfx(<span class="hljs-string">&quot;hit&quot;</span>)
                hud.<span class="hljs-built_in">set</span>(<span class="hljs-string">&quot;Score: %d   Lives: %d&quot;</span> % (score, lives))
                bullet.move_to(<span class="hljs-number">0</span>, -<span class="hljs-number">50</span>); bullet.hide()    <span class="hljs-comment"># คืนกระสุน (จอดเหนือจอ = ว่าง)</span>

<h1 id="%E0%B8%A5%E0%B8%B6%E0%B8%81%E0%B8%AD%E0%B8%B5%E0%B8%81%E0%B8%99%E0%B8%B4%E0%B8%94--%E0%B8%AA%E0%B8%B2%E0%B8%A1%E0%B8%A7%E0%B8%B4%E0%B8%98%E0%B8%B5%E0%B9%80%E0%B8%82%E0%B8%B5%E0%B8%A2%E0%B8%99%E0%B8%81%E0%B8%B2%E0%B8%A3%E0%B8%8A%E0%B8%99%E0%B9%81%E0%B8%9A%E0%B8%9A%E0%B8%81%E0%B8%A5%E0%B9%88%E0%B8%AD%E0%B8%87-de-morgan">ลึกอีกนิด · สามวิธีเขียนการชนแบบกล่อง (De Morgan)</h1>
<table>
<thead>
<tr>
<th>ฟังก์ชัน</th>
<th>อยู่ที่</th>
<th>แตะขอบพอดี</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>game.hit(a, b)</code></td>
<td><code>bentogame.py:466-469</code></td>
<td><strong>ไม่นับ</strong> — ต้องทับกันจริง (<code>&lt;</code> และ <code>&gt;</code>)</td>
</tr>
<tr>
<td><code>boxes_overlap(...)</code></td>
<td><code>solution_codes/shooter_step5.py:36-40</code></td>
<td><strong>ไม่นับ</strong> · ใช้กล่องชนหด 4×10 และ 26×16</td>
</tr>
<tr>
<td><code>overlap(...)</code></td>
<td><code>full_games/shooter_full.py:48-50</code></td>
<td><strong>นับว่าโดน</strong> — ต่างจาก <code>game.hit</code> ตรงนี้</td>
</tr>
</tbody>
</table>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">overlap</span>(<span class="hljs-params">ax, ay, aw, ah, ox, oy, ow, oh</span>):
    <span class="hljs-keyword">return</span> <span class="hljs-keyword">not</span> (ax + aw &lt; ox <span class="hljs-keyword">or</span> ax &gt; ox + ow <span class="hljs-keyword">or</span> ay + ah &lt; oy <span class="hljs-keyword">or</span> ay &gt; oy + oh)
</code></pre>
<ul>
<li>อ่านแบบ De Morgan: หา &quot;มีช่องว่างจริง (มากกว่า 0 px) อย่างน้อย 1 ด้าน&quot; (4 ข้อต่อด้วย <code>or</code>) แล้ว <code>not</code> กลับ — ช่องว่าง 0 px จึงนับว่าโดน</li>
<li>ตัวอย่างแตะขอบ: กระสุน x = 330 ศัตรูขวาสุด 300 + 30 = 330 → <code>game.hit</code>: <code>330 &lt; 330</code> เท็จ → <strong>ไม่โดน</strong> · <code>overlap</code>: <code>330 &gt; 330</code> ก็เท็จ ไม่มีด้านไหนเป็นช่องว่าง → <code>not False</code> → <strong>โดน</strong></li>
<li>ต่างกันแค่เส้นขอบ 1 เส้น ในเกมแทบมองไม่ออก — แต่งานที่ต้องแม่น (เช่น ขอบปุ่มบนจอ) ต้องรู้ว่าฟังก์ชันไหนนับแบบไหน</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="30" style="--paginate:true;--theme:default;" data-marpit-pagination-total="36">
<h1 id="%E0%B8%A5%E0%B8%B6%E0%B8%81%E0%B8%AD%E0%B8%B5%E0%B8%81%E0%B8%99%E0%B8%B4%E0%B8%94--%E0%B8%97%E0%B8%B3%E0%B9%84%E0%B8%A1%E0%B8%81%E0%B8%A3%E0%B8%B0%E0%B8%AA%E0%B8%B8%E0%B8%99%E0%B9%84%E0%B8%A1%E0%B9%88-%E0%B8%97%E0%B8%B0%E0%B8%A5%E0%B8%B8-%E0%B8%A8%E0%B8%B1%E0%B8%95%E0%B8%A3%E0%B8%B9">ลึกอีกนิด · ทำไมกระสุนไม่ &quot;ทะลุ&quot; ศัตรู</h1>
<ul>
<li>ต่อเฟรม กระสุนกับศัตรูเข้าหากันได้มากสุด 9 + 4.5 = <strong>13.5 px</strong> (ศัตรูเร็วสุด 4.5)</li>
<li>ช่วงที่แกน y ทับกันยาว = สูงศัตรู + สูงกระสุน = 24 + 14 = <strong>38 px</strong></li>
<li>ก้าวละ 13.5 กระโดดข้ามช่วง 38 ไม่พ้น → ต้องมีอย่างน้อย 1 เฟรมที่ทับกัน <code>game.hit</code> เห็นแน่ (ถ้าแกน x ตรงกัน)</li>
<li>ถ้าวันหนึ่งทำกระสุนเร็ว 40 px/เฟรม จะเริ่มทะลุได้ — เกมจริงแก้ด้วยการเช็คทีละก้าวย่อย หรือยืดกล่องชนตามทางที่วิ่ง</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="31" style="--paginate:true;--theme:default;" data-marpit-pagination-total="36">
<h1 id="%E0%B8%A5%E0%B8%B6%E0%B8%81%E0%B8%AD%E0%B8%B5%E0%B8%81%E0%B8%99%E0%B8%B4%E0%B8%94--%E0%B8%97%E0%B8%B3%E0%B9%84%E0%B8%A1%E0%B8%95%E0%B9%89%E0%B8%AD%E0%B8%87%E0%B8%A7%E0%B8%99%E0%B9%83%E0%B8%8A%E0%B9%89%E0%B8%81%E0%B8%A5%E0%B9%88%E0%B8%AD%E0%B8%87%E0%B9%80%E0%B8%94%E0%B8%B4%E0%B8%A1--%E0%B8%87%E0%B8%9A-widget">ลึกอีกนิด · ทำไมต้องวนใช้กล่องเดิม — งบ widget</h1>
<ul>
<li>นับของบนจอ step4: กระสุน 6 + ศัตรู 6 + ยาน 1 + ป้าย HUD 1 + ป้ายปุ่มของ <code>game.run()</code> 1 (<code>bentogame.py:957</code>) = <strong>15 ชิ้น</strong> + ป้าย GAME OVER ตอนจบ = <strong>16</strong></li>
<li>engine บอกงบไว้ 32 ชิ้นรวมทุกอย่าง (<code>bentogame.py:827</code>) → เหลือที่ว่าง 32 − 16 = <strong>16 ชิ้น</strong></li>
<li>ถ้า <code>game.Box(...)</code> ใหม่ทุกครั้งที่ศัตรูเกิดใหม่: 1 รอบเกิดใหม่ = แต้มที่ได้ + ชีวิตที่เสีย (3) · ผู้เล่นที่ได้ <strong>14 แต้ม</strong> ต้องสร้างกล่องใหม่ 14 + 3 = 17 ใบ → <strong>เกินงบแล้ว</strong> · ยิ่งเล่นเก่ง ยิ่งพังเร็ว (ผู้เล่นที่ไม่ยิงเลยจบเกมหลังเกิดใหม่แค่ 3 ครั้ง จึงไม่เห็นปัญหา)</li>
<li>บนไมโครคอนโทรลเลอร์ยังมีเหตุผลอีก: สร้าง/ทิ้งของบ่อยทำให้ตัวเก็บขยะ (GC) หยุดเกมไปเก็บกวาด และหน่วยความจำแตกเป็นชิ้น ๆ — คู่มือ MicroPython แนะนำให้สร้างของที่ใช้นานไว้ตั้งแต่ต้น · มาตรฐานงานวิกฤต (JPL Power of Ten ข้อ 3, MISRA C 21.3) ห้ามจองหน่วยความจำใหม่หลังระบบเริ่มทำงาน</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="32" style="--paginate:true;--theme:default;" data-marpit-pagination-total="36">

<h1 id="%E0%B9%80%E0%B8%81%E0%B8%A3%E0%B9%87%E0%B8%94--space-invaders-1978">เกร็ด · Space Invaders (1978)</h1>

<ul>
<li>เกมยิงต้นแบบของวงการ — ศัตรูเรียงเป็นแถวไล่ลงมา ต่างจากของเราที่สุ่มตำแหน่ง</li>
<li>ยิ่งยิงศัตรูหายไปมาก ตัวที่เหลือยิ่งเคลื่อนเร็วขึ้น เล่ากันว่าเพราะเครื่องวาดตัวที่เหลือน้อยลงจึงวาดเสร็จไวขึ้น แล้วผู้สร้างก็เก็บไว้เป็นความยากที่เพิ่มเอง</li>
<li>ลองคิด: ถ้าอยากให้ศัตรูของเราเรียงเป็นแถวแบบนี้ จะวางตำแหน่งเริ่มของ 6 กล่องเดิมยังไง (ดูสไลด์ &quot;คิดต่อเอง&quot;)</li>
</ul>
<p><sub>ที่มา: &quot;Space Invaders&quot; — Tomomarusan, CC BY 2.5, Wikimedia Commons</sub></p>
</section>

<h1 id="%E0%B9%80%E0%B8%AA%E0%B8%B5%E0%B8%A2%E0%B8%87%E0%B8%82%E0%B8%AD%E0%B8%87%E0%B9%80%E0%B8%81%E0%B8%A1-shooter-%E0%B8%81%E0%B8%94%E0%B8%9F%E0%B8%B1%E0%B8%87%E0%B9%84%E0%B8%94%E0%B9%89">เสียงของเกม Shooter (กดฟังได้)</h1>
<div style="display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap;font-size:0.8em;margin:8px 0">
<span style="text-align:center"><b><code>"fire"</code></b> ยิง (คาบ 11)<br /><img src="img/sfx_shoot_fire.png" width="200" style="border-radius:4px;margin:2px 0" /><br /><audio controls src="img/sfx_shoot_fire.mp3" style="height:30px;width:200px"></audio></span>
<span style="text-align:center"><b><code>"hit"</code></b> ยิงโดน<br /><img src="img/sfx_shoot_hit.png" width="200" style="border-radius:4px;margin:2px 0" /><br /><audio controls src="img/sfx_shoot_hit.mp3" style="height:30px;width:200px"></audio></span>
<span style="text-align:center"><b><code>"gameover"</code></b> จบเกม<br /><img src="img/sfx_game_over.png" width="200" style="border-radius:4px;margin:2px 0" /><br /><audio controls src="img/sfx_game_over.mp3" style="height:30px;width:200px"></audio></span>
</div>
<ul>
<li>เสียงสั้น-คม (<code>fire</code>, <code>hit</code>) บอกผลทันทีทุกครั้งที่ยิง · <code>gameover</code> ยาวกว่าเพื่อปิดรอบ</li>
<li>ฟังครบทุกเสียงพร้อมรูปคลื่น → <a href="img/sound_video_demo.html"><b>Sound Explorer</b></a></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="35" style="--paginate:true;--theme:default;" data-marpit-pagination-total="36">
<h1 id="%E0%B9%83%E0%B8%8A%E0%B9%89%E0%B8%88%E0%B8%A3%E0%B8%B4%E0%B8%87%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B9%84%E0%B8%AB%E0%B8%99">ใช้จริงที่ไหน</h1>
<table>
<thead>
<tr>
<th>ท่าในเกม</th>
<th>ระบบจริง</th>
</tr>
</thead>
<tbody>
<tr>
<td>ชุดหมุนเวียน (จองครั้งเดียว ยืม-คืน)</td>
<td>บัฟเฟอร์รับแพ็กเก็ตเครือข่าย · วงแหวน DMA บนไมโครคอนโทรลเลอร์ — จองไว้ตั้งแต่เริ่ม ไม่จองใหม่ระหว่างทำงาน</td>
</tr>
<tr>
<td>ชนแบบกล่อง</td>
<td>ทัชสกรีนหาว่าแตะโดนปุ่มไหน · กรอบวัตถุในระบบตรวจจับภาพ · เอนจินฟิสิกส์ใช้กล่องคัดคู่ที่อาจชนก่อนคำนวณละเอียด</td>
</tr>
<tr>
<td>ลูปทุกคู่</td>
<td>สัมผัสหลายนิ้ว × หลายปุ่ม · เตือนชนรถ/โดรน × สิ่งกีดขวางหลายชิ้น</td>
</tr>
<tr>
<td>สถานะ + หยุดลูป</td>
<td>เครื่องซักผ้า · ตู้ ATM — FSM แบบไฟจราจรคาบ 2</td>
</tr>
<tr>
<td>นับถอยหลังแล้วทำ (<code>spawn_timer</code>)</td>
<td>งานตามคาบในระบบปฏิบัติการเวลาจริง: อ่านเซนเซอร์ทุก N tick · ส่งสัญญาณ &quot;ยังอยู่&quot; (heartbeat)</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="36" style="--paginate:true;--theme:default;" data-marpit-pagination-total="36">
<h1 id="%E0%B8%95%E0%B9%88%E0%B8%AD%E0%B8%A2%E0%B8%AD%E0%B8%94--%E0%B8%84%E0%B8%B4%E0%B8%94%E0%B8%95%E0%B9%88%E0%B8%AD%E0%B9%80%E0%B8%AD%E0%B8%87">ต่อยอด — คิดต่อเอง</h1>
<ul>
<li><strong>ฟอร์เมชันแบบ Space Invaders</strong> — ให้ศัตรูเรียงเป็นแถวไล่ลงมาแทนสุ่มตำแหน่ง ยังใช้ 6 กล่องเดิม ไม่สร้างกล่องใหม่</li>
<li><strong>เมื่อคู่ที่ต้องเช็คเยอะเกิน</strong> — ศัตรู 50 × กระสุน 30 = 1500 คู่/เฟรม จะลดจำนวนคู่ยังไง? (ใบ้: เช็คเฉพาะตัวที่อยู่ใกล้กันในแกน y ก่อน)</li>
<li><strong>ปรับความยากกลางเกม</strong> — ผูก <code>SPAWN_DELAY</code> / <code>SPEED_MUL</code> กับปุ่มให้เปลี่ยนได้ทันทีระหว่างเล่น (ใน step5 เป็นค่าคงที่ ต้องเปลี่ยนเป็นตัวแปรที่ประกาศ <code>global</code>)</li>
<li><strong>ยิ่งเก่งยิ่งยาก</strong> — ออกแบบสูตรเองให้ศัตรูที่วนกลับขึ้นบนเร็วขึ้นตาม <code>score</code> (อย่าลืมเพดาน กันเร็วเกินกว่าคนเล่นไหว)</li>
<li><strong>(สะพานสู่คาบ 13) ส่งคะแนนออกจากบอร์ด</strong> — <code>score</code> ของเราจะขึ้นกระดานคะแนนรวมที่ทั้งห้องเห็นพร้อมกันได้ยังไง? คาบหน้าต่อ WiFi + MQTT</li>
</ul>
<blockquote>
<p>เลือกสักข้อ เขียนลงใบงานว่า &quot;ถ้าเป็นเรา จะออกแบบยังไง&quot; ก่อนแก้โค้ด — ไม่ต้องมีคำตอบถูกข้อเดียว</p>
</blockquote>
</section>
