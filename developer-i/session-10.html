<h1 id="%E0%B8%84%E0%B8%B2%E0%B8%9A-10--shooter-1">คาบ 10 — Shooter #1</h1>
<h2 id="%E0%B8%A2%E0%B8%B2%E0%B8%99%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B8%82%E0%B8%B1%E0%B8%9A%E0%B9%81%E0%B8%A5%E0%B9%89%E0%B8%A7-%E0%B8%A1%E0%B8%B5%E0%B8%99%E0%B9%89%E0%B8%B3%E0%B8%AB%E0%B8%99%E0%B8%B1%E0%B8%81--%E0%B8%9B%E0%B9%89%E0%B8%B2%E0%B8%A2-hud">ยานที่ขับแล้ว &quot;มีน้ำหนัก&quot; + ป้าย HUD</h2>
<p><strong>เกมที่ 3 ของเรา ต่อจาก Catch (คาบ 4) และ Pong (คาบ 5–7)</strong></p>
<blockquote>
<p>วันนี้: วางยานลงจอ แล้วทำให้มัน <strong>เร่ง · ไถล · ชนขอบหยุด</strong></p>
</blockquote>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-class="cover" data-theme="default" lang="en-US" class="cover" data-marpit-pagination="1" style="" data-marpit-pagination-total="27" data-marpit-advanced-background="pseudo"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="2" style="--paginate:true;--theme:default;" data-marpit-pagination-total="27">
<h1 id="%E0%B9%80%E0%B8%9B%E0%B9%89%E0%B8%B2%E0%B8%AB%E0%B8%A1%E0%B8%B2%E0%B8%A2%E0%B8%82%E0%B8%AD%E0%B8%87%E0%B8%84%E0%B8%B2%E0%B8%9A">เป้าหมายของคาบ</h1>
<div style="display:flex;gap:16px">
<div style="flex:1;border:2px solid #2e7d32;border-radius:10px;padding:8px 12px;background:#e8f5e9">
<b>step 1 — วางยาน + ป้าย</b><br />เห็น <b>ยานเขียว</b> กลาง-ล่างของจอ + ป้าย <code>Score: 0   Lives: 3</code> มุมซ้ายบน (ป้ายนี้เรียกว่า <b>HUD</b>)
</div>
<div style="flex:1;border:2px solid #1565c0;border-radius:10px;padding:8px 12px;background:#e3f2fd">
<b>step 2 — ขับได้ มีน้ำหนัก</b><br />กดจอยซ้าย/ขวา ยาน <b>ค่อย ๆ เร่ง</b> · ปล่อยแล้ว <b>ไถลต่อ</b> · <b>ชนขอบจอแล้วหยุด</b> ไม่หลุดออก
</div>
</div>
<img class="flat" src="img/s10_goal.png" style="width:1000px;margin-top:10px" />
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="3" style="--paginate:true;--theme:default;" data-marpit-pagination-total="27">
<h1 id="step-1--%E0%B8%A7%E0%B8%B2%E0%B8%87%E0%B8%A2%E0%B8%B2%E0%B8%99%E0%B8%A5%E0%B8%87%E0%B8%AA%E0%B8%99%E0%B8%B2%E0%B8%A1--hud">step 1 — วางยานลงสนาม + HUD</h1>
<div style="background:#fff8e1;border-left:5px solid #f9a825;border-radius:4px;padding:5px 12px;margin:0 0 8px"><b>HUD คืออะไร?</b> ย่อมาจาก <b>Heads-Up Display</b> = ป้ายสถานะที่ลอยทับจอเกมตลอดเวลา เช่น คะแนน ชีวิต เวลา ไม่ใช่ตัวละคร แค่บอกสถานะให้ผู้เล่นรู้ · คำนี้มาจากห้องนักบิน ที่ฉายข้อมูลขึ้นกระจกตรงหน้า นักบินจึงไม่ต้องก้มดูหน้าปัด · ป้าย <code>Score</code> ในเกม Catch ก็คือ HUD</div>
<div style="display:flex;gap:16px;align-items:flex-start">
<div style="flex:0 0 40%">
<p>เปิด <a class="pc-gh-link" href="https://github.com/Advance-Innovation-Centre-AIC/embedded-systems-for-developer/blob/main/developer-i/practise_codes/shooter_step1.py" target="_blank" rel="noopener" title="เปิดไฟล์บน GitHub (แท็บใหม่)" style="text-decoration:none"><code>practise_codes/shooter_step1.py</code><sup style="color:#22d3ee;font-weight:800">&#8599;</sup></a> แล้วเติม <strong>2 บรรทัด</strong> ตามพิกัดในภาพ</p>
<p>① <strong>ยาน</strong> ใช้ <code>game.Box(...)</code> ใส่ x, y, กว้าง, สูง, <code>game.GREEN</code> แล้วเก็บใน <code>ship</code></p>
<p>② <strong>ป้าย HUD</strong> ใช้ <code>game.Text(...)</code> ใส่ข้อความ, x, y, <code>game.WHITE</code> แล้วเก็บใน <code>hud</code></p>
<p>รันแล้วเป็น <strong>ภาพนิ่ง = ถูกต้อง</strong> เพราะ <code>on_frame()</code> ยังว่าง</p>
</div>
<div style="flex:1">
<img class="flat" src="img/s10_step1_blueprint.png" style="width:100%" />
</div>
</div>
</section>

<h1 id="%E0%B9%80%E0%B8%AB%E0%B8%A1%E0%B8%B7%E0%B8%AD%E0%B8%99%E0%B9%80%E0%B8%82%E0%B9%87%E0%B8%99%E0%B8%A3%E0%B8%96%E0%B9%80%E0%B8%82%E0%B9%87%E0%B8%99%E0%B9%83%E0%B8%99%E0%B8%AB%E0%B9%89%E0%B8%B2%E0%B8%87">เหมือนเข็นรถเข็นในห้าง</h1>
<img class="flat" src="img/s10_cart.png" style="width:900px" />
<table>
<thead>
<tr>
<th>รถเข็น</th>

<tbody>
<tr>
<td>ผลักต่อเนื่อง รถเร็วขึ้นทีละนิด</td>
<td>กดจอยค้าง ยานเร่ง</td>
<td><code>ship_speed += ACCEL</code></td>
</tr>
<tr>
<td>ปล่อยมือ รถไถลต่อแล้วช้าลงเอง</td>
<td>ปล่อยจอย ยานไถล</td>
<td><code>ship_speed *= FRICTION</code></td>
</tr>
<tr>
<td>คนเข็นวิ่งได้เร็วสุดแค่ระดับหนึ่ง · เจอผนังก็หยุด</td>
<td>เพดานความเร็ว 13 · ขอบจอ</td>
<td>บีบค่าด้วย <code>max()</code> <code>min()</code></td>
</tr>
</tbody>
</table>
<p><strong>จุดที่ไม่เหมือน:</strong> ① รถจริงหยุดสนิทได้ แต่เกมคูณ 0.80 ไปเรื่อย ๆ ความเร็วเล็กลงแต่ไม่เป็นศูนย์พอดี ② รถชนผนังความเร็วเป็นศูนย์ทันที แต่ใน step 2 ยานชนขอบแล้ว <code>ship_speed</code> ยังค้างที่ 13</p>
<div style="background:#fff3e0;border:2px solid #ef6c00;border-radius:10px;padding:6px 12px"><b>ทายก่อน:</b> ① เริ่มจากหยุดนิ่ง กดขวาค้าง (+1.4 ทุกเฟรม) กี่เฟรมจึงถึงเพดาน 13? ② ปล่อยปุ่มตอนวิ่งเต็มที่ ยานไถลได้ไกลสุดกี่พิกเซล? ก) 0 ข) ประมาณ 13 ค) ประมาณ 52 ง) ไกลไม่สิ้นสุด เพราะความเร็วไม่เคยเป็นศูนย์</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="5" style="--paginate:true;--theme:default;" data-marpit-pagination-total="27">
<h1 id="%E0%B9%84%E0%B8%A5%E0%B9%88%E0%B8%95%E0%B8%B1%E0%B8%A7%E0%B9%80%E0%B8%A5%E0%B8%82-%E0%B8%81%E0%B8%94%E0%B8%82%E0%B8%A7%E0%B8%B2%E0%B8%84%E0%B9%89%E0%B8%B2%E0%B8%87-12-%E0%B9%80%E0%B8%9F%E0%B8%A3%E0%B8%A1-%E0%B9%81%E0%B8%A5%E0%B9%89%E0%B8%A7%E0%B8%9B%E0%B8%A5%E0%B9%88%E0%B8%AD%E0%B8%A2">ไล่ตัวเลข: กดขวาค้าง 12 เฟรม แล้วปล่อย</h1>
<p>เริ่ม <code>ship_x = 365.0</code>, <code>ship_speed = 0.0</code> · ทุกเฟรม: เปลี่ยนความเร็วก่อน แล้ว <strong>ตำแหน่ง + ความเร็ว</strong></p>
<table class="trace">
<tr><th>เฟรม</th><th style="background:#fff3e0">0</th><th style="background:#fff3e0">1</th><th style="background:#fff3e0">2</th><th style="background:#fff3e0">3</th><th style="background:#fff3e0">…</th><th style="background:#fff3e0">9</th><th style="background:#fff3e0">10</th><th style="background:#fff3e0">12</th><th style="background:#e3f2fd">13</th><th style="background:#e3f2fd">14</th><th style="background:#e3f2fd">15</th><th style="background:#e3f2fd">16</th><th style="background:#e3f2fd">…</th><th style="background:#e3f2fd">24</th></tr>
<tr><td><code>ship_speed</code></td><td>0</td><td>1.4</td><td>2.8</td><td>4.2</td><td>…</td><td>12.6</td><td style="color:#cf222e"><b>13.0</b></td><td>13.0</td><td>10.4</td><td>8.3</td><td>6.7</td><td>5.3</td><td>…</td><td>0.9</td></tr>
<tr><td><code>ship_x</code></td><td>365.0</td><td>366.4</td><td>369.2</td><td>373.4</td><td>…</td><td>428.0</td><td>441.0</td><td>467.0</td><td>477.4</td><td>485.7</td><td>492.4</td><td>497.7</td><td>…</td><td>515.4</td></tr>
</table>
<ul>
<li><strong>กดค้าง (ส้ม):</strong> บวก 1.4 เท่ากันทุกเฟรม · เฟรม 10: 12.6 + 1.4 = 14.0 เกินเพดาน ถูกบีบเหลือ 13.0 → ตอบข้อ ①: <strong>10 เฟรม</strong> (1/3 วินาที)</li>
<li><strong>ปล่อย (ฟ้า):</strong> ×0.80 = <strong>เก็บไว้ 80% ทิ้ง 20%</strong> · 13 → 10.4 → 8.3 → 6.7 ทิ้งไป 2.6, 2.1, 1.7 … ยิ่งช้ายิ่งทิ้งน้อย</li>
<li>ตอบข้อ ②: ระยะไถลเข้าใกล้ <strong>52 px</strong> แต่ไม่เกิน (467 → เกือบ 519) = <strong>ค)</strong> สั้นกว่าตัวยาน 1 ลำ (62 px)</li>
<li>ตั้งแต่เฟรม 24 ความเร็วต่ำกว่า 1 พิกเซลต่อเฟรม · หลังเฟรม 30 ภาพบนจอไม่ขยับอีก ยานจึงดูหยุด</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--theme:default;" data-marpit-pagination-total="27">
<h1 id="%E0%B8%AA%E0%B8%B9%E0%B8%95%E0%B8%A3-%E0%B8%9E%E0%B8%B9%E0%B8%94%E0%B9%80%E0%B8%9B%E0%B9%87%E0%B8%99%E0%B8%84%E0%B8%B3%E0%B8%81%E0%B9%88%E0%B8%AD%E0%B8%99-%E0%B9%81%E0%B8%A5%E0%B9%89%E0%B8%A7%E0%B8%84%E0%B9%88%E0%B8%AD%E0%B8%A2%E0%B9%80%E0%B8%82%E0%B8%B5%E0%B8%A2%E0%B8%99%E0%B9%80%E0%B8%9B%E0%B9%87%E0%B8%99%E0%B8%AA%E0%B8%B1%E0%B8%8D%E0%B8%A5%E0%B8%B1%E0%B8%81%E0%B8%A9%E0%B8%93%E0%B9%8C">สูตร: พูดเป็นคำก่อน แล้วค่อยเขียนเป็นสัญลักษณ์</h1>
<p>ปุ่มไม่ได้ขยับยานตรง ๆ: <strong>ปุ่ม → ความเร็ว → ตำแหน่ง → จอ</strong> (ไม้ตี Pong คาบ 6 ก็ใช้ท่านี้)</p>
<table>
<thead>
<tr>
<th>เป็นคำพูด</th>
<th>สัญลักษณ์</th>
<th>แทนเลขจริง</th>
<th>ในโค้ด</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>กดอยู่:</strong> ความเร็วใหม่ = ความเร็วเดิม + แรงเร่ง</td>
<td><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>v</mi><mtext>ใหม่</mtext></msub><mo>=</mo><msub><mi>v</mi><mtext>เดิม</mtext></msub><mo>+</mo><mi>a</mi></mrow><annotation encoding="application/x-tex">v_{\text{ใหม่}} = v_{\text{เดิม}} + a</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.5806em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3283em;"><span style="top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord text mtight"><span class="mord brahmic_fallback mtight">ใหม่</span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.7333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3283em;"><span style="top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord text mtight"><span class="mord brahmic_fallback mtight">เดิม</span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal">a</span></span></span></span></td>
<td>2.8 = 1.4 + 1.4</td>
<td><code>ship_speed += ACCEL</code></td>
</tr>
<tr>
<td><strong>ปล่อย:</strong> ความเร็วใหม่ = ความเร็วเดิม × ตัวไถล</td>
<td><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>v</mi><mtext>ใหม่</mtext></msub><mo>=</mo><msub><mi>v</mi><mtext>เดิม</mtext></msub><mo>×</mo><mi>f</mi></mrow><annotation encoding="application/x-tex">v_{\text{ใหม่}} = v_{\text{เดิม}} \times f</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.5806em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3283em;"><span style="top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord text mtight"><span class="mord brahmic_fallback mtight">ใหม่</span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.7333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3283em;"><span style="top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord text mtight"><span class="mord brahmic_fallback mtight">เดิม</span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.8889em;vertical-align:-0.1944em;"></span><span class="mord mathnormal" style="margin-right:0.1076em;">f</span></span></span></span></td>
<td>10.4 = 13 × 0.80</td>
<td><code>ship_speed *= FRICTION</code></td>
</tr>
<tr>
<td><strong>ทุกเฟรม:</strong> ตำแหน่งใหม่ = ตำแหน่งเดิม + ความเร็ว</td>
<td><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>x</mi><mtext>ใหม่</mtext></msub><mo>=</mo><msub><mi>x</mi><mtext>เดิม</mtext></msub><mo>+</mo><mi>v</mi></mrow><annotation encoding="application/x-tex">x_{\text{ใหม่}} = x_{\text{เดิม}} + v</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.5806em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal">x</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3283em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord text mtight"><span class="mord brahmic_fallback mtight">ใหม่</span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.7333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal">x</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3283em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord text mtight"><span class="mord brahmic_fallback mtight">เดิม</span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">v</span></span></span></span></td>
<td>366.4 = 365.0 + 1.4</td>
<td><code>ship_x + ship_speed</code></td>
</tr>
</tbody>
</table>
<ul>
<li><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>x</mi></mrow><annotation encoding="application/x-tex">x</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal">x</span></span></span></span> = ตำแหน่ง <code>ship_x</code> · <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>v</mi></mrow><annotation encoding="application/x-tex">v</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">v</span></span></span></span> = ความเร็ว <code>ship_speed</code> (พิกเซลต่อเฟรม)</li>
<li><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>a</mi></mrow><annotation encoding="application/x-tex">a</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal">a</span></span></span></span> = แรงเร่ง <code>ACCEL</code> = 1.4 · <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>f</mi></mrow><annotation encoding="application/x-tex">f</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8889em;vertical-align:-0.1944em;"></span><span class="mord mathnormal" style="margin-right:0.1076em;">f</span></span></span></span> = ตัวไถล <code>FRICTION</code> = 0.80 (เก็บไว้ 80%)</li>
<li>กดซ้ายใช้ <strong>ลบ</strong> แทนบวก: <code>ship_speed -= ACCEL</code> ความเร็วติดลบ = ไปทางซ้าย</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--theme:default;" data-marpit-pagination-total="27">
<h1 id="clamp--%E0%B8%9A%E0%B8%B5%E0%B8%9A%E0%B8%84%E0%B9%88%E0%B8%B2%E0%B9%83%E0%B8%AB%E0%B9%89%E0%B8%AD%E0%B8%A2%E0%B8%B9%E0%B9%88%E0%B9%83%E0%B8%99%E0%B8%8A%E0%B9%88%E0%B8%A7%E0%B8%87-%E0%B9%84%E0%B8%A1%E0%B9%88%E0%B8%95%E0%B9%88%E0%B8%B3%E0%B8%81%E0%B8%A7%E0%B9%88%E0%B8%B2%E0%B8%9E%E0%B8%B7%E0%B9%89%E0%B8%99-%E0%B9%84%E0%B8%A1%E0%B9%88%E0%B9%80%E0%B8%81%E0%B8%B4%E0%B8%99%E0%B9%80%E0%B8%9E%E0%B8%94%E0%B8%B2%E0%B8%99">clamp = บีบค่าให้อยู่ในช่วง ไม่ต่ำกว่าพื้น ไม่เกินเพดาน</h1>
<img class="flat" src="img/s10_clamp.png" style="width:980px" />
<p>อ่านจากในออกนอก: <code>max(พื้น, min(เพดาน, ค่า))</code> → <code>min</code> ตัดส่วนที่เกินเพดาน · <code>max</code> ยกส่วนที่ต่ำกว่าพื้น</p>
<table>
<thead>
<tr>
<th>บีบอะไร</th>
<th>พื้น … เพดาน</th>
<th>ตัวอย่างเลขจริง</th>
</tr>
</thead>
<tbody>
<tr>
<td>ความเร็ว</td>
<td>−13 … 13</td>
<td>12.6 + 1.4 = 14.0 → <code>min(13.0, 14.0)</code> = <strong>13.0</strong></td>
</tr>
<tr>
<td>ตำแหน่ง ชนขวา</td>
<td>0 … 730</td>
<td>725.0 + 13 = 738.0 → <code>min(730, 738.0)</code> = <strong>730</strong></td>
</tr>
<tr>
<td>ตำแหน่ง ชนซ้าย</td>
<td>0 … 730</td>
<td>5.0 − 13 = −8.0 → <code>max(0, -8.0)</code> = <strong>0</strong></td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--theme:default;" data-marpit-pagination-total="27">
<h1 id="%E0%B8%97%E0%B8%B3%E0%B9%84%E0%B8%A1-ship_x-%E0%B9%80%E0%B8%81%E0%B9%87%E0%B8%9A%E0%B9%80%E0%B8%9B%E0%B9%87%E0%B8%99%E0%B8%97%E0%B8%A8%E0%B8%99%E0%B8%B4%E0%B8%A2%E0%B8%A1-3650">ทำไม <code>ship_x</code> เก็บเป็นทศนิยม (365.0)</h1>
<p>เหมือน <strong>หยอดกระปุก</strong>: ได้เศษ 0.5 บาททุกวัน หยอดเก็บ 6 วันได้ 3 บาท · ตัดทิ้งทุกวันได้ 0 บาท<br />
สมมติยานเหลือความเร็ว <strong>0.5 พิกเซลต่อเฟรม</strong> (ช่วงใกล้หยุด):</p>
<table class="trace">
<tr><th>เฟรม</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th></tr>
<tr><td style="text-align:left"><code>ship_x</code> เก็บทศนิยม (ไปขวา +0.5)</td><td>365.0</td><td>365.5</td><td>366.0</td><td>366.5</td><td>367.0</td><td>367.5</td><td>368.0</td></tr>
<tr><td style="text-align:left">จอวาด (ตัดเศษตอนวาด)</td><td>365</td><td>365</td><td>366</td><td>366</td><td>367</td><td>367</td><td>368</td></tr>
<tr><td style="text-align:left;color:#cf222e">ตัดเศษเองทุกเฟรม ไปขวา</td><td>365</td><td>365</td><td>365</td><td>365</td><td>365</td><td>365</td><td>365</td></tr>
<tr><td style="text-align:left;color:#cf222e">ตัดเศษเองทุกเฟรม ไปซ้าย (−0.5)</td><td>365</td><td>364</td><td>363</td><td>362</td><td>361</td><td>360</td><td>359</td></tr>
</table>
<ul>
<li><code>move_to()</code> <strong>ตัดเศษให้เองตอนวาด</strong> (<code>bentogame.py:238</code>) ส่วน <code>ship_x</code> เก็บเศษไว้ครบ ซ้ายกับขวาจึงไถลเท่ากัน</li>
<li>ถ้า <strong>ตัดเศษเองทุกเฟรม</strong> (<code>ship_x = int(ship_x + ship_speed)</code>): ไปขวา ความเร็วต่ำกว่า 1 หายหมด ยานหยุดก่อนเวลา · ไปซ้าย กลับคืบทีละ 1 พิกเซลทุกเฟรม ไถลไกลเกินจริง</li>
<li><code>round()</code> ก็ไม่รอด: ความเร็วต่ำกว่า 0.5 หายทั้งสองทิศ · Python คิด <code>365 + 1.4</code> ได้ <code>366.4</code> ให้อยู่แล้ว เราเขียน <code>365.0</code> ให้คนอ่านรู้ว่าตัวนี้เก็บทศนิยม</li>
</ul>
</section>

<h1 id="step-2--%E0%B8%87%E0%B8%B2%E0%B8%99%E0%B8%82%E0%B8%AD%E0%B8%87%E0%B8%99%E0%B9%89%E0%B8%AD%E0%B8%87-%E0%B9%86-30-%E0%B9%80%E0%B8%95%E0%B8%B4%E0%B8%A1-5-%E0%B8%82%E0%B8%B1%E0%B9%89%E0%B8%99%E0%B9%83%E0%B8%99-on_frame">step 2 — งานของน้อง ๆ (30%): เติม 5 ขั้นใน <code>on_frame()</code></h1>
<p>เปิด <a class="pc-gh-link" href="https://github.com/Advance-Innovation-Centre-AIC/embedded-systems-for-developer/blob/main/developer-i/practise_codes/shooter_step2.py" target="_blank" rel="noopener" title="เปิดไฟล์บน GitHub (แท็บใหม่)" style="text-decoration:none"><code>practise_codes/shooter_step2.py</code><sup style="color:#22d3ee;font-weight:800">&#8599;</sup></a> · ค่าฟิสิกส์ (บรรทัด 16) กับส่วนนี้ (25–27) ให้มาแล้ว:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">on_frame</span>():
    <span class="hljs-keyword">global</span> ship_x, ship_speed     <span class="hljs-comment"># ให้ฟังก์ชันแก้ตัวแปรข้างนอกได้</span>
    keys = game.keys()            <span class="hljs-comment"># อ่านจอยของเฟรมนี้</span>
</code></pre>
<table>
<thead>
<tr>
<th>ขั้น</th>
<th>เขียนอะไร</th>
<th>สูตรจากสไลด์ก่อน</th>
</tr>
</thead>
<tbody>
<tr>
<td>① เร่ง</td>
<td>กดซ้าย → ลบ <code>ACCEL</code> · กดขวา → บวก <code>ACCEL</code></td>
<td><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>v</mi><mo>+</mo><mi>a</mi></mrow><annotation encoding="application/x-tex">v + a</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6667em;vertical-align:-0.0833em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal">a</span></span></span></span></td>
</tr>
<tr>
<td>② ไถล</td>
<td>ไม่กดทั้งคู่ → คูณ <code>FRICTION</code></td>
<td><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>v</mi><mo>×</mo><mi>f</mi></mrow><annotation encoding="application/x-tex">v \times f</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6667em;vertical-align:-0.0833em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.8889em;vertical-align:-0.1944em;"></span><span class="mord mathnormal" style="margin-right:0.1076em;">f</span></span></span></span></td>
</tr>
<tr>
<td>③ เพดาน</td>
<td>บีบ <code>ship_speed</code> ไว้ใน <code>-MAX_SPEED</code> … <code>MAX_SPEED</code></td>
<td>clamp</td>
</tr>
<tr>
<td>④ ขยับ + ขอบจอ</td>
<td><code>ship_x + ship_speed</code> แล้วบีบไว้ใน <code>0</code> … <code>game.WIDTH - ship.w</code></td>
<td><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>x</mi><mo>+</mo><mi>v</mi></mrow><annotation encoding="application/x-tex">x + v</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6667em;vertical-align:-0.0833em;"></span><span class="mord mathnormal">x</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">v</span></span></span></span> แล้ว clamp</td>
</tr>
<tr>
<td>⑤ วาด</td>
<td><code>ship.move_to(ship_x, 352)</code></td>
<td>—</td>
</tr>
</tbody>
</table>
<p>ติดตรงไหน เปิด <code>pong_step2.py</code> ของคาบ 6 — ท่าเดียวกัน: <code>up/down</code> → <code>left/right</code> · <code>player_</code> → <code>ship_</code> · <code>HEIGHT - PADDLE_H</code> → <code>WIDTH - ship.w</code></p>

<h1 id="%E0%B8%A3%E0%B8%B1%E0%B8%99%E0%B8%9A%E0%B8%99%E0%B8%9A%E0%B8%AD%E0%B8%A3%E0%B9%8C%E0%B8%94--%E0%B9%80%E0%B8%8A%E0%B9%87%E0%B8%84%E0%B8%9C%E0%B9%88%E0%B8%B2%E0%B8%99--%E0%B8%81%E0%B8%B1%E0%B8%9A%E0%B8%94%E0%B8%B1%E0%B8%81">รันบนบอร์ด · เช็คผ่าน · กับดัก</h1>
<div style="display:flex;gap:14px;margin-bottom:8px">
<div style="flex:0 0 40%;border:2px solid #1565c0;border-radius:10px;padding:6px 12px;background:#e3f2fd"><b>รัน:</b> BENTO IDE → <b>Program to Device</b> (หรือ BENTO Emulator)<br />หน้าชื่อเกม <b>Start = เริ่ม</b> · ระหว่างเล่น <b>Start = พัก · Back = ออก</b></div>
<div style="flex:1;border:2px solid #2e7d32;border-radius:10px;padding:6px 12px;background:#e8f5e9"><b>เช็คผ่าน:</b> ☐ ยาน + HUD ขึ้นจอ &nbsp;☐ กดค้างเร่ง · ปล่อยไถลต่อ<br />☐ ชนขอบซ้าย-ขวาไม่หลุด → ถ่ายรูป &nbsp;☐ ชี้บรรทัด ①–⑤ ได้</div>
</div>
<table>
<thead>
<tr>
<th>อาการ</th>
<th>สาเหตุ</th>
<th>แก้</th>
</tr>
</thead>
<tbody>
<tr>
<td>error เรื่อง local variable</td>
<td>ลบบรรทัด <code>global</code></td>
<td>ใส่คืนบนสุดของ <code>on_frame()</code></td>
</tr>
<tr>
<td>ปล่อยปุ่มแล้วหยุดกึก ไม่ไถล</td>
<td>เขียน <code>ship_speed = 0</code></td>
<td>ใช้ <code>ship_speed *= FRICTION</code></td>
</tr>
<tr>
<td>ยานหลุดขอบขวาทั้งลำ</td>
<td>บีบที่ <code>game.WIDTH</code> ลืมลบ <code>ship.w</code></td>
<td>ใช้ <code>game.WIDTH - ship.w</code></td>
</tr>
<tr>
<td>ไถลซ้าย-ขวาไม่เท่ากัน</td>
<td>ตัดเศษเองด้วย <code>int()</code> ทุกเฟรม</td>
<td>ให้ <code>ship_x</code> เก็บทศนิยม</td>
</tr>
<tr>
<td>ชนขอบขวาแล้วกดซ้าย ค้างราว 0.3 วินาที</td>
<td>ความเร็วยัง +13 ต้องลบอีก 10 เฟรมจึงติดลบ</td>
<td>ไม่ใช่บั๊กที่ทำให้เกมพัง แต่ปรับให้ดีขึ้นได้ (ภาคผนวก)</td>
</tr>
<tr>
<td>จอยกดไม่ติดหลังโหลดโค้ดใหม่</td>
<td>บอร์ดรีเซ็ต</td>
<td>ถอด-เสียบสาย USB จอยใหม่</td>
</tr>
</tbody>
</table>
<p><strong>ส่งงาน:</strong> commit <code>shooter_step2.py</code> + รูปจอ · ข้อความ <code>feat(shooter): step1-2 ship + accel/friction steering</code></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--theme:default;" data-marpit-pagination-total="27">
<h1 id="%E0%B8%AA%E0%B8%A3%E0%B8%B8%E0%B8%9B--%E0%B9%80%E0%B8%AD%E0%B8%B2%E0%B9%84%E0%B8%9B%E0%B9%83%E0%B8%8A%E0%B9%89%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B8%AD%E0%B8%B7%E0%B9%88%E0%B8%99">สรุป + เอาไปใช้ที่อื่น</h1>
<ul>
<li><strong>ปุ่ม → ความเร็ว → ตำแหน่ง → จอ:</strong> เก็บ <code>ship_speed</code> กับ <code>ship_x</code> ไว้ข้ามเฟรม แล้วอัปเดตทุกเฟรม</li>
<li><strong>บวก 1.4 = ขั้นเท่ากัน · คูณ 0.80 = เก็บไว้ 80% · clamp = ไม่เกินเพดานและขอบ</strong> ครบชุดคือ &quot;ยานมีน้ำหนัก&quot;</li>
<li><strong>เก็บตำแหน่งเป็นทศนิยม</strong> ตัดเศษเป็นพิกเซลแค่ตอนวาด</li>
</ul>
<table>
<thead>
<tr>
<th>เอาไปใช้ที่</th>
<th>ตัวแปรที่จะตั้ง</th>
<th>ถ้าน้องเขียนเอง (ตัวอย่าง)</th>
</tr>
</thead>
<tbody>
<tr>
<td>ตัวละครในเกมของน้องเอง</td>
<td><code>player_x</code>, <code>player_vx</code></td>
<td>5 ขั้นเดียวกับวันนี้ แค่เปลี่ยนชื่อ</td>
</tr>
<tr>
<td>ฟีดที่ปัดแล้วปล่อยนิ้วยังเลื่อนต่อ (หลักการคล้ายกัน)</td>
<td><code>scroll_y</code>, <code>scroll_v</code></td>
<td>ปล่อยนิ้ว: <code>scroll_v *= FRICTION</code></td>
</tr>
<tr>
<td>พัดลม / มอเตอร์ค่อย ๆ เร่ง</td>
<td><code>pwm</code>, <code>STEP</code></td>
<td><code>pwm = min(100, pwm + STEP)</code></td>
</tr>
</tbody>
</table>
<div style="margin-top:10px;background:#e8f5e9;border:2px solid #2e7d32;border-radius:10px;padding:8px 14px">
<b>คาบหน้า (11) — กระสุน:</b> กด A แล้วเลเซอร์พุ่ง · สร้างกระสุนไว้ 6 นัดครั้งเดียวแล้ววนใช้ซ้ำ เรียกว่า <b>ชุดกระสุนหมุนเวียน</b> (Object Pool)
</div>

<h1 id="%E0%B8%A0%E0%B8%B2%E0%B8%84%E0%B8%9C%E0%B8%99%E0%B8%A7%E0%B8%81">ภาคผนวก</h1>
<p>ไม่จำเป็นต่อแล็บ — เปิดเมื่อมีเวลา หรือให้น้อง ๆ อ่านเองที่บ้าน</p>
<ul>
<li>ดูเกมเต็ม · ภาพ &quot;ปุ่ม → ความเร็ว&quot; เทียบ Catch · ตารางเต็มช่วงปล่อย · ภาพเคลื่อนไหวความเร็ว</li>
<li>ลองเปลี่ยนตัวเลข (ทายก่อนรัน) · เอาไปใช้ที่อื่น (ตารางเต็ม)</li>
<li>เฉลย step 1 และ step 2 · คณิตเพิ่มเติม: ระยะไถล 52 px มาจากไหน</li>
<li>ต่อยอด: ชนขอบแล้วหยุดความเร็ว · เชื่อมโยงรากฐาน · วิดีโอเสริม · ใช้จริงที่ไหน</li>
<li>ต่อยอด — คิดต่อเอง (โจทย์ Buddy Challenge) · ของเล่นในสไลด์: จูน 3 ค่า</li>

<h1 id="%E0%B8%84%E0%B8%A7%E0%B8%B2%E0%B8%A1%E0%B8%84%E0%B8%B4%E0%B8%94%E0%B8%AB%E0%B8%A5%E0%B8%B1%E0%B8%81-%E0%B8%9B%E0%B8%B8%E0%B9%88%E0%B8%A1%E0%B9%84%E0%B8%A1%E0%B9%88%E0%B9%84%E0%B8%94%E0%B9%89%E0%B8%82%E0%B8%A2%E0%B8%B1%E0%B8%9A%E0%B8%A2%E0%B8%B2%E0%B8%99-%E0%B8%9B%E0%B8%B8%E0%B9%88%E0%B8%A1%E0%B9%81%E0%B8%81%E0%B9%89-%E0%B8%84%E0%B8%A7%E0%B8%B2%E0%B8%A1%E0%B9%80%E0%B8%A3%E0%B9%87%E0%B8%A7">ความคิดหลัก: ปุ่มไม่ได้ขยับยาน ปุ่มแก้ &quot;ความเร็ว&quot;</h1>
<img class="flat" src="img/s10_chain.png" style="width:1060px" />
<ul>
<li><code>ship_x</code> = ยานอยู่ตรงไหน · <code>ship_speed</code> = เฟรมนี้ยานขยับกี่พิกเซล (<strong>+</strong> ไปขวา · <strong>−</strong> ไปซ้าย)</li>
<li>ความเร็ว <strong>จำค่าข้ามเฟรม</strong> ยานจึงเร่งได้ และยังไถลต่อได้หลังปล่อยปุ่ม</li>
<li>ไม้ตี Pong คาบ 6 ทำแบบนี้มาแล้ว (<code>player_speed</code>) วันนี้แค่หมุนจากแนวตั้งเป็นแนวนอน</li>
<li>ไม่มีคำสั่งใหม่เลย: <code>game.Box</code>, <code>game.keys</code>, <code>move_to</code> คือ 70% ที่เอนจินให้ · งานของเรา (30%) คือ 5 ขั้นใน <code>on_frame()</code></li>

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--theme:default;" data-marpit-pagination-total="27">
<h1 id="%E0%B8%95%E0%B8%B2%E0%B8%A3%E0%B8%B2%E0%B8%87%E0%B9%80%E0%B8%95%E0%B9%87%E0%B8%A1%E0%B8%8A%E0%B9%88%E0%B8%A7%E0%B8%87%E0%B8%9B%E0%B8%A5%E0%B9%88%E0%B8%AD%E0%B8%A2-%C3%97080--%E0%B9%80%E0%B8%81%E0%B9%87%E0%B8%9A%E0%B9%84%E0%B8%A7%E0%B9%89-80-%E0%B8%97%E0%B8%B4%E0%B9%89%E0%B8%87-20">ตารางเต็มช่วงปล่อย: ×0.80 = เก็บไว้ 80% ทิ้ง 20%</h1>
<p>เฟรม 13 ปล่อยปุ่ม ตั้งแต่นั้นทุกเฟรม <strong>ความเร็ว × 0.80</strong> แล้ว <strong>ตำแหน่ง + ความเร็ว</strong> เหมือนเดิม</p>
<table class="trace">
<tr><th>เฟรม</th><th>12</th><th>13</th><th>14</th><th>15</th><th>16</th><th>17</th><th>18</th><th>19</th><th>20</th><th>…</th><th>30</th></tr>
<tr><td><code>ship_speed</code></td><td>13.0</td><td>10.4</td><td>8.3</td><td>6.7</td><td>5.3</td><td>4.3</td><td>3.4</td><td>2.7</td><td>2.2</td><td>…</td><td>0.2</td></tr>
<tr><td>หายไปเฟรมนี้</td><td>–</td><td>2.6</td><td>2.1</td><td>1.7</td><td>1.3</td><td>1.1</td><td>0.9</td><td>0.7</td><td>0.5</td><td>…</td><td>~0</td></tr>
<tr><td><code>ship_x</code></td><td>467.0</td><td>477.4</td><td>485.7</td><td>492.4</td><td>497.7</td><td>502.0</td><td>505.4</td><td>508.1</td><td>510.3</td><td>…</td><td>518.1</td></tr>
</table>
<ul>
<li>เร็วมาก หายเยอะ (2.6) · ช้าแล้ว หายน้อย (0.5) → ความเร็ว <strong>ลดเป็นเส้นโค้ง</strong> ไม่ใช่เส้นตรง</li>
<li>ระยะไถลรวมเข้าใกล้ <strong>52 px</strong> แต่ไม่เกิน (467 → เกือบ 519) สั้นกว่าตัวยาน 1 ลำ (62 px)</li>
<li>ตั้งแต่เฟรม 24 ความเร็วต่ำกว่า 1 พิกเซลต่อเฟรม (0.89) · หลังเฟรม 30 ภาพบนจอหยุดที่พิกเซล 518 ยานจึง <strong>ดูหยุด</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--theme:default;" data-marpit-pagination-total="27">
<h1 id="%E0%B8%94%E0%B8%B9%E0%B9%80%E0%B8%9B%E0%B9%87%E0%B8%99%E0%B8%A0%E0%B8%B2%E0%B8%9E-%E0%B8%9A%E0%B8%A7%E0%B8%81--%E0%B8%82%E0%B8%B1%E0%B9%89%E0%B8%99%E0%B8%9A%E0%B8%B1%E0%B8%99%E0%B9%84%E0%B8%94--%E0%B8%84%E0%B8%B9%E0%B8%93--%E0%B9%80%E0%B8%AA%E0%B9%89%E0%B8%99%E0%B9%82%E0%B8%84%E0%B9%89%E0%B8%87">ดูเป็นภาพ: บวก = ขั้นบันได · คูณ = เส้นโค้ง</h1>
<div style="display:flex;gap:26px;align-items:center">
<img class="flat" src="img/s10_speed.gif" style="width:480px;flex:0 0 480px" />
<div>
<ul>
<li><strong>แท่งส้ม = กดค้าง</strong> สูงขึ้นทีละ 1.4 เท่ากัน จนชนเส้นเพดาน 13 แล้วแบน</li>
<li><strong>แท่งฟ้า = ปล่อย</strong> แต่ละแท่งสูง 80% ของแท่งก่อนหน้า ยิ่งเตี้ยยิ่งหดช้า</li>
<li><strong>จุดบนแถบบน = <code>ship_x</code> แต่ละเฟรม</strong> จุดห่าง = เร็ว · จุดชิด = ช้า</li>
<li>ภาพช้าลงราว 5 เท่า (0.15 วินาทีต่อเฟรม) บนบอร์ดจริงเร็วกว่านี้</li>
</ul>
</div>
</div>
<blockquote>
<p>จำง่าย ๆ: <strong>บวกทุกเฟรม = ขั้นเท่ากัน</strong> · <strong>คูณทุกเฟรม = ลดทีละสัดส่วน</strong></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--theme:default;" data-marpit-pagination-total="27">
<h1 id="%E0%B8%A5%E0%B8%AD%E0%B8%87%E0%B9%80%E0%B8%9B%E0%B8%A5%E0%B8%B5%E0%B9%88%E0%B8%A2%E0%B8%99%E0%B8%95%E0%B8%B1%E0%B8%A7%E0%B9%80%E0%B8%A5%E0%B8%82-%E0%B8%97%E0%B8%B2%E0%B8%A2%E0%B8%81%E0%B9%88%E0%B8%AD%E0%B8%99-%E0%B9%81%E0%B8%A5%E0%B9%89%E0%B8%A7%E0%B8%84%E0%B9%88%E0%B8%AD%E0%B8%A2%E0%B8%A3%E0%B8%B1%E0%B8%99">ลองเปลี่ยนตัวเลข: ทายก่อน แล้วค่อยรัน</h1>
<p>แก้บรรทัด <code>ACCEL, MAX_SPEED, FRICTION = ...</code> ทีละค่า <strong>ทายเป็นตัวเลขก่อน</strong> แล้วรันเทียบ · จดลงใบงานข้อ 5</p>
<p>ค่าเดิม: ถึงเพดานใน 10 เฟรม · ไถลต่อเกือบ 1 ลำยาน (52 px) · ขับข้ามจอ ≈ 2 วินาที</p>
<table>
<thead>
<tr>
<th>เปลี่ยนเป็น</th>
<th>ทายด้วยเลข</th>
<th>จะรู้สึกว่า</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>FRICTION = 0.95</code></td>
<td>ไถลต่อ ≈ 4 ลำยาน (247 px)</td>
<td>ลื่นเหมือนพื้นเปียกหรือน้ำแข็ง</td>
</tr>
<tr>
<td><code>FRICTION = 0.50</code></td>
<td>ไถลต่อ ≈ 1/5 ลำยาน (13 px)</td>
<td>หยุดเกือบทันที</td>
</tr>
<tr>
<td><code>ACCEL = 3.0</code></td>
<td>ถึงเพดานใน 5 เฟรม</td>
<td>ออกตัวแรง</td>
</tr>
<tr>
<td><code>MAX_SPEED = 5.0</code></td>
<td>ขับข้ามจอ ≈ 5 วินาที</td>
<td>อืดลงมาก</td>
</tr>
</tbody>
</table>
<blockquote>
<p>ที่มาของเลขระยะไถลอยู่ในสไลด์ &quot;คณิตเพิ่มเติม&quot; · วัดบนบอร์ดโดยนับเป็นความยาวยาน (1 ลำ = 62 px)</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--theme:default;" data-marpit-pagination-total="27">
<h1 id="%E0%B9%80%E0%B8%AD%E0%B8%B2%E0%B9%84%E0%B8%9B%E0%B9%83%E0%B8%8A%E0%B9%89%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B8%AD%E0%B8%B7%E0%B9%88%E0%B8%99-%E0%B8%95%E0%B8%B2%E0%B8%A3%E0%B8%B2%E0%B8%87%E0%B9%80%E0%B8%95%E0%B9%87%E0%B8%A1-%E0%B9%80%E0%B8%A3%E0%B9%88%E0%B8%87--%E0%B9%84%E0%B8%96%E0%B8%A5--%E0%B8%9A%E0%B8%B5%E0%B8%9A-%E0%B8%AD%E0%B8%A2%E0%B8%B9%E0%B9%88%E0%B8%97%E0%B8%B8%E0%B8%81%E0%B8%97%E0%B8%B5%E0%B9%88">เอาไปใช้ที่อื่น (ตารางเต็ม): &quot;เร่ง · ไถล · บีบ&quot; อยู่ทุกที่</h1>
<table>
<thead>
<tr>
<th>ที่ไหน</th>
<th>ตัวแปรที่จะตั้ง</th>
<th>ถ้าน้องเขียนเอง (ตัวอย่าง)</th>
</tr>
</thead>
<tbody>
<tr>
<td>ตัวละครในเกมของน้องเอง</td>
<td><code>player_x</code>, <code>player_vx</code></td>
<td>5 ขั้นเดียวกับวันนี้ แค่เปลี่ยนชื่อ</td>
</tr>
<tr>
<td>ฟีดที่ปัดแล้วปล่อยนิ้วยังเลื่อนต่อ</td>
<td><code>scroll_y</code>, <code>scroll_v</code></td>
<td>ปล่อยนิ้ว: <code>scroll_v *= FRICTION</code> ทุกเฟรม</td>
</tr>
<tr>
<td>กล้องตามตัวละครแบบนุ่ม</td>
<td><code>cam_x</code></td>
<td><code>cam_x += (player_x - cam_x) * 0.1</code></td>
</tr>
<tr>
<td>เคอร์เซอร์ / ค่าเซนเซอร์ให้นิ่ง</td>
<td><code>shown</code>, <code>raw</code></td>
<td><code>shown += (raw - shown) * 0.2</code></td>
</tr>
<tr>
<td>พัดลม / มอเตอร์ค่อย ๆ เร่ง</td>
<td><code>pwm</code>, <code>STEP</code></td>
<td><code>pwm = min(100, pwm + STEP)</code></td>
</tr>
</tbody>
</table>
<ul>
<li>ฟีดมือถือ: หลักการคล้ายกัน ปล่อยนิ้วแล้วความเร็วค่อย ๆ ลดจนหยุด (แต่ละแอปตั้งค่าเอง)</li>
<li>กล้องกับเคอร์เซอร์คูณ <strong>ระยะห่าง</strong> แทนความเร็ว ระยะที่เหลือหดเป็นเส้นโค้งแบบเดียวกัน</li>
<li>มอเตอร์ใช้ &quot;บวกทีละขั้น + เพดาน&quot; = เร่ง + clamp กันกระแสกระชากตอนออกตัว</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--theme:default;" data-marpit-pagination-total="27">
<h1 id="%E0%B9%80%E0%B8%89%E0%B8%A5%E0%B8%A2-step-1--%E0%B8%AD%E0%B9%88%E0%B8%B2%E0%B8%99%E0%B9%83%E0%B8%AB%E0%B9%89%E0%B9%80%E0%B8%82%E0%B9%89%E0%B8%B2%E0%B9%83%E0%B8%88-%E0%B8%9B%E0%B8%B4%E0%B8%94%E0%B9%84%E0%B8%9F%E0%B8%A5%E0%B9%8C-%E0%B9%81%E0%B8%A5%E0%B9%89%E0%B8%A7%E0%B8%9E%E0%B8%B4%E0%B8%A1%E0%B8%9E%E0%B9%8C%E0%B9%80%E0%B8%AD%E0%B8%87">เฉลย step 1 — อ่านให้เข้าใจ ปิดไฟล์ แล้วพิมพ์เอง</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">import</span> bentogame <span class="hljs-keyword">as</span> game

game.title(<span class="hljs-string">&quot;SHOOTER&quot;</span>)                          <span class="hljs-comment"># หน้าชื่อเกม: Start = เล่น · Back = ออก</span>

ship = game.Box(<span class="hljs-number">365</span>, <span class="hljs-number">352</span>, <span class="hljs-number">62</span>, <span class="hljs-number">24</span>, game.GREEN)  <span class="hljs-comment"># ① ยาน: x, y, กว้าง, สูง, สี</span>
ship_x = <span class="hljs-number">365.0</span>                                 <span class="hljs-comment"># ตำแหน่ง x เก็บทศนิยม ให้ step 2 ใช้</span>
score, lives = <span class="hljs-number">0</span>, <span class="hljs-number">3</span>
hud = game.Text(<span class="hljs-string">&quot;Score: 0   Lives: 3&quot;</span>, <span class="hljs-number">10</span>, <span class="hljs-number">8</span>, game.WHITE)  <span class="hljs-comment"># ② ป้าย HUD</span>

<span class="hljs-keyword">def</span> <span class="hljs-title function_">on_frame</span>():
    <span class="hljs-keyword">pass</span>                                       <span class="hljs-comment"># ยังไม่มีอะไรขยับ = ภาพนิ่ง</span>

game.run(on_frame, fps=<span class="hljs-number">30</span>)                     <span class="hljs-comment"># เรียก on_frame 30 ครั้งต่อวินาที</span>
</code></pre>
<p><sub>ตรงกับ <code>solution_codes/shooter_step1.py:11-29</code> (ตัดบรรทัดคอมเมนต์ออก)</sub></p>
<ul>
<li><code>365</code> = (792 − 62) ÷ 2 จัดยานกลางจอ · <code>352</code> ใกล้ขอบล่าง</li>
<li>เก็บ <code>ship</code> กับ <code>hud</code> ใส่ตัวแปร เพราะต้องสั่งมันซ้ำทีหลัง (<code>ship.move_to</code> ใน step 2, <code>hud.set</code> ในคาบ 12)</li>
<li><code>on_frame()</code> ว่างแต่ต้องมี เพราะ <code>game.run()</code> ต้องมีฟังก์ชันไว้เรียกทุกเฟรม</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--theme:default;" data-marpit-pagination-total="27">
<h1 id="%E0%B9%80%E0%B8%89%E0%B8%A5%E0%B8%A2-step-2--5-%E0%B8%82%E0%B8%B1%E0%B9%89%E0%B8%99%E0%B8%82%E0%B8%AD%E0%B8%87%E0%B8%A2%E0%B8%B2%E0%B8%99%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B8%A1%E0%B8%B5%E0%B8%99%E0%B9%89%E0%B8%B3%E0%B8%AB%E0%B8%99%E0%B8%B1%E0%B8%81">เฉลย step 2 — 5 ขั้นของยานที่มีน้ำหนัก</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">on_frame</span>():
    <span class="hljs-keyword">global</span> ship_x, ship_speed
    keys = game.keys()

    <span class="hljs-keyword">if</span> keys.left:    ship_speed -= ACCEL      <span class="hljs-comment"># ① เร่งไปทางซ้าย</span>
    <span class="hljs-keyword">elif</span> keys.right: ship_speed += ACCEL      <span class="hljs-comment"># ① เร่งไปทางขวา</span>
    <span class="hljs-keyword">else</span>:            ship_speed *= FRICTION   <span class="hljs-comment"># ② ไถล: เหลือ 80% ทุกเฟรม</span>
    ship_speed = <span class="hljs-built_in">max</span>(-MAX_SPEED, <span class="hljs-built_in">min</span>(MAX_SPEED, ship_speed))   <span class="hljs-comment"># ③ เพดานความเร็ว</span>
    ship_x = <span class="hljs-built_in">max</span>(<span class="hljs-number">0</span>, <span class="hljs-built_in">min</span>(game.WIDTH - ship.w, ship_x + ship_speed))  <span class="hljs-comment"># ④ ขยับ + ขอบจอ</span>
    ship.move_to(ship_x, <span class="hljs-number">352</span>)                                  <span class="hljs-comment"># ⑤ วาด</span>
</code></pre>
<p><sub>ตรงกับ <code>solution_codes/shooter_step2.py:22-33</code> (ตัดบรรทัดคอมเมนต์ออก)</sub></p>
<ul>
<li>ใช้ <code>if / elif / else</code> เพราะเฟรมหนึ่งทำได้อย่างเดียว: เร่งซ้าย <strong>หรือ</strong> เร่งขวา <strong>หรือ</strong> ไถล</li>
<li>③ ต้องมาก่อน ④ เสมอ: บีบความเร็วให้เรียบร้อยก่อน แล้วค่อยเอาไปบวกตำแหน่ง</li>
<li>⑤ ส่ง <code>352</code> คือ y เดิม ยานเราวิ่งแนวนอนแกนเดียว</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--theme:default;" data-marpit-pagination-total="27">
<h1 id="%E0%B8%84%E0%B8%93%E0%B8%B4%E0%B8%95%E0%B9%80%E0%B8%9E%E0%B8%B4%E0%B9%88%E0%B8%A1%E0%B9%80%E0%B8%95%E0%B8%B4%E0%B8%A1-%E0%B8%A3%E0%B8%B0%E0%B8%A2%E0%B8%B0%E0%B9%84%E0%B8%96%E0%B8%A5-52-px-%E0%B8%A1%E0%B8%B2%E0%B8%88%E0%B8%B2%E0%B8%81%E0%B9%84%E0%B8%AB%E0%B8%99">คณิตเพิ่มเติม: ระยะไถล 52 px มาจากไหน</h1>
<p>คูณ 0.80 ซ้ำทุกเฟรม เขียนรวบเป็นสูตรเดียวได้ (ไม่ต้องใช้ในโค้ด แค่ใช้ทาย):</p>
<p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>v</mi><mrow><mtext>หลังปล่อย </mtext><mi>n</mi><mtext> เฟรม</mtext></mrow></msub><mo>=</mo><mn>13</mn><mo>×</mo><msup><mn>0.80</mn><mrow><mtext> </mtext><mi>n</mi></mrow></msup><mspace width="2em"/><mi>n</mi><mo>=</mo><mn>1</mn><mo>:</mo><mtext> </mtext><mn>10.4</mn><mspace width="1em"/><mi>n</mi><mo>=</mo><mn>3</mn><mo>:</mo><mtext> </mtext><mn>6.7</mn><mspace width="1em"/><mi>n</mi><mo>=</mo><mn>12</mn><mo>:</mo><mtext> </mtext><mn>0.9</mn></mrow><annotation encoding="application/x-tex">v_{\text{หลังปล่อย } n \text{ เฟรม}} = 13 \times 0.80^{\,n} \qquad n=1:\ 10.4 \quad n=3:\ 6.7 \quad n=12:\ 0.9 
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.5806em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3283em;"><span style="top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord text mtight"><span class="mord brahmic_fallback mtight">หลังปล่อย</span><span class="mord mtight"> </span></span><span class="mord mathnormal mtight">n</span><span class="mord text mtight"><span class="mord mtight"> </span><span class="mord brahmic_fallback mtight">เฟรม</span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">13</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.7144em;"></span><span class="mord">0.8</span><span class="mord"><span class="mord">0</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.7144em;"><span style="top:-3.113em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mspace mtight" style="margin-right:0.1952em;"></span><span class="mord mathnormal mtight">n</span></span></span></span></span></span></span></span></span><span class="mspace" style="margin-right:2em;"></span><span class="mord mathnormal">n</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">1</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">:</span><span class="mspace"> </span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">10.4</span><span class="mspace" style="margin-right:1em;"></span><span class="mord mathnormal">n</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">3</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">:</span><span class="mspace"> </span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">6.7</span><span class="mspace" style="margin-right:1em;"></span><span class="mord mathnormal">n</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">12</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">:</span><span class="mspace"> </span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">0.9</span></span></span></span></span></p><ul>
<li><strong>ครึ่งหนึ่งหายไปในราว 3 เฟรม</strong> (0.80³ ≈ 0.51) และต่ำกว่า 1 พิกเซลต่อเฟรมหลัง 12 เฟรม (0.4 วินาที)</li>
<li>ระยะไถลรวม = ผลบวกความเร็วทุกเฟรมหลังปล่อย:</li>
</ul>
<p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mn>10.4</mn><mo>+</mo><mn>8.32</mn><mo>+</mo><mn>6.66</mn><mo>+</mo><mo>⋯</mo><mo>=</mo><mn>13</mn><mo>×</mo><mfrac><mn>0.80</mn><mrow><mn>1</mn><mo>−</mo><mn>0.80</mn></mrow></mfrac><mo>=</mo><mn>13</mn><mo>×</mo><mn>4</mn><mo>=</mo><mn>52</mn><mtext> px</mtext></mrow><annotation encoding="application/x-tex">10.4 + 8.32 + 6.66 + \dots = 13 \times \frac{0.80}{1 - 0.80} = 13 \times 4 = 52 \text{ px} 
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">10.4</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">8.32</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">6.66</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.3669em;"></span><span class="minner">⋯</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">13</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:2.0908em;vertical-align:-0.7693em;"></span><span class="mord"><span class="mopen nulldelimiter"></span><span class="mfrac"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:1.3214em;"><span style="top:-2.314em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord">1</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mord">0.80</span></span></span><span style="top:-3.23em;"><span class="pstrut" style="height:3em;"></span><span class="frac-line" style="border-bottom-width:0.04em;"></span></span><span style="top:-3.677em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord">0.80</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.7693em;"><span></span></span></span></span></span><span class="mclose nulldelimiter"></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">13</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">4</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.8389em;vertical-align:-0.1944em;"></span><span class="mord">52</span><span class="mord text"><span class="mord"> px</span></span></span></span></span></span></p><ul>
<li>สูตรทั่วไป: ระยะไถล <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>=</mo><mi>v</mi><mo>×</mo><mstyle scriptlevel="0" displaystyle="true"><mfrac><mi>f</mi><mrow><mn>1</mn><mo>−</mo><mi>f</mi></mrow></mfrac></mstyle></mrow><annotation encoding="application/x-tex">= v \times \dfrac{f}{1-f}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.3669em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6667em;vertical-align:-0.0833em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:2.2519em;vertical-align:-0.8804em;"></span><span class="mord"><span class="mopen nulldelimiter"></span><span class="mfrac"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:1.3714em;"><span style="top:-2.314em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord">1</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mord mathnormal" style="margin-right:0.1076em;">f</span></span></span><span style="top:-3.23em;"><span class="pstrut" style="height:3em;"></span><span class="frac-line" style="border-bottom-width:0.04em;"></span></span><span style="top:-3.677em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1076em;">f</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.8804em;"><span></span></span></span></span></span><span class="mclose nulldelimiter"></span></span></span></span></span> → <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>f</mi><mo>=</mo><mn>0.95</mn></mrow><annotation encoding="application/x-tex">f = 0.95</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8889em;vertical-align:-0.1944em;"></span><span class="mord mathnormal" style="margin-right:0.1076em;">f</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">0.95</span></span></span></span>: 13 × 19 = 247 px · <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>f</mi><mo>=</mo><mn>0.50</mn></mrow><annotation encoding="application/x-tex">f = 0.50</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8889em;vertical-align:-0.1944em;"></span><span class="mord mathnormal" style="margin-right:0.1076em;">f</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">0.50</span></span></span></span>: 13 × 1 = 13 px</li>
<li>ตัวเลขทั้งหมดคิด <strong>ต่อเฟรม</strong> ถ้าเปลี่ยน <code>fps</code> ความรู้สึกก็เปลี่ยนตาม (เกมใหญ่แก้ด้วยการคูณเวลาต่อเฟรม)</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--theme:default;" data-marpit-pagination-total="27">
<h1 id="%E0%B8%95%E0%B9%88%E0%B8%AD%E0%B8%A2%E0%B8%AD%E0%B8%94-%E0%B8%8A%E0%B8%99%E0%B8%82%E0%B8%AD%E0%B8%9A%E0%B9%81%E0%B8%A5%E0%B9%89%E0%B8%A7%E0%B8%AB%E0%B8%A2%E0%B8%B8%E0%B8%94%E0%B8%84%E0%B8%A7%E0%B8%B2%E0%B8%A1%E0%B9%80%E0%B8%A3%E0%B9%87%E0%B8%A7">ต่อยอด: ชนขอบแล้วหยุดความเร็ว</h1>
<p><strong>ทายก่อน:</strong> ขับชนขอบขวาด้วยความเร็วเต็ม 13 แล้วกดซ้ายทันที ยานจะค้างที่ขอบกี่เฟรม?</p>
<table class="trace">
<tr><th>เฟรมหลังกดซ้าย</th><th>0</th><th>1</th><th>2</th><th>3</th><th>…</th><th>8</th><th>9</th><th>10</th></tr>
<tr><td><code>ship_speed</code></td><td>13.0</td><td>11.6</td><td>10.2</td><td>8.8</td><td>…</td><td>1.8</td><td>0.4</td><td style="color:#1a7f37"><b>−1.0</b></td></tr>
<tr><td><code>ship_x</code></td><td>730</td><td>730</td><td>730</td><td>730</td><td>…</td><td>730</td><td>730</td><td style="color:#1a7f37"><b>729.0</b></td></tr>
</table>
<p>ความเร็วยังเป็นบวก 9 เฟรม ขอบบีบ <code>ship_x</code> ไว้ที่ 730 → ค้างราว 0.3 วินาที เกมเต็มแก้โดย <strong>ตั้งความเร็วเป็น 0 ตอนชนขอบ</strong> (<code>full_games/shooter_full.py:103-105</code>):</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">        <span class="hljs-keyword">if</span> x &gt; game.WIDTH - SHIP_W:
            x = <span class="hljs-built_in">float</span>(game.WIDTH - SHIP_W)
            st[<span class="hljs-string">&quot;svx&quot;</span>] = <span class="hljs-number">0.0</span>
</code></pre>
<p>ไม่ใช่บั๊กที่ทำให้เกมพัง แต่ปรับให้ดีขึ้นได้: ลองทำในไฟล์ของตัวเอง ถ้า <code>ship_x</code> ชนขอบซ้ายหรือขวา ให้ <code>ship_speed = 0.0</code></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="23" style="--paginate:true;--theme:default;--marpit-advanced-background-split:30%;" data-marpit-pagination-total="27" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;img/ins_asteroids.jpg&quot;);background-size:80% auto;"></figure></div></section></foreignObject><foreignObject width="70%" height="720"><section id="23" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="23" style="--paginate:true;--theme:default;--marpit-advanced-background-split:30%;" data-marpit-pagination-total="27" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h1 id="%E0%B9%80%E0%B8%8A%E0%B8%B7%E0%B9%88%E0%B8%AD%E0%B8%A1%E0%B9%82%E0%B8%A2%E0%B8%87%E0%B8%A3%E0%B8%B2%E0%B8%81%E0%B8%90%E0%B8%B2%E0%B8%99">เชื่อมโยงรากฐาน</h1>
<ul>
<li><strong>Asteroids (Atari, 1979)</strong> บังคับยานด้วยแรงเฉื่อยแบบเดียวกัน: เก็บความเร็วไว้ แล้วบวกเข้าตำแหน่งทุกเฟรม</li>
<li><strong>Euler integration</strong> — <code>x += v</code> และ <code>v += a</code> คือการประมาณการเคลื่อนที่ทีละเฟรม ฟิสิกส์เอนจินจริงเริ่มจากตรงนี้</li>
<li><strong>คูณค่าคงที่ซ้ำ ๆ</strong> = การลดแบบเรขาคณิต ท่าเดียวกับตัวกรองสัญญาณ (low-pass filter) ที่ทำให้ค่าเซนเซอร์นิ่ง</li>
<li><strong>game loop = super-loop ของเฟิร์มแวร์</strong> — <code>game.run()</code> วน <code>on_frame()</code> 30 ครั้งต่อวินาที เหมือนลูปหลักที่อ่านเซนเซอร์แล้วสั่งงานเป็นรอบ ๆ</li>
<li><strong>ช่วงค่าของจอ</strong> — บีบ <code>x</code> ไว้ใน <code>0 … WIDTH − ship.w</code> คือการทำงานกับระบบพิกัดของจอโดยตรง</li>
</ul>
<p><sub>ที่มาภาพ: &quot;Asteroids cabinet&quot; — Joho345, CC BY 4.0, Wikimedia Commons</sub></p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="23" style="" data-marpit-pagination-total="27" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="24" style="--paginate:true;--theme:default;" data-marpit-pagination-total="27">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="25" style="--paginate:true;--theme:default;" data-marpit-pagination-total="27">
<h1 id="%E0%B9%83%E0%B8%8A%E0%B9%89%E0%B8%88%E0%B8%A3%E0%B8%B4%E0%B8%87%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B9%84%E0%B8%AB%E0%B8%99--%E0%B8%A2%E0%B8%B2%E0%B8%99%E0%B8%99%E0%B8%B4%E0%B9%88%E0%B8%87--%E0%B8%9B%E0%B9%89%E0%B8%B2%E0%B8%A2-hud-%E0%B8%82%E0%B8%AD%E0%B8%87-step-1">ใช้จริงที่ไหน — ยานนิ่ง + ป้าย HUD ของ step 1</h1>
<table>
<thead>
<tr>
<th>ระบบจริง</th>
<th>เหมือน step 1 ตรงไหน</th>
</tr>
</thead>
<tbody>
<tr>
<td>แดชบอร์ดรถ / จอเครื่องมือแพทย์</td>
<td>ค่าจริงอยู่ในตัวแปร (<code>score, lives</code>) ป้ายแค่อ่านมาแสดง (<code>hud</code>)</td>
</tr>
<tr>
<td>ขึ้นจอใหม่ในงาน embedded</td>
<td>วาง widget ให้ครบและนิ่งก่อน (<code>on_frame()</code> ว่าง) แล้วค่อยต่อเซนเซอร์</td>
</tr>
<tr>
<td>แอปทั่วไป: แยกข้อมูลออกจากการแสดงผล</td>
<td>แก้ตัวแปรที่เดียว แล้วสั่ง <code>hud.set(...)</code> ให้ป้ายตาม</td>
</tr>
<tr>
<td>เกมเอนจินจริง: อัปเดตเป็นจังหวะคงที่</td>
<td><code>game.run(on_frame, fps=30)</code> เรียกทีละเฟรมเท่า ๆ กัน</td>
</tr>
</tbody>
</table>
<blockquote>
<p>ยานนิ่งกับป้าย HUD ที่ดูเป็นของเล่นวันนี้ คือโครงเดียวกับหน้าจอในเครื่องจริงที่คนใช้ทุกวัน</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="26" style="--paginate:true;--theme:default;" data-marpit-pagination-total="27">
<h1 id="%E0%B8%95%E0%B9%88%E0%B8%AD%E0%B8%A2%E0%B8%AD%E0%B8%94--%E0%B8%84%E0%B8%B4%E0%B8%94%E0%B8%95%E0%B9%88%E0%B8%AD%E0%B9%80%E0%B8%AD%E0%B8%87">ต่อยอด — คิดต่อเอง</h1>
<p>เลือก 1 ข้อ เขียนลงใบงานข้อ 8 ว่า &quot;ถ้าเป็นเรา จะออกแบบยังไง&quot; <strong>ก่อน</strong> แก้โค้ด</p>
<ul>
<li><strong>ยานสองลำ (ผู้เล่น 2 คน)</strong> — แยก <code>ship2</code> + <code>ship2_x</code> อีกชุด หรือเก็บยานทั้งหมดเป็น list แล้ววนจัดการทีเดียว แบบไหนดีกว่า เพราะอะไร</li>
<li><strong>HUD ที่โตขึ้น</strong> — โชว์ <code>score</code>, <code>lives</code> และเวลาที่เหลือ ด้วย <code>game.Text</code> หลายป้าย ค่าไหนอยู่มุมไหน ผูกกับตัวแปรไหน</li>
<li><strong>ตำแหน่งเริ่มแบบสุ่ม</strong> — สุ่ม x ตอนเริ่มเกมแทน <code>365</code> ตายตัว แล้วบีบไม่ให้ยานเกิดนอกจอ</li>
<li><strong>กับดัก <code>global</code></strong> — ลองลบบรรทัด <code>global</code> แล้วดูว่า error อะไร อธิบายว่าเพราะอะไร</li>
<li><strong>ชนขอบแล้วหยุดความเร็ว</strong> — ทำให้ยานไม่ค้างที่ขอบ (ดูสไลด์ &quot;ต่อยอด: ชนขอบแล้วหยุดความเร็ว&quot;)</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="27" style="--paginate:true;--theme:default;" data-marpit-pagination-total="27">
<h1 id="%E0%B8%82%E0%B8%AD%E0%B8%87%E0%B9%80%E0%B8%A5%E0%B9%88%E0%B8%99%E0%B9%83%E0%B8%99%E0%B8%AA%E0%B9%84%E0%B8%A5%E0%B8%94%E0%B9%8C-%E0%B8%88%E0%B8%B9%E0%B8%99-3-%E0%B8%84%E0%B9%88%E0%B8%B2">ของเล่นในสไลด์: จูน 3 ค่า</h1>
<p>ลากแถบแล้วดูยาน &quot;เร่ง · ไถล&quot; ทันที (กดค้าง 1.4 วินาที แล้วปล่อย วนซ้ำ) · ใช้สูตรเดียวกับ step 2 ก่อนไปแก้บนบอร์ดจริง</p>
<div id="tuner" style="background:#0d1117;border:1px solid #30363d;border-radius:10px;padding:8px 12px;margin:6px 0;color:#e6edf3">
<div style="display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin-bottom:6px">
<span>ACCEL <b id="tA" style="color:#ff8f00">1.4</b> <input id="tAs" type="range" min="0.4" max="4" step="0.1" value="1.4" style="vertical-align:middle" /></span>
<span>FRICTION <b id="tF" style="color:#19c8ff">0.80</b> <input id="tFs" type="range" min="0.5" max="0.97" step="0.01" value="0.80" style="vertical-align:middle" /></span>
<span>MAX_SPEED <b id="tM" style="color:#7ee787">13</b> <input id="tMs" type="range" min="3" max="20" step="1" value="13" style="vertical-align:middle" /></span>
</div>
<canvas id="tunecv" style="width:100%;height:110px;display:block;background:#05070a;border-radius:6px"></canvas>
</div>
<p>แถบล่างของกล่องคือ <code>ship_speed</code> · ส้ม = กดอยู่ · ฟ้า = ปล่อยแล้ว</p>
<script src="img/s10_tuner.js"></script>
</section>
