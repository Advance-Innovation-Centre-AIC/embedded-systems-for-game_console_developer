<h1 id="%E0%B8%84%E0%B8%B2%E0%B8%9A-13--%E0%B8%84%E0%B8%B2%E0%B8%9A%E0%B8%9E%E0%B8%B4%E0%B9%80%E0%B8%A8%E0%B8%A9">คาบ 13 — คาบพิเศษ</h1>
<h2 id="%E0%B8%81%E0%B8%A5%E0%B9%88%E0%B8%AD%E0%B8%87%E0%B9%80%E0%B8%84%E0%B8%A3%E0%B8%B7%E0%B9%88%E0%B8%AD%E0%B8%87%E0%B8%A1%E0%B8%B7%E0%B8%AD%E0%B8%99%E0%B8%B1%E0%B8%81%E0%B8%9E%E0%B8%B1%E0%B8%92%E0%B8%99%E0%B8%B2%E0%B9%80%E0%B8%81%E0%B8%A1-%E0%B8%88%E0%B8%B2%E0%B8%81%E0%B9%80%E0%B8%81%E0%B8%A1%E0%B8%AA%E0%B8%B9%E0%B9%88%E0%B8%AB%E0%B8%99%E0%B9%89%E0%B8%B2%E0%B8%88%E0%B8%AD%E0%B8%84%E0%B8%A7%E0%B8%9A%E0%B8%84%E0%B8%B8%E0%B8%A1%E0%B9%83%E0%B8%99%E0%B8%87%E0%B8%B2%E0%B8%99%E0%B8%88%E0%B8%A3%E0%B8%B4%E0%B8%87">กล่องเครื่องมือนักพัฒนาเกม: จากเกมสู่หน้าจอควบคุมในงานจริง</h2>
<p>12 คาบที่ผ่านมา คุณเก็บเทคนิคไว้ครบแล้ว ตั้งแต่ไฟ LED ปุ่ม จอ จอย ฟิสิกส์ เสียง จนถึงชุดหมุนเวียนและการชน</p>
<p>วันนี้เราเอาทุกชิ้นมาวางรวมในกล่องเดียว ดูว่าแต่ละชิ้นทำงานอยู่ตรงไหนในเกมตัวเต็ม และไปอยู่ตรงไหนในหน้าจอควบคุมของโรงงาน คลังสินค้า ฟาร์ม และถนน</p>
</section>

</tr>
<tr>
<td>3</td>

<td>4 · 11 · 12</td>
</tr>
<tr>
<td>4</td>

<p>ทุกการ์ดมีจังหวะเดียวกัน: <strong>ดูสมการ → ดูโค้ดจริง → ลองแก้ตัวเลขหนึ่งตัว → จำกฎหนึ่งบรรทัด</strong></p>
</section>

<tr>
<td><strong>เข้า</strong></td>
<td>รับปุ่ม <code>k = game.keys()</code></td>

<td>อัปเดต: ขยับ ชน นับคะแนน</td>

</tr>
<tr>
<td><strong>ออก</strong></td>
<td>วาด: <code>move_to()</code> <code>set()</code> เสียง</td>
<td><strong>ทำ + โชว์</strong> สั่งเครื่อง อัปเดตจอ เสียงเตือน</td>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">update</span>():
    k = game.keys()            <span class="hljs-comment"># เข้า: รับปุ่ม (วัด)</span>
    <span class="hljs-comment"># ... ขยับ ชน นับคะแนน     # คิด: อัปเดต (ตัดสิน)</span>
    box.move_to(x, y)          <span class="hljs-comment"># ออก: วาด (ทำ + โชว์)</span>
    <span class="hljs-keyword">return</span> <span class="hljs-literal">True</span>                <span class="hljs-comment"># คืน False เมื่อต้องการจบ</span>

game.run(update, fps=<span class="hljs-number">30</span>)       <span class="hljs-comment"># เรียก update() 30 ครั้งต่อวินาที</span>
</code></pre>
<blockquote>
<p><strong>กฎ:</strong> ทุกระบบเรียลไทม์คือวงวนเดียวกัน ต่างกันแค่ว่าอะไรเข้า อะไรออก</p>
</blockquote>
</section>

<h1 id="%E0%B8%81%E0%B8%B2%E0%B8%A3%E0%B9%8C%E0%B8%94-1--%E0%B8%AA%E0%B8%B0%E0%B8%AA%E0%B8%A1%E0%B8%84%E0%B9%88%E0%B8%B2%E0%B8%97%E0%B8%B5%E0%B8%A5%E0%B8%B0%E0%B9%80%E0%B8%9F%E0%B8%A3%E0%B8%A1-%E0%B8%84%E0%B8%B2%E0%B8%9A-5">การ์ด 1 · สะสมค่าทีละเฟรม (คาบ 5)</h1>
<p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>x</mi><mtext>ใหม่</mtext></msub><mo>=</mo><mi>x</mi><mo>+</mo><msub><mi>v</mi><mi>x</mi></msub><mspace width="2em"/><msub><mi>y</mi><mtext>ใหม่</mtext></msub><mo>=</mo><mi>y</mi><mo>+</mo><msub><mi>v</mi><mi>y</mi></msub></mrow><annotation encoding="application/x-tex">x_{\text{ใหม่}} = x + v_x \qquad y_{\text{ใหม่}} = y + v_y
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.5806em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal">x</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3283em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord text mtight"><span class="mord brahmic_fallback mtight">ใหม่</span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6667em;vertical-align:-0.0833em;"></span><span class="mord mathnormal">x</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1514em;"><span style="top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">x</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:2em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">y</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3283em;"><span style="top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord text mtight"><span class="mord brahmic_fallback mtight">ใหม่</span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.7778em;vertical-align:-0.1944em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">y</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.7167em;vertical-align:-0.2861em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1514em;"><span style="top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.0359em;">y</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.2861em;"><span></span></span></span></span></span></span></span></span></span></span></p><pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">ball_x += ball_vx       <span class="hljs-comment"># ขยับลูกตามความเร็ว      (pong_step1.py)</span>
ball_y += ball_vy
</code></pre>

<thead>
<tr>
<th>ในเกม</th>
<th>ในงานจริง</th>
</tr>
</thead>

<tr>
<td>ลูกบอลวิ่ง · ยานลอย · ศัตรูตก</td>
<td><strong>ระดับน้ำในถัง</strong> = เดิม + น้ำเข้า − น้ำออก · ระยะทางที่รถ AGV วิ่งได้ · ยอดชิ้นงานสะสม</td>
</tr>
</tbody>
</table>
<p><strong>ลองแก้:</strong> ใน <code>pong_step1.py</code> เปลี่ยน <code>ball_vx, ball_vy = 6.2, 3.4</code> เป็น <code>3.1, 1.7</code> แล้วทายก่อนรันว่าลูกช้าลงกี่เท่า</p>
<blockquote>
<p><strong>กฎ:</strong> ตำแหน่งไม่ได้ถูกกำหนดทีเดียว แต่ถูก <strong>สะสม</strong> ทีละเฟรม</p>
</blockquote>

<h1 id="%E0%B8%81%E0%B8%B2%E0%B8%A3%E0%B9%8C%E0%B8%94-2--%E0%B8%AA%E0%B8%B0%E0%B8%97%E0%B9%89%E0%B8%AD%E0%B8%99-%E0%B9%81%E0%B8%A5%E0%B8%B0%E0%B8%A1%E0%B8%B8%E0%B8%A1%E0%B8%81%E0%B8%A3%E0%B8%B0%E0%B8%97%E0%B8%9A-%E0%B8%84%E0%B8%B2%E0%B8%9A-5-7">การ์ด 2 · สะท้อน และมุมกระทบ (คาบ 5, 7)</h1>
<p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msub><mi>v</mi><mi>y</mi></msub><mo>←</mo><mo>−</mo><msub><mi>v</mi><mi>y</mi></msub><mspace width="1em"/><mtext>(ชนขอบ)</mtext><mspace width="2em"/><mspace width="2em"/><msub><mi>v</mi><mi>y</mi></msub><mo>+</mo><mo>=</mo><mn>2</mn><mo>⋅</mo><mtext>offset</mtext><mo separator="true">,</mo><mtext>  </mtext><mtext>  </mtext><mtext>offset</mtext><mo>∈</mo><mo stretchy="false">[</mo><mo>−</mo><mn>1</mn><mo separator="true">,</mo><mn>1</mn><mo stretchy="false">]</mo><mspace width="1em"/><mtext>(ชนไม้)</mtext></mrow><annotation encoding="application/x-tex">v_y \leftarrow -v_y \quad \text{(ชนขอบ)} \qquad\qquad v_y \mathrel{+}= 2 \cdot \text{offset}, \;\; \text{offset} \in [-1, 1] \quad \text{(ชนไม้)}
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7167em;vertical-align:-0.2861em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1514em;"><span style="top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.0359em;">y</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.2861em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">←</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1.0361em;vertical-align:-0.2861em;"></span><span class="mord">−</span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1514em;"><span style="top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.0359em;">y</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.2861em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:1em;"></span><span class="mord text"><span class="mord">(</span><span class="mord brahmic_fallback">ชนขอบ</span><span class="mord">)</span></span><span class="mspace" style="margin-right:2em;"></span><span class="mspace" style="margin-right:2em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1514em;"><span style="top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.0359em;">y</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.2861em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel"><span class="mord">+</span></span></span><span class="base"><span class="strut" style="height:0.3669em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">2</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">⋅</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.8889em;vertical-align:-0.1944em;"></span><span class="mord text"><span class="mord">offset</span></span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord text"><span class="mord">offset</span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">∈</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">[</span><span class="mord">−</span><span class="mord">1</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord">1</span><span class="mclose">]</span><span class="mspace" style="margin-right:1em;"></span><span class="mord text"><span class="mord">(</span><span class="mord brahmic_fallback">ชนไม้</span><span class="mord">)</span></span></span></span></span></span></p><pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">if</span> ball_y &lt;= <span class="hljs-number">0</span>:          <span class="hljs-comment"># ชนขอบบน -&gt; กลับทิศแนวตั้ง     (pong_step1.py)</span>
    ball_y = <span class="hljs-number">0</span>
    ball_vy = -ball_vy
    game.sfx(<span class="hljs-string">&quot;wall&quot;</span>)
</code></pre>
<table>
<thead>
<tr>
<th>ในเกม</th>
<th>ในงานจริง</th>
</tr>
</thead>
<tbody>
<tr>
<td>Pong · ทุบอิฐ · ลูกเด้งผนัง</td>
<td>ชิ้นงานกระทบแผ่นเบี่ยงทางบนสายพานแล้วเปลี่ยนทิศ · หุ่นยนต์ดูดฝุ่นกลับทิศเมื่อชนผนัง</td>
</tr>
</tbody>
</table>
<p><strong>ลองแก้:</strong> ลบบรรทัด <code>ball_vy = -ball_vy</code> ของขอบบนออก (เหลือแค่ <code>ball_y = 0</code>) แล้วดูลูก &quot;ไถลติดขอบบน&quot; พร้อมเสียงรัว — สะท้อนต้องมีครบทั้งสองบรรทัด</p>
<blockquote>
<p><strong>กฎ:</strong> สะท้อน = กลับเครื่องหมายความเร็ว <strong>และ</strong> ดึงตำแหน่งกลับเข้าขอบ</p>
</blockquote>
</section>

<h1 id="%E0%B8%81%E0%B8%B2%E0%B8%A3%E0%B9%8C%E0%B8%94-3--%E0%B9%80%E0%B8%A3%E0%B9%88%E0%B8%87-%E0%B8%AB%E0%B8%99%E0%B9%88%E0%B8%A7%E0%B8%87-%E0%B9%81%E0%B8%A5%E0%B8%B0%E0%B9%80%E0%B8%9E%E0%B8%94%E0%B8%B2%E0%B8%99-%E0%B8%84%E0%B8%B2%E0%B8%9A-6-10">การ์ด 3 · เร่ง หน่วง และเพดาน (คาบ 6, 10)</h1>
<p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>v</mi><mo>+</mo><mo>=</mo><mi>a</mi><mtext>  </mtext><mtext>(กดอยู่)</mtext><mspace width="2em"/><mi>v</mi><mo>×</mo><mo>=</mo><mi>f</mi><mtext>  </mtext><mtext>(ปล่อย)</mtext><mspace width="2em"/><mi>v</mi><mo>=</mo><mtext>clamp</mtext><mo stretchy="false">(</mo><mi>v</mi><mo separator="true">,</mo><mo>−</mo><msub><mi>v</mi><mi>max</mi><mo>⁡</mo></msub><mo separator="true">,</mo><msub><mi>v</mi><mi>max</mi><mo>⁡</mo></msub><mo stretchy="false">)</mo><mspace width="2em"/><msub><mi>v</mi><mi>n</mi></msub><mo>=</mo><msub><mi>v</mi><mn>0</mn></msub><msup><mi>f</mi><mrow><mtext> </mtext><mi>n</mi></mrow></msup></mrow><annotation encoding="application/x-tex">v \mathrel{+}= a \;\text{(กดอยู่)} \qquad v \mathrel{\times}= f \;\text{(ปล่อย)} \qquad v = \text{clamp}(v, -v_{\max}, v_{\max}) \qquad v_n = v_0 f^{\,n}

ight:0.1514em;"><span style="top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">n</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.9088em;vertical-align:-0.1944em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">0</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1076em;">f</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.7144em;"><span style="top:-3.113em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mspace mtight" style="margin-right:0.1952em;"></span><span class="mord mathnormal mtight">n</span></span></span></span></span></span></span></span></span></span></span></span></span></p><pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">if</span> keys.up <span class="hljs-keyword">and</span> <span class="hljs-keyword">not</span> keys.down:   player_speed -= ACCEL      <span class="hljs-comment"># (pong_step2.py)</span>
<span class="hljs-keyword">elif</span> keys.down <span class="hljs-keyword">and</span> <span class="hljs-keyword">not</span> keys.up: player_speed += ACCEL
<span class="hljs-keyword">else</span>:                           player_speed *= FRICTION   <span class="hljs-comment"># ปล่อยปุ่ม -&gt; ค่อย ๆ หยุด</span>
player_speed = <span class="hljs-built_in">max</span>(-MAX_SPEED, <span class="hljs-built_in">min</span>(MAX_SPEED, player_speed))
</code></pre>

<p><strong>ลองแก้:</strong> <code>FRICTION = 0.78</code> → <code>0.95</code> แล้วรู้สึกถึงไม้ที่ &quot;ลื่น&quot; ขึ้น · → <code>0.3</code> ไม้หยุดเกือบทันที</p>
<blockquote>
<p><strong>กฎ:</strong> ปุ่มเปลี่ยน <strong>ความเร็ว</strong> ไม่ได้เปลี่ยนตำแหน่ง</p>
</blockquote>
</section>

<h1 id="%E0%B8%81%E0%B8%B2%E0%B8%A3%E0%B9%8C%E0%B8%94-4--%E0%B8%88%E0%B8%B3%E0%B8%81%E0%B8%B1%E0%B8%94%E0%B8%82%E0%B8%AD%E0%B8%9A-%E0%B9%81%E0%B8%A5%E0%B8%B0%E0%B9%80%E0%B8%A3%E0%B9%88%E0%B8%87%E0%B9%81%E0%B8%9A%E0%B8%9A%E0%B8%A1%E0%B8%B5%E0%B9%80%E0%B8%9E%E0%B8%94%E0%B8%B2%E0%B8%99-%E0%B8%84%E0%B8%B2%E0%B8%9A-3">การ์ด 4 · จำกัดขอบ และเร่งแบบมีเพดาน (คาบ 3)</h1>
<p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>x</mi><mo>=</mo><mi>max</mi><mo>⁡</mo><mo stretchy="false">(</mo><mn>0</mn><mo separator="true">,</mo><mi>min</mi><mo>⁡</mo><mo stretchy="false">(</mo><mi>W</mi><mo>−</mo><mi>w</mi><mo separator="true">,</mo><mi>x</mi><mo stretchy="false">)</mo><mo stretchy="false">)</mo><mspace width="2em"/><mspace width="2em"/><mtext>speed</mtext><mo>=</mo><mi>min</mi><mo>⁡</mo><mo stretchy="false">(</mo><mtext>BASE</mtext><mo>+</mo><mtext>hold</mtext><mo separator="true">,</mo><mtext>MAX</mtext><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">x = \max(0, \min(W - w, x)) \qquad\qquad \text{speed} = \min(\text{BASE} + \text{hold}, \text{MAX})
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal">x</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mop">max</span><span class="mopen">(</span><span class="mord">0</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mop">min</span><span class="mopen">(</span><span class="mord mathnormal" style="margin-right:0.1389em;">W</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0269em;">w</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal">x</span><span class="mclose">))</span><span class="mspace" style="margin-right:2em;"></span><span class="mspace" style="margin-right:2em;"></span><span class="mord text"><span class="mord">speed</span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mop">min</span><span class="mopen">(</span><span class="mord text"><span class="mord">BASE</span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord text"><span class="mord">hold</span></span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord text"><span class="mord">MAX</span></span><span class="mclose">)</span></span></span></span></span></p><pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">speed = <span class="hljs-built_in">min</span>(BASE_SPEED + hold_frames, MAX_SPEED)     <span class="hljs-comment"># (s03_box_joystick.py)</span>
</code></pre>
<table>
<thead>
<tr>
<th>ในเกม</th>
<th>ในงานจริง</th>
</tr>
</thead>
<tbody>
<tr>
<td>ตัวละครไม่หลุดจอ · กดค้างแล้ววิ่งเร็วขึ้น</td>
<td>ค่าตั้งอุณหภูมิไม่เกินช่วงปลอดภัย · มอเตอร์มีความเร็วสูงสุด · เคอร์เซอร์เร่งตามเวลาที่ดันก้าน</td>
</tr>
</tbody>
</table>
<p><strong>ลองแก้:</strong> <code>MAX_SPEED = 30</code> → <code>10</code> แล้วกดค้าง — ความเร็วหยุดเพิ่มที่จุดไหน</p>
<blockquote>
<p><strong>กฎ:</strong> ทุกค่าที่เปลี่ยนได้ ต้องมี <strong>ขอบ</strong> เสมอ</p>
</blockquote>
</section>

<h1 id="%E0%B8%81%E0%B8%B2%E0%B8%A3%E0%B9%8C%E0%B8%94-5--%E0%B8%95%E0%B8%B1%E0%B8%A7%E0%B8%84%E0%B8%A7%E0%B8%9A%E0%B8%84%E0%B8%B8%E0%B8%A1%E0%B8%AA%E0%B8%B2%E0%B8%A1%E0%B8%A3%E0%B8%B0%E0%B8%94%E0%B8%B1%E0%B8%9A-%E0%B9%81%E0%B8%A5%E0%B8%B0%E0%B8%8A%E0%B9%88%E0%B8%AD%E0%B8%87%E0%B8%A7%E0%B9%88%E0%B8%B2%E0%B8%87-%E0%B8%84%E0%B8%B2%E0%B8%9A-7">การ์ด 5 · ตัวควบคุมสามระดับ และช่องว่าง (คาบ 7)</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">target_y = ball_y - PADDLE_H / <span class="hljs-number">2</span>                       <span class="hljs-comment"># (pong_step5.py)</span>
<span class="hljs-keyword">if</span> ai_y &lt; target_y - <span class="hljs-number">6</span>:   ai_y += ai_speed   <span class="hljs-comment"># ลูกอยู่ล่างกว่า -&gt; ขยับลง</span>
<span class="hljs-keyword">elif</span> ai_y &gt; target_y + <span class="hljs-number">6</span>: ai_y -= ai_speed   <span class="hljs-comment"># ลูกอยู่บนกว่า -&gt; ขยับขึ้น</span>
                                             <span class="hljs-comment"># อยู่ในช่องว่าง ±6 -&gt; อยู่นิ่ง</span>
</code></pre>
<p><img src="img/ai_deadzone_graph.png" alt="" style="width:330px;" /></p>
<table>
<thead>
<tr>
<th>ในเกม</th>
<th>ในงานจริง</th>
</tr>
</thead>
<tbody>
<tr>
<td>ไม้ AI ขยับขึ้น หยุด หรือลง</td>
<td>วาล์วมอเตอร์ <strong>เปิดเพิ่ม · หยุด · ปิดลง</strong> ตามระดับน้ำ ช่องว่างกันวาล์วสั่นไปมา</td>
</tr>
</tbody>
</table>
<p><strong>ลองแก้:</strong> เปลี่ยน <code>6</code> ทั้งสองที่เป็น <code>0</code> แล้วดูไม้สั่น (เลือกโหมด HARD จะเห็นชัดสุด) — ช่องว่างหายไปเกิดอะไรขึ้น</p>
<blockquote>
<p><strong>กฎ:</strong> ตัวควบคุมที่ดีต้องรู้ว่า &quot;ใกล้พอแล้ว&quot; — ช่องว่างกันการสั่น</p>
</blockquote>
</section>

<h1 id="%E0%B8%81%E0%B8%B2%E0%B8%A3%E0%B9%8C%E0%B8%94-6--%E0%B9%80%E0%B8%A7%E0%B8%A5%E0%B8%B2%E0%B8%84%E0%B8%B7%E0%B8%AD%E0%B8%81%E0%B8%B2%E0%B8%A3%E0%B8%99%E0%B8%B1%E0%B8%9A%E0%B9%80%E0%B8%9F%E0%B8%A3%E0%B8%A1-%E0%B8%84%E0%B8%B2%E0%B8%9A-4-11-12">การ์ด 6 · เวลาคือการนับเฟรม (คาบ 4, 11, 12)</h1>

<td><code>game.game_over()</code> (ป้ายจบเกมชั่วคราว)</td>
<td>−4</td>
</tr>
<tr>
<td>เผื่อไว้</td>
<td>−1</td>
</tr>
<tr>
<td><strong>เหลือให้เกมของคุณ</strong></td>
<td><strong>26</strong></td>
</tr>
</tbody>
</table>
<ul>
<li>กล่อง ข้อความ และภาพ นับชิ้นละหนึ่ง · ทุก <code>move_to()</code> และ <code>set()</code> คือหนึ่งข้อความที่ส่งข้ามแกนประมวลผลไปวาดจอ</li>
<li>Shooter ตัวเต็มเคยมีศัตรู 8 + กระสุน 6 แล้วลดเหลือ 5 + 4 เพื่อให้ลื่น (คาบ 15 เบื้องหลัง)</li>
<li>เกมตัวเต็มของคอร์สใช้: Shooter 25 · Pong 29 · Snake (ภาพสไปรต์) 32 ชิ้น</li>
</ul>
<blockquote>
<p><strong>กฎ:</strong> วาดเฉพาะที่เปลี่ยน ขยับเฉพาะที่ต้องขยับ — จอหน้าเครื่องจักรจริงก็ใช้กฎเดียวกัน</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--theme:default;" data-marpit-pagination-total="24">
<h1 id="%E0%B8%AA%E0%B9%88%E0%B8%A7%E0%B8%99%E0%B8%97%E0%B8%B5%E0%B9%88-4--%E0%B8%AA%E0%B8%96%E0%B8%B2%E0%B8%99%E0%B8%B0-%E0%B9%84%E0%B8%9F%E0%B8%88%E0%B8%A3%E0%B8%B2%E0%B8%88%E0%B8%A3-%E2%86%92-%E0%B9%80%E0%B8%81%E0%B8%A1-%E2%86%92-%E0%B9%80%E0%B8%84%E0%B8%A3%E0%B8%B7%E0%B9%88%E0%B8%AD%E0%B8%87%E0%B8%88%E0%B8%B1%E0%B8%81%E0%B8%A3">ส่วนที่ 4 — สถานะ: ไฟจราจร → เกม → เครื่องจักร</h1>
<table>
<thead>
<tr>
<th>ที่ไหน</th>
<th>สถานะ</th>
<th>เปลี่ยนเมื่อ</th>
</tr>
</thead>
<tbody>
<tr>
<td>ไฟจราจร (คาบ 2)</td>
<td>เขียว → เหลือง → แดง → เขียว</td>
<td>กดปุ่ม · <code>state = (state + 1) % 3</code></td>
</tr>
<tr>
<td>เกม (คาบ 7, 12)</td>
<td>หน้าเริ่ม → เล่น → GAME OVER → เล่นใหม่</td>
<td>กด Start · ชีวิตหมด</td>
</tr>
<tr>
<td><strong>จอเฝ้าโซนรถยก</strong> (โจทย์กลางภาค คลังสินค้า)</td>
<td>NORMAL → WARNING → DANGER → <strong>LOCKOUT</strong></td>
<td>รถเข้าใกล้ · LOCKOUT ค้างจนหัวหน้ากดปลด</td>
</tr>
</tbody>
</table>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">if</span> pressed <span class="hljs-keyword">and</span> <span class="hljs-keyword">not</span> prev_pressed:     <span class="hljs-comment"># จับเฉพาะจังหวะเพิ่งกด (edge)   (s02_button_fsm.py)</span>
    state = (state + <span class="hljs-number">1</span>) % <span class="hljs-number">3</span>          <span class="hljs-comment"># เลื่อนไปสถานะถัดไปแบบวนรอบ</span>
</code></pre>
<ul>
<li>กดหนึ่งครั้ง = นับหนึ่งครั้ง (edge) ใช้กับปุ่ม <strong>รับทราบสัญญาณเตือน</strong> · ในเกมใช้ <code>game.pressed_once()</code></li>
<li>ปุ่ม <strong>หยุด</strong> ทำทันทีไม่ต้องถาม เพราะการหยุดปลอดภัยเสมอ</li>
</ul>
<blockquote>
<p><strong>กฎ:</strong> ระบบอยู่ในสถานะเดียวเสมอ และรู้ชัดว่าอะไรทำให้ย้ายสถานะ</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--theme:default;" data-marpit-pagination-total="24">
<h1 id="%E0%B8%AA%E0%B9%88%E0%B8%A7%E0%B8%99%E0%B8%97%E0%B8%B5%E0%B9%88-5--hud-%E0%B9%83%E0%B8%99%E0%B9%80%E0%B8%81%E0%B8%A1">ส่วนที่ 5 — HUD ในเกม</h1>
<p><img src="img/shooter_endstate.png" alt="" style="width:350px;" /></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">hud = game.Text(<span class="hljs-string">&quot;Score: 0   Lives: 3&quot;</span>, <span class="hljs-number">10</span>, <span class="hljs-number">8</span>, game.WHITE)       <span class="hljs-comment"># (shooter_step4.py)</span>
...
lives -= <span class="hljs-number">1</span>
hud.<span class="hljs-built_in">set</span>(<span class="hljs-string">&quot;Score: %d   Lives: %d&quot;</span> % (score, lives))   <span class="hljs-comment"># อัปเดตเฉพาะตอนค่าเปลี่ยน</span>
</code></pre>
<ol>
<li>ตัวเลขสำคัญอยู่ <strong>มุมเดิมเสมอ</strong> ผู้เล่นไม่ต้องหา</li>
<li>อัปเดต <strong>เฉพาะตอนค่าเปลี่ยน</strong> ไม่ใช่ทุกเฟรม</li>
<li>ข่าวใหญ่ (GAME OVER · ชนะ) อยู่ <strong>กลางจอ ตัวใหญ่</strong></li>
</ol>
<blockquote>
<p><strong>กฎ:</strong> HUD ตอบคำถามเดียว — &quot;ตอนนี้ฉันเป็นยังไง&quot; ภายในครึ่งวินาที</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--theme:default;" data-marpit-pagination-total="24">
<h1 id="hud-%E0%B9%83%E0%B8%99%E0%B9%82%E0%B8%A3%E0%B8%87%E0%B8%87%E0%B8%B2%E0%B8%99--%E0%B8%AB%E0%B8%99%E0%B9%89%E0%B8%B2%E0%B8%88%E0%B8%AD%E0%B8%84%E0%B8%A7%E0%B8%9A%E0%B8%84%E0%B8%B8%E0%B8%A1-hmi">HUD ในโรงงาน — หน้าจอควบคุม (HMI)</h1>
<div style="display:grid;grid-template-columns:3fr 1fr;grid-template-rows:auto 1fr auto;gap:6px;font-size:.66em;margin:4px 0 8px">
<div style="grid-column:1/3;background:#3a3f45;color:#e8eaed;border-radius:6px;padding:6px 10px"><b>แถบสถานะ (บนสุด เห็นตลอด)</b> · สายพาน: ทำงาน · กะเช้า 10:42 · <b>เตือน 1</b></div>
<div style="background:#2b2f34;color:#cfd3d8;border-radius:6px;padding:26px 10px;text-align:center"><b>กลาง · ภาพเคลื่อนไหว</b><br />กล่องไหลบนสายพาน → ประตูคัดแยก → ช่อง A / ช่อง B</div>
<div style="background:#2b2f34;color:#cfd3d8;border-radius:6px;padding:8px 10px"><b>ขวา · ตัวนับ</b><br />ถูก 128<br />ผิด 1<br />โควตาของเสียเหลือ 2</div>
<div style="grid-column:1/3;background:#5c1f1f;color:#ffd7d7;border-radius:6px;padding:6px 10px"><b>บรรทัดเตือน (ล่างสุด)</b> · 10:41 ช่อง B เต็ม — สีสดใช้เฉพาะตอนผิดปกติ</div>
</div>
<ul>
<li><strong>ปกติ = สีเรียบ</strong> (เทา) · <strong>ผิดปกติ = สีเด่น</strong> (เหลือง แดง) — สีแดงมีความหมายเดียว อย่าใช้แดงบอก &quot;ปั๊มปิด&quot;</li>
<li>มาตรฐาน <strong>ISA-101</strong> ให้แต่ละโรงงานเขียนกติกาสีของตัวเอง แล้วใช้ให้ตรงกันทุกจอ แนวที่นิยมคือพื้นเทา ค่าปกติสีเรียบ และสีสดเฉพาะตอนผิดปกติ (high-performance HMI)</li>
</ul>
<blockquote>
<p><strong>กฎ:</strong> เกมใช้สีให้ตื่นเต้น หน้าจอควบคุมใช้สีให้ <strong>คนเห็นปัญหาก่อน</strong></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--theme:default;" data-marpit-pagination-total="24">
<h1 id="%E0%B9%80%E0%B8%81%E0%B8%A1%E0%B8%81%E0%B8%B1%E0%B8%9A%E0%B8%AB%E0%B8%99%E0%B9%89%E0%B8%B2%E0%B8%88%E0%B8%AD%E0%B8%84%E0%B8%A7%E0%B8%9A%E0%B8%84%E0%B8%B8%E0%B8%A1-%E0%B9%83%E0%B8%8A%E0%B9%89%E0%B8%AB%E0%B8%B1%E0%B8%A7%E0%B9%83%E0%B8%88%E0%B9%80%E0%B8%94%E0%B8%B5%E0%B8%A2%E0%B8%A7%E0%B8%81%E0%B8%B1%E0%B8%99">เกมกับหน้าจอควบคุม ใช้หัวใจเดียวกัน</h1>
<table>
<thead>
<tr>
<th>ในเกม</th>
<th>ในหน้าจอควบคุม</th>
<th>เทคนิคเดียวกัน (คาบ)</th>
</tr>
</thead>
<tbody>
<tr>
<td>คะแนน</td>
<td>จำนวนชิ้นงานที่ผลิตได้</td>
<td>ป้าย HUD อัปเดตเมื่อเปลี่ยน (4, 12)</td>
</tr>
<tr>
<td>ชีวิตที่เหลือ</td>
<td>ของในคลังที่เหลือ · โควตาของเสีย</td>
<td>ตัวนับ + เงื่อนไขจบ (12)</td>
</tr>
<tr>
<td>กระสุนชุดหมุนเวียน</td>
<td>กล่องพัสดุบนสายพาน · รถในลานจอด</td>
<td>ชุดหมุนเวียน (11)</td>
</tr>
<tr>
<td>ยิงโดนศัตรู</td>
<td>กล่องผ่านประตูคัดแยก · รถข้ามเส้นหยุด</td>
<td>ชนแบบกล่อง (4, 12)</td>
</tr>
<tr>
<td>GAME OVER</td>
<td>สัญญาณเตือน หรือหยุดเครื่อง</td>
<td>เครื่องสถานะ (2, 7)</td>
</tr>
<tr>
<td>ยานมีน้ำหนัก เร่งแล้วไหลต่อ</td>
<td>สายพานเร่งแล้วค่อย ๆ หยุด</td>
<td>เร่ง + แรงเสียดทาน (6, 10)</td>
</tr>
<tr>
<td>ลูกบอลเคลื่อนทีละเฟรม</td>
<td>ระดับน้ำ = เดิม + น้ำเข้า − น้ำออก</td>
<td>สะสมค่าทีละเฟรม (5)</td>
</tr>
<tr>
<td>ไม้ AI ขึ้น หยุด ลง มีช่องว่าง</td>
<td>วาล์วเปิด หยุด ปิด มีช่องว่าง</td>
<td>ตัวควบคุมสามระดับ (7)</td>
</tr>
</tbody>
</table>
<blockquote>
<p>สิ่งที่เปลี่ยนคือคนที่อยู่หน้าจอ — ผู้เล่น หรือ พนักงาน</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--theme:default;" data-marpit-pagination-total="24">
<h1 id="%E0%B8%AA%E0%B9%88%E0%B8%A7%E0%B8%99%E0%B8%97%E0%B8%B5%E0%B9%88-6--%E0%B8%A0%E0%B8%B2%E0%B8%9E%E0%B8%88%E0%B8%B2%E0%B8%81%E0%B9%80%E0%B8%81%E0%B8%A1%E0%B8%95%E0%B8%B1%E0%B8%A7%E0%B9%80%E0%B8%95%E0%B9%87%E0%B8%A1-20-%E0%B9%81%E0%B8%9A%E0%B8%9A">ส่วนที่ 6 — ภาพจากเกมตัวเต็ม 20 แบบ</h1>
<p><img src="img/shooter_game.png" alt="" style="width:190px;" /> <img src="img/snake_sprite_a.png" alt="" style="width:190px;" /> <img src="img/pong_game.png" alt="" style="width:190px;" /></p>
<table>
<thead>
<tr>
<th>ชื่อภาพ</th>
<th>เกม</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>ship</code> · <code>enemy</code> <code>enemy2</code> <code>enemy3</code> · <code>boom1</code>–<code>boom6</code></td>
<td>Shooter</td>
</tr>
<tr>
<td><code>ball</code> · <code>paddle</code></td>
<td>Pong</td>
</tr>
<tr>
<td><code>bird</code> · <code>pipe_cap</code></td>
<td>Flappy</td>
</tr>
<tr>
<td><code>snake_head_r</code> <code>_d</code> <code>_l</code> <code>_u</code> · <code>snake_body</code> · <code>snake_food</code></td>
<td>Snake</td>
</tr>
</tbody>
</table>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">boom = game.Sprite(<span class="hljs-string">&quot;boom1&quot;</span>, <span class="hljs-number">0</span>, -<span class="hljs-number">50</span>)    <span class="hljs-comment"># สร้างครั้งเดียว จอดไว้นอกจอ</span>
boom.move_to(x, y); boom.frame(<span class="hljs-string">&quot;boom2&quot;</span>)  <span class="hljs-comment"># ย้ายไปจุดที่โดน แล้วเปลี่ยนเฟรม</span>
enemies = game.pool(<span class="hljs-string">&quot;enemy&quot;</span>, <span class="hljs-number">5</span>)        <span class="hljs-comment"># ชุดหมุนเวียนของภาพ (ซ่อนไว้ก่อน)</span>
</code></pre>
<p>ภาพไม่รู้ขนาดตัวเอง ตั้ง <code>s.w</code> <code>s.h</code> ก่อนใช้ <code>game.hit()</code> · สร้างพื้นหลังก่อนเสมอ (ลำดับการวาด = ลำดับการสร้าง) · ดูการตั้ง <code>.w</code> <code>.h</code> ใน <code>full_games/pong_full.py</code> · ดู pool + frame ใน <code>full_games/shooter_full.py</code></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--theme:default;" data-marpit-pagination-total="24">
<h1 id="%E0%B9%80%E0%B8%AD%E0%B8%B2%E0%B8%A0%E0%B8%B2%E0%B8%9E%E0%B9%80%E0%B8%94%E0%B8%B4%E0%B8%A1%E0%B9%84%E0%B8%9B%E0%B9%80%E0%B8%A5%E0%B9%88%E0%B8%B2%E0%B9%80%E0%B8%A3%E0%B8%B7%E0%B9%88%E0%B8%AD%E0%B8%87%E0%B9%83%E0%B8%AB%E0%B8%A1%E0%B9%88">เอาภาพเดิมไปเล่าเรื่องใหม่</h1>
<table>
<thead>
<tr>
<th>ภาพ</th>
<th>ในเกมเดิม</th>
<th>ในเกมของคุณ</th>
<th>ในหน้าจอควบคุม</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>ship</code></td>
<td>ยานผู้เล่น</td>
<td>รถแข่ง · เรือ</td>
<td>โดรนพ่นยา · รถ AGV</td>
</tr>
<tr>
<td><code>enemy</code> <code>enemy2</code> <code>enemy3</code></td>
<td>ศัตรู 3 แบบ</td>
<td>อุกกาบาต · ผี</td>
<td>แมลงศัตรูพืช · ชิ้นงานเสีย 3 แบบ</td>
</tr>
<tr>
<td><code>boom1</code>–<code>boom6</code></td>
<td>ระเบิด</td>
<td>เก็บของสำเร็จ</td>
<td>ชิ้นงานถูกคัดทิ้ง</td>
</tr>
<tr>
<td><code>ball</code></td>
<td>ลูกบอล</td>
<td>อัญมณี</td>
<td>ชิ้นงาน · พัสดุ</td>
</tr>
<tr>
<td><code>paddle</code></td>
<td>ไม้ตี</td>
<td>กำแพง</td>
<td>ประตูคัดแยก · แขนกล</td>

<tr>
<td><code>bird</code></td>
<td>นกเงือก</td>
<td>ตัวเอก</td>
<td>มาสคอตหน้าเริ่มระบบ</td>

<tr>
<td><code>snake_food</code></td>
<td>อาหารงู</td>

</tr>
</tbody>
</table>
<blockquote>
<p><strong>กฎ:</strong> ภาพเดิม ความหมายใหม่ — เขียนเรื่องที่ภาพเล่าก่อน แล้วค่อยเลือกภาพ</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--theme:default;" data-marpit-pagination-total="24">
<h1 id="%E0%B9%80%E0%B8%AA%E0%B8%B5%E0%B8%A2%E0%B8%87--%E0%B9%83%E0%B8%99%E0%B9%80%E0%B8%81%E0%B8%A1%E0%B8%84%E0%B8%B7%E0%B8%AD%E0%B8%A3%E0%B8%B2%E0%B8%87%E0%B8%A7%E0%B8%B1%E0%B8%A5-%E0%B9%83%E0%B8%99%E0%B9%82%E0%B8%A3%E0%B8%87%E0%B8%87%E0%B8%B2%E0%B8%99%E0%B8%84%E0%B8%B7%E0%B8%AD%E0%B8%84%E0%B8%B3%E0%B9%80%E0%B8%95%E0%B8%B7%E0%B8%AD%E0%B8%99">เสียง — ในเกมคือรางวัล ในโรงงานคือคำเตือน</h1>
<table>
<thead>
<tr>
<th>ความหมาย</th>
<th>เสียงสำเร็จรูป (<code>game.sfx(&quot;…&quot;)</code>)</th>
</tr>
</thead>
<tbody>
<tr>
<td>ตอบรับการกด</td>
<td><code>select</code> <code>move</code> <code>back</code> <code>deny</code> <code>start</code></td>
</tr>
<tr>
<td>ได้</td>
<td><code>eat</code> <code>point</code> <code>hit</code> <code>win</code> <code>pong_score</code></td>
</tr>
<tr>
<td>เสีย</td>
<td><code>die</code> <code>fall</code> <code>lose</code> <code>lose_life</code> <code>gameover</code></td>
</tr>
<tr>
<td>การกระทำ</td>
<td><code>fire</code> <code>turn</code> <code>flap</code> <code>wall</code> <code>paddle</code> <code>explode</code></td>
</tr>
</tbody>
</table>
<p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>f</mi><mo>=</mo><mn>440</mn><mo>⋅</mo><msup><mn>2</mn><mrow><mo stretchy="false">(</mo><mi>n</mi><mo>−</mo><mn>69</mn><mo stretchy="false">)</mo><mi mathvariant="normal">/</mi><mn>12</mn></mrow></msup><mspace width="1em"/><mtext>(คาบ 8)</mtext><mspace width="2em"/><mrow><mtext mathvariant="monospace">game.tone(72,</mtext><mtext> </mtext><mtext mathvariant="monospace">ms=150)</mtext></mrow><mtext>  </mtext><mtext>= โด สูง</mtext></mrow><annotation encoding="application/x-tex">f = 440 \cdot 2^{(n - 69)/12} \quad \text{(คาบ 8)} \qquad \texttt{game.tone(72, ms=150)} \;\text{= โด สูง}
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8889em;vertical-align:-0.1944em;"></span><span class="mord mathnormal" style="margin-right:0.1076em;">f</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">440</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">⋅</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1.188em;vertical-align:-0.25em;"></span><span class="mord"><span class="mord">2</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.938em;"><span style="top:-3.113em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mopen mtight">(</span><span class="mord mathnormal mtight">n</span><span class="mbin mtight">−</span><span class="mord mtight">69</span><span class="mclose mtight">)</span><span class="mord mtight">/12</span></span></span></span></span></span></span></span></span><span class="mspace" style="margin-right:1em;"></span><span class="mord text"><span class="mord">(</span><span class="mord brahmic_fallback">คาบ</span><span class="mord"> 8)</span></span><span class="mspace" style="margin-right:2em;"></span><span class="mord text"><span class="mord texttt">game.tone(72, ms=150)</span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mord text"><span class="mord">= </span><span class="mord brahmic_fallback">โด</span><span class="mord"> </span><span class="mord brahmic_fallback">สูง</span></span></span></span></span></span></p><ul>
<li><strong>เกม:</strong> เสียงสั้น คม ทันทีที่เกิดเหตุ — ผู้เล่นรู้ผลโดยไม่ต้องมองจอ</li>
<li><strong>โรงงาน:</strong> แยกระดับ — ด่วนมาก = ถี่ ซ้ำ จนมีคนกดรับทราบ · แจ้งให้ทราบ = ครั้งเดียว</li>
<li>ฟังครบทุกเสียง → <a href="img/sound_video_demo.html"><b>Sound Explorer</b></a></li>
</ul>
<blockquote>
<p><strong>กฎ:</strong> หนึ่งเสียง หนึ่งความหมาย และดัง <strong>เฉพาะตอนเกิดเหตุ</strong></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--theme:default;" data-marpit-pagination-total="24">
<h1 id="%E0%B8%84%E0%B8%A7%E0%B8%B2%E0%B8%A1%E0%B8%AA%E0%B8%99%E0%B8%B8%E0%B8%81%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B8%A1%E0%B8%B2%E0%B8%88%E0%B8%B2%E0%B8%81%E0%B8%84%E0%B8%93%E0%B8%B4%E0%B8%95%E0%B8%A8%E0%B8%B2%E0%B8%AA%E0%B8%95%E0%B8%A3%E0%B9%8C%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B9%80%E0%B8%A3%E0%B8%B5%E0%B8%A2%E0%B8%99%E0%B9%81%E0%B8%A5%E0%B9%89%E0%B8%A7">ความสนุกที่มาจากคณิตศาสตร์ที่เรียนแล้ว</h1>
<table>
<thead>
<tr>
<th>ลูกเล่น</th>
<th>ทำยังไง</th>
<th>สมการ (คาบ)</th>
</tr>
</thead>
<tbody>
<tr>
<td>ยิ่งเก่งยิ่งยาก</td>
<td>ความเร็วศัตรูเพิ่มตามคะแนน แต่มีเพดาน</td>
<td><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>min</mi><mo>⁡</mo><mo stretchy="false">(</mo><mtext>BASE</mtext><mo>+</mo><mtext>score</mtext><mi mathvariant="normal">/</mi><mi mathvariant="normal">/</mi><mn>5</mn><mo separator="true">,</mo><mtext>MAX</mtext><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\min(\text{BASE} + \text{score} // 5, \text{MAX})</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mop">min</span><span class="mopen">(</span><span class="mord text"><span class="mord">BASE</span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord text"><span class="mord">score</span></span><span class="mord">//5</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord text"><span class="mord">MAX</span></span><span class="mclose">)</span></span></span></span> (3)</td>
</tr>
<tr>
<td>โดนแล้วกะพริบ</td>
<td><code>set_color(game.RED)</code> แล้วนับถอยหลัง 6 เฟรมก่อนกลับสีเดิม</td>
<td><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>c</mi><mo>=</mo><mi>max</mi><mo>⁡</mo><mo stretchy="false">(</mo><mn>0</mn><mo separator="true">,</mo><mi>c</mi><mo>−</mo><mn>1</mn><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">c = \max(0, c-1)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal">c</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mop">max</span><span class="mopen">(</span><span class="mord">0</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal">c</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">1</span><span class="mclose">)</span></span></span></span> (11)</td>
</tr>
<tr>
<td>ระเบิดเป็นภาพ</td>
<td>ย้าย <code>boom1</code> ไปจุดที่โดน แสดง 10 เฟรมแล้วซ่อน</td>
<td>นับเฟรม (4)</td>
</tr>
<tr>
<td>รู้สึกมีน้ำหนัก</td>
<td>เร่งแล้วไหลต่อ ไม่หยุดทันที</td>
<td><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>v</mi><mo>×</mo><mo>=</mo><mi>f</mi></mrow><annotation encoding="application/x-tex">v \mathrel{\times}= f</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6667em;vertical-align:-0.0833em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel"><span class="mord">×</span></span></span><span class="base"><span class="strut" style="height:0.3669em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.8889em;vertical-align:-0.1944em;"></span><span class="mord mathnormal" style="margin-right:0.1076em;">f</span></span></span></span> (6)</td>
</tr>
<tr>
<td>ตีแล้วเบี่ยงมุม</td>
<td>ตำแหน่งที่ลูกกระทบไม้กำหนดมุมเด้ง</td>
<td><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>v</mi><mi>y</mi></msub><mo>+</mo><mo>=</mo><mn>2</mn><mo>⋅</mo><mtext>offset</mtext></mrow><annotation encoding="application/x-tex">v_y \mathrel{+}= 2 \cdot \text{offset}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8694em;vertical-align:-0.2861em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">v</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1514em;"><span style="top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.0359em;">y</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.2861em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel"><span class="mord">+</span></span></span><span class="base"><span class="strut" style="height:0.3669em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">2</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">⋅</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6944em;"></span><span class="mord text"><span class="mord">offset</span></span></span></span></span> (7)</td>
</tr>
<tr>
<td>บอสมีแถบพลัง</td>
<td>กล่องเล็ก 5 ก้อน ซ่อนทีละก้อนเมื่อโดน</td>
<td>ตัวนับ (12)</td>
</tr>
</tbody>
</table>
<ul>
<li>อย่าย่อ-ขยายกล่องทุกเฟรม จอจะเป็นรอย ใช้ซ่อน-แสดงแทน</li>
<li><code>game.tone()</code> ไม่ต่อคิว ถ้าใส่ <code>sleep</code> ในวงวน เกมจะค้างตาม</li>
</ul>
<blockquote>
<p><strong>กฎ:</strong> ความสนุกไม่ได้มาจากของเยอะ แต่มาจาก <strong>ผลตอบกลับที่ทันที และชัด</strong></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--theme:default;" data-marpit-pagination-total="24">
<h1 id="%E0%B8%AA%E0%B9%88%E0%B8%A7%E0%B8%99%E0%B8%97%E0%B8%B5%E0%B9%88-7--%E0%B8%95%E0%B8%B1%E0%B8%A7%E0%B8%AD%E0%B8%A2%E0%B9%88%E0%B8%B2%E0%B8%87-shooter-%E0%B8%81%E0%B8%A5%E0%B8%B2%E0%B8%A2%E0%B9%80%E0%B8%9B%E0%B9%87%E0%B8%99%E0%B8%AA%E0%B8%B2%E0%B8%A2%E0%B8%9E%E0%B8%B2%E0%B8%99%E0%B8%84%E0%B8%B1%E0%B8%94%E0%B9%81%E0%B8%A2%E0%B8%81">ส่วนที่ 7 — ตัวอย่าง: Shooter กลายเป็นสายพานคัดแยก</h1>
<table>
<thead>
<tr>
<th>ใน <code>shooter_step4.py</code></th>
<th>ในสายพานคัดแยก</th>
<th>เปลี่ยนอะไรในโค้ด</th>
</tr>
</thead>
<tbody>
<tr>
<td>ศัตรู 6 ตัวตกลงมา ตำแหน่ง x สุ่ม</td>
<td>กล่องพัสดุ 6 ใบไหลลงมากลางสายพาน มี 2 สี</td>
<td>x คงที่กลางสายพาน · สุ่มสีจาก 2 สี แล้ว <strong>จำสีไว้ในลิสต์</strong> <code>box_color[index]</code> (กล่องไม่จำสีตัวเอง)</td>
</tr>
<tr>
<td>ยานเลื่อนซ้าย-ขวาด้วยความเร่ง</td>
<td>ประตูคัดแยก 2 ตำแหน่ง: ช่อง A หรือ B · สายพานเร่งได้</td>
<td>ความเร็วกล่องทุกใบ = <code>belt_speed</code> ตัวเดียว (กด A ค้าง = เร่ง · ปล่อย = <code>belt_speed *= FRICTION</code>) · กดซ้าย/ขวา = สลับช่อง</td>
</tr>
<tr>
<td>กระสุน 6 นัด</td>
<td>ไม่ใช้</td>
<td>ลบออก ได้ของบนจอคืน 6 ชิ้น</td>
</tr>
<tr>
<td>ยิงโดน → Score +1</td>
<td>กล่องถึงประตู ช่องตรงสี → ถูก +1 · ไม่ตรง → ผิด</td>
<td><code>game.hit(กล่อง, ประตู)</code> แล้วเทียบ <code>box_color[index]</code> กับช่อง</td>
</tr>
<tr>
<td>หลุดพื้น → Lives −1</td>
<td>คัดผิด → โควตาของเสีย −1</td>
<td>ตัวแปรเดิม เปลี่ยนชื่อเป็น <code>rejects_left</code></td>
</tr>
<tr>
<td>GAME OVER</td>
<td>หยุดสายพาน: คัดผิดครบ 3 ครั้ง</td>
<td>ข้อความเดิม เปลี่ยนคำ</td>
</tr>
</tbody>
</table>
<blockquote>
<p>โค้ดเดิมส่วนใหญ่ใช้ต่อได้ สิ่งที่เปลี่ยนคือ <strong>ความหมาย</strong> ของแต่ละชิ้น</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-theme="default" lang="en-US" data-marpit-pagination="23" style="--paginate:true;--theme:default;" data-marpit-pagination-total="24">
<h1 id="%E0%B8%AB%E0%B8%99%E0%B9%89%E0%B8%B2%E0%B8%88%E0%B8%AD%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B9%80%E0%B8%84%E0%B8%A5%E0%B8%B7%E0%B9%88%E0%B8%AD%E0%B8%99%E0%B9%84%E0%B8%AB%E0%B8%A7%E0%B9%83%E0%B8%99%E0%B8%87%E0%B8%B2%E0%B8%99%E0%B8%88%E0%B8%A3%E0%B8%B4%E0%B8%87">หน้าจอที่เคลื่อนไหวในงานจริง</h1>
<table>
<thead>
<tr>
<th>งาน</th>
<th>สิ่งที่เคลื่อนไหวบนจอ</th>
<th>เทคนิคจากเกม</th>
</tr>
</thead>
<tbody>
<tr>
<td>โรงงาน</td>
<td>กล่องบนสายพาน · ประตูคัดแยก · ตัวนับ</td>
<td>ชุดหมุนเวียน · ชน · HUD</td>
</tr>
<tr>
<td>คลังสินค้า</td>
<td>รถยกในโซน · ไฟเตือนระดับ</td>
<td>ชน · เครื่องสถานะ · เสียงเตือน</td>
</tr>
<tr>
<td>เกษตร</td>
<td>ระดับน้ำในถังโรงเรือน · วาล์ว</td>
<td>สะสมค่า · จำกัดขอบ · สามระดับ + ช่องว่าง</td>
</tr>
<tr>
<td>จราจร</td>
<td>รถในสี่แยก · ไฟสัญญาณ</td>
<td>เครื่องสถานะ · ชุดหมุนเวียน · ชน</td>
</tr>
<tr>
<td>ลานจอดรถ</td>
<td>รถเข้า-ออก · ป้ายช่องว่าง</td>
<td>ชุดหมุนเวียน · HUD · LED</td>
</tr>
<tr>
<td>ศูนย์ฝึก</td>
<td>เกมจำลองฝึกขับรถยกก่อนลงงานจริง</td>
<td>ทุกอย่างรวมกัน</td>
</tr>
</tbody>
</table>
<blockquote>
<p>ทุกหน้าจอในตารางนี้ทำได้ด้วยเทคนิคจาก 12 คาบ — ของที่คุณทำวันนี้คือ <strong>ต้นแบบเพื่อการเรียน</strong> ตัวเลขเป็นค่าจำลอง</p>
</blockquote>
</section>

<h1 id="%E0%B9%82%E0%B8%9B%E0%B8%A3%E0%B9%80%E0%B8%88%E0%B8%81%E0%B8%95%E0%B9%8C%E0%B9%80%E0%B8%A3%E0%B8%B4%E0%B9%88%E0%B8%A1%E0%B8%A7%E0%B8%B1%E0%B8%99%E0%B8%99%E0%B8%B5%E0%B9%89--%E0%B8%97%E0%B8%B3%E0%B9%80%E0%B8%9B%E0%B9%87%E0%B8%99%E0%B8%84%E0%B8%B9%E0%B9%88-%E0%B8%9B%E0%B8%A3%E0%B8%B0%E0%B9%80%E0%B8%A1%E0%B8%B4%E0%B8%99%E0%B8%A3%E0%B8%B2%E0%B8%A2%E0%B8%84%E0%B8%99">โปรเจกต์เริ่มวันนี้ — ทำเป็นคู่ ประเมินรายคน</h1>
<p><strong>คู่ของคุณ: รออาจารย์ประกาศในคาบ</strong> · โปรเจกต์ของคู่: <strong>เกมของคุณเอง</strong> หรือ <strong>หน้าจอควบคุมที่ยืมเทคนิคจากเกม</strong></p>
<table>
<thead>
<tr>
<th>วัน</th>
<th>สิ่งที่ต้องเสร็จ</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>7 ต.ค. (วันนี้)</strong></td>
<td>รู้คู่ · นัดคุยกันภายในสัปดาห์นี้</td>
</tr>
<tr>
<td><strong>14 ต.ค.</strong></td>
<td>เสนอหัวข้อ: pitch deck ไม่เกิน 6 หน้า + โปสเตอร์ร่างหนึ่งหน้า</td>
</tr>
<tr>
<td><strong>21 ต.ค.</strong></td>
<td>ความก้าวหน้า 1/2: รุ่นแรกที่เล่นได้ รันบนบอร์ด</td>
</tr>
<tr>
<td><strong>28 ต.ค.</strong></td>
<td>ความก้าวหน้า 2/2 และผลงานสุดท้าย + สอบรายคน</td>
</tr>
</tbody>
</table>
<p><strong>ทำงานเป็นคู่ แต่อาจารย์ประเมินรายคนเสมอ</strong></p>
<ol>
<li>ทุกคู่มีตารางว่า <strong>ใครเขียนส่วนไหน</strong></li>
<li>อาจารย์ถามรายคนเรื่องโค้ดที่ <strong>คุณ</strong> เขียน</li>
<li>สอบรายคนด้วย <strong>ไฟล์ตั้งต้นเดียวกันทุกคน</strong> — วัดสิ่งที่คุณทำได้เอง ไม่ใช่สิ่งที่คู่ของคุณทำได้</li>
</ol>
<blockquote>
<p>แนวทาง pitch deck และโปสเตอร์อยู่ในสไลด์คาบ 14 และเอกสารโจทย์ใน Google Classroom · เตรียมตัวสอบรายคนที่ดีที่สุด = เข้าใจทุกบรรทัดของ <code>shooter_step4.py</code> และ <code>s02_button_fsm.py</code></p>
</blockquote>
